<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 树形结构查看器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }
        .header .url {
            font-size: 12px;
            opacity: 0.9;
        }
        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .tree-panel {
            width: 50%;
            overflow-y: auto;
            overflow-x: auto;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 12px;
        }
        .detail-panel {
            width: 50%;
            overflow-y: auto;
            background: #f8fafc;
            padding: 16px;
        }
        .tree-node {
            cursor: pointer;
            user-select: none;
            min-width: fit-content;
            white-space: nowrap;
        }
        .node-header {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.15s;
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .node-header:hover {
            background: #e5e7eb;
        }
        .node-header.selected {
            background: #dbeafe;
            border: 1px solid #3b82f6;
        }
        .toggle-icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            font-size: 10px;
            color: #6b7280;
            flex-shrink: 0;
        }
        .tag-name {
            color: #7c3aed;
            font-weight: 500;
        }
        .node-attrs {
            color: #6b7280;
            font-size: 11px;
            margin-left: 6px;
            white-space: nowrap;
        }
        .node-children {

<body>
    <div class="header">
        <h1>🌳 DOM 树形结构查看器</h1>
        <span class="url" id="pageUrl">加载中...</span>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button id="markdownToggleBtn" onclick="toggleMarkdownView()" title="切换内容显示模式（Markdown 渲染 / 纯文本）" style="background: #6366f1; color: white; font-weight: 600; padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap;">🎨 Markdown</button>
            <button onclick="refreshDomTree()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 12px; border-radius: 4px; cursor: pointer;"> 刷新</button>
        </div>
    </div>
    
    <div class="filter-bar">
        <input type="text" id="filterInput" placeholder="搜索节点内容，支持标签名/class/id/文本...">
        <button
            onclick="applyFilter()"
            title="基于当前可见节点过滤；仅保留匹配关键词的节点及其父节点路径，其他节点保持隐藏。"
            onmouseover="setTip('基于当前可见节点过滤；仅保留匹配关键词的节点及其父节点路径，其他节点保持隐藏。')"
            onmouseout="resetTip()">过滤</button>
        <button onclick="clearFilter()">清除</button>
        <button
            onclick="extractKeyNodes1()"
            title="基于当前可见节点，按每一深度分组，只保留该深度中文本最长的节点；若该深度所有节点均无文本，则全部隐藏。"
            onmouseover="setTip('基于当前可见节点，按每一深度分组，只保留该深度中文本最长的节点；若该深度所有节点均无文本，则全部隐藏。')"
            onmouseout="resetTip()"
            style="background: #10b981; color: white; font-weight: 600;">读取关键节点1</button>
        <button
            onclick="extractKeyNodes2()"
            title="基于当前可见节点，按相邻阶级比较；父阶与子阶内容相同则屏蔽只能生成 div 选择器的节点，否则屏蔽父阶。"
            onmouseover="setTip('基于当前可见节点，按相邻阶级比较；父阶与子阶内容相同则屏蔽只能生成 div 选择器的节点，否则屏蔽父阶。')"
            onmouseout="resetTip()"
            style="background: #2563eb; color: white; font-weight: 600; margin-left: 8px;">读取关键节点2</button>
        <span class="match-count" id="matchCount"></span>
    </div>
    <div class="tip-bar" style="padding: 8px 16px; color: #f3f4f6; font-size: 13px; background: rgba(255,255,255,0.08); border-top: 1px solid rgba(255,255,255,0.08);">
        <strong>提示:</strong> <span id="tipText">“过滤”基于当前可见节点进行过滤；“读取关键节点1”基于当前可见节点按深度保留文本最长节点；“读取关键节点2”基于当前可见节点按相邻阶级对比屏蔽无效选择器节点。</span>
    </div>
    <div class="content">
        <div class="tree-panel" id="treePanel">
            <div class="empty-state">正在加载 DOM 树...</div>
        </div>
        <div class="detail-panel" id="detailPanel">
            <div class="empty-state">点击左侧节点查看详情</div>
        </div>
    </div>
    
    <!-- 自定义弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">提示</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let currentDomTree = null;
        let currentFilter = '';
        let selectedNodeData = null;
        let nodeIdCounter = 0;

        // ✨ 全局变量：控制是否启用 Markdown 渲染视图
        let markdownViewMode = false;

        console.log('[DOMTreeViewer] 脚本已加载');

        // 接收数据
        ipcRenderer.on('set-dom-tree-data', (event, data) => {
            console.log('[DOMTreeViewer] 收到数据，数据类型:', typeof data);
            console.log('[DOMTreeViewer] 数据 keys:', data ? Object.keys(data) : 'null');
            
            if (data && data.tree) {
                console.log('[DOMTreeViewer] 数据存在，tree 类型:', typeof data.tree);
                console.log('[DOMTreeViewer] tree 是否为 null:', data.tree === null);
                console.log('[DOMTreeViewer] tree 是否为 undefined:', data.tree === undefined);
                
                if (data.tree === null || data.tree === undefined) {
                    console.log('[DOMTreeViewer]  tree 是 null/undefined！');
                    document.getElementById('treePanel').innerHTML = '<div class="empty-state">DOM 树数据为空</div>';
                    return;
                }
                
                currentDomTree = data.tree;
                document.getElementById('pageUrl').textContent = data.url || '';
                console.log('[DOMTreeViewer] 开始渲染树，tree.tag:', data.tree.tag);
                console.log('[DOMTreeViewer] tree.children 数量:', data.tree.children ? data.tree.children.length : 0);
                
                try {
                    renderTree(currentDomTree);
                    console.log('[DOMTreeViewer] ✅ 渲染完成');
                } catch (renderError) {
                    console.error('[DOMTreeViewer] ❌ 渲染出错:', renderError);
                    document.getElementById('treePanel').innerHTML = '<div class="empty-state">渲染出错: ' + renderError.message + '</div>';
                }
            } else {
                console.log('[DOMTreeViewer]  数据无效:', data);
                document.getElementById('treePanel').innerHTML = '<div class="empty-state">数据无效</div>';
            }
        });

        // 刷新 DOM 树
        async function refreshDomTree() {

        // 渲染树
        function renderTree(tree) {
            nodeIdCounter = 0;
            const panel = document.getElementById('treePanel');
            if (!tree) {
                panel.innerHTML = '<div class="empty-state">没有 DOM 数据</div>';

        function setupEventListeners() {

            // 为所有节点头部添加点击事件

        // 渲染单个节点
        function renderNode(node, depth) {
            if (!node) return '';
            
            const nodeId = nodeIdCounter++;
            const tag = node.tag || 'unknown';
            const hasChildren = node.children && node.children.length > 0;
            const isExpanded = depth < 6; // 默认展开前 6 层
            
            let attrs = '';
            if (node.id) {
                attrs += ' id="' + node.id + '"';
            }
            if (node.className) {
                const classes = typeof node.className === 'string' ? node.className.split(/\s+/).filter(c => c).slice(0, 3) : [];
                if (classes.length > 0) {
                    const classStr = classes.join(' ') + (node.className.split(/\s+/).length > 3 ? '...' : '');
                    attrs += ' class="' + classStr + '"';
                }
            }
            
            let textPreview = '';
            if (node.innerText && node.innerText.trim()) {
                const txt = node.innerText.trim().substring(0, 200);
                textPreview = ' "' + txt + (txt.length < node.innerText.trim().length ? '...' : '') + '"';
            }
            
            let html = '';
            
            // 节点头部 - 使用 data 属性而非 inline onclick
            html += '<div class="node-header" data-node-id="' + nodeId + '">';
            
            if (hasChildren) {
                html += '<span class="toggle-icon" data-toggle-id="' + nodeId + '">' + (isExpanded ? '▼' : '▶') + '</span>';
            } else {
                html += '<span class="toggle-icon"></span>';
            }
            
            html += '<span class="tag-name">&lt;' + tag + '&gt;</span>';
            html += '<span class="node-attrs">' + buildHeaderContent(node) + '</span>';
            html += '</div>';
            
            // 子节点
            if (hasChildren) {
                html += '<div class="node-children ' + (isExpanded ? 'expanded' : '') + '" data-children-of="' + nodeId + '">';
                for (const child of node.children) {
                    html += renderNode(child, depth + 1);
                }
                html += '</div>';
            }
            
            return html;
        }

        // 切换节点展开/折叠
        function toggleNode(event, nodeId) {
            event.stopPropagation();
            const childrenDiv = document.querySelector(`[data-children-of="${nodeId}"]`);
            const toggleIcon = event.target;
            
            if (childrenDiv) {
                const isExpanded = childrenDiv.classList.contains('expanded');
                childrenDiv.classList.toggle('expanded');
                toggleIcon.textContent = isExpanded ? '▶' : '▼';
            }
        }

        // 选择节点
        function selectNode(nodeId, event) {
            event.stopPropagation();
            
            // 移除之前的选中状态
            document.querySelectorAll('.node-header.selected').forEach(el => el.classList.remove('selected'));
            
            // 添加新的选中状态
            const header = document.querySelector(`[data-node-id="${nodeId}"]`);
            if (header) {
                header.classList.add('selected');
            }
            
            // 查找节点数据
            const nodeData = findNodeById(currentDomTree, nodeId);
            if (nodeData) {
                selectedNodeData = nodeData;
                renderDetail(nodeData);
            }
        }

        // 根据 ID 查找节点
        function findNodeById(tree, targetId) {
            if (!tree) return null;
            
            nodeIdCounter = 0;
            return searchNode(tree, targetId);
        }

        function searchNode(node, targetId) {
            const nodeId = nodeIdCounter++;
            if (nodeId === targetId) return node;
            
            if (node.children) {
                for (const child of node.children) {
                    const found = searchNode(child, targetId);
                    if (found) return found;
                }
            }
            
            return null;
        }

        // 生成选择器
        function generateSelectors(node) {
            const selectors = [];
            if (!node) return selectors;
            
            const tag = node.tag || 'unknown';
            
            // 1. 如果有 ID，使用 ID 选择器
            if (node.id) {
                selectors.push(`#${node.id}`);
            }
            
            // 2. 如果有 data-* 属性，使用 data 选择器
            if (node.dataset) {
                for (const key in node.dataset) {
                    const value = node.dataset[key];
                    if (value) {
                        selectors.push(`${tag}[data-${key}="${value}"]`);
                    }
                }
            }
            
            // 3. 如果有 class，使用 class 选择器
            if (node.className) {
                const classes = node.className.trim().split(/\s+/).filter(c => c);
                if (classes.length > 0) {
                    selectors.push(`${tag}.${classes.slice(0, 2).join('.')}`);
                }
            }
            
            // 4. 标签选择器（最简单）
            selectors.push(tag);
            
            return selectors.slice(0, 5); // 最多返回 5 个
        }

            try {

                    showModal('❌ 测试失败', result?.error || '未知错误');
                }
            } catch (e) {
                console.error('[DOMTreeViewer] 测试出错:', e);
                showModal(' 测试出错', e.message || String(e));
            }
        }

        // 过滤节点（增强版：搜索所有节点内容，并展开匹配节点的路径）
        function applyFilter() {
            const filterText = document.getElementById('filterInput').value.trim();
            currentFilter = filterText.toLowerCase();
            
            if (!currentFilter) {
                clearFilter();
                return;
            }
            
            console.log('[DOMTreeViewer] 开始过滤，关键词:', currentFilter);
            
            // 获取所有节点头部
            const allNodes = document.querySelectorAll('.node-header');
            let matchCount = 0;
            
            // 收集所有匹配的节点 ID
            const matchedNodeIds = new Set();
            
            allNodes.forEach(node => {
                const nodeId = node.dataset.nodeId;
                const text = node.textContent.toLowerCase();
                
                // 检查是否匹配
                if (text.includes(currentFilter)) {
                    matchedNodeIds.add(parseInt(nodeId));
                    matchCount++;
                }
            });
            
            console.log('[DOMTreeViewer] 找到', matchCount, '个匹配节点');
            
            // 对于每个节点，检查它是否有匹配的后代节点，同时只对当前可见节点生效
            let visibleMatchCount = 0;
            allNodes.forEach(node => {
                if (node.style.display === 'none') {
                    return;
                }

                const nodeId = parseInt(node.dataset.nodeId);
                const text = node.textContent.toLowerCase();
                const isMatched = matchedNodeIds.has(nodeId);
                
                // 检查是否有匹配的后代
                let hasMatchedDescendant = false;
                const childrenContainer = document.querySelector(`[data-children-of="${nodeId}"]`);
                if (childrenContainer) {
                    const descendantHeaders = childrenContainer.querySelectorAll('.node-header');
                    descendantHeaders.forEach(descendant => {
                        const descId = parseInt(descendant.dataset.nodeId);
                        if (matchedNodeIds.has(descId)) {
                            hasMatchedDescendant = true;
                        }
                    });
                }
                
                // 如果节点本身匹配，或者有匹配的后代，则保留显示，否则隐藏
                if (isMatched || hasMatchedDescendant) {
                    node.style.display = '';
                    visibleMatchCount++;
                    
                    // 如果是匹配节点的后代路径，自动展开
                    if (hasMatchedDescendant) {
                        const childrenContainer = document.querySelector(`[data-children-of="${nodeId}"]`);
                        if (childrenContainer && !childrenContainer.classList.contains('expanded')) {
                            childrenContainer.classList.add('expanded');
                            // 更新展开/折叠图标
                            const toggleIcon = node.querySelector('.toggle-icon');
                            if (toggleIcon) {
                                toggleIcon.textContent = '▼';
                            }
                        }
                    }
                } else {
                    node.style.display = 'none';
                }
            });
            
            document.getElementById('matchCount').textContent = `匹配 ${visibleMatchCount} 个节点`;
        }

        function clearFilter() {
            document.getElementById('filterInput').value = '';
            currentFilter = '';
            document.querySelectorAll('.node-header').forEach(node => {
                node.style.display = '';
            });
            document.getElementById('matchCount').textContent = '';
        }

        function isRenderedVisible(element) {
            return element && element.style.display !== 'none' && element.offsetParent !== null;
        }

        // 将某个节点所在的所有祖先展开，确保该节点在左侧树中可见
        function expandAncestorsOfHeader(header) {
            if (!header) return;
            // 从 header 向上查找包含它的 .node-children 容器，逐级展开
            let el = header.parentElement;
            while (el) {
                const parentChildren = el.closest('.node-children');
                if (!parentChildren) break;
                if (!parentChildren.classList.contains('expanded')) {
                    parentChildren.classList.add('expanded');
                    const parentId = parentChildren.dataset.childrenOf;
                    if (parentId) {
                        const parentHeader = document.querySelector(`.node-header[data-node-id="${parentId}"]`);
                        if (parentHeader) {
                            const toggleIcon = parentHeader.querySelector('.toggle-icon');
                            if (toggleIcon) toggleIcon.textContent = '▼';
                        }
                    }
                }
                // 上移一层继续处理
                el = parentChildren.parentElement;
            }
        }

        // 读取关键节点1：同一阶只保留内容最多的节点
        function extractKeyNodes1() {
            console.log('[DOMTreeViewer] ===== 开始读取关键节点1 =====');

            if (!currentDomTree) {
                showModal('提示', '请先加载 DOM 树数据');
                return;
            }

            const allNodes = [];
            const nodeDepthMap = new Map();
            let maxDepth = 0;

            function collectNodes(node, depth) {
                if (!node) return;
                allNodes.push(node);
                nodeDepthMap.set(node, depth);
                maxDepth = Math.max(maxDepth, depth);
                if (node.children) {
                    node.children.forEach(child => collectNodes(child, depth + 1));
                }
            }

            collectNodes(currentDomTree, 0);

            const visibleNodes = Array.from(document.querySelectorAll('.node-header'))
                .filter(header => header.style.display !== 'none')
                .map(header => findNodeById(currentDomTree, parseInt(header.dataset.nodeId)))
                .filter(Boolean);

            const hiddenNodes = new Set();

            for (let depth = 0; depth <= maxDepth; depth++) {
                const nodesAtDepth = visibleNodes.filter(node => nodeDepthMap.get(node) === depth);
                if (nodesAtDepth.length === 0) continue;

                // 如果该阶所有节点都没有文本，则屏蔽该阶所有节点
                const allEmpty = nodesAtDepth.every(node => ((node.innerText || '').trim().length === 0));
                if (allEmpty) {
                    nodesAtDepth.forEach(node => hiddenNodes.add(node));
                    continue;
                }

                if (nodesAtDepth.length <= 1) continue;

                const sortedNodes = [...nodesAtDepth].sort((a, b) => {
                    const lenA = (a.innerText || '').trim().length;
                    const lenB = (b.innerText || '').trim().length;
                    return lenB - lenA;
                });

                sortedNodes.slice(1).forEach(item => {
                    hiddenNodes.add(item);
                });
            }

            const allHeaders = document.querySelectorAll('.node-header');
            let visibleCount = 0;
            let hiddenCount = 0;

            allHeaders.forEach(header => {
                const nodeId = parseInt(header.dataset.nodeId);
                const nodeData = findNodeById(currentDomTree, nodeId);
                if (!nodeData) return;

                if (nodeData && hiddenNodes.has(nodeData) && header.style.display !== 'none') {
                    header.style.display = 'none';
                    hiddenCount++;
                } else if (header.style.display !== 'none') {
                    // 已可见节点未被本次过滤命中，保持可见，展开其祖先
                    expandAncestorsOfHeader(header);
                    if (isRenderedVisible(header)) {
                        visibleCount++;
                    }
                }
            });

            document.getElementById('matchCount').textContent = `显示 ${visibleCount} 个关键节点`;
            showModal('读取关键节点1 完成', '逻辑：按同一阶保留内容最长节点，其他节点全部屏蔽。\n\n' +
                `已从 ${allNodes.length} 个节点中提取出 ${visibleCount} 个关键节点\n（屏蔽 ${hiddenCount} 个非关键节点）`);
        }

        // 设置提示文字（用于按钮悬停显示更详细的逻辑说明）
        function setTip(text) {
            const el = document.getElementById('tipText');

        // 重置提示为默认说明
        function resetTip() {

            if (el) el.textContent = '“过滤”基于当前可见节点进行过滤；“读取关键节点1”基于当前可见节点按深度保留文本最长节点；“读取关键节点2”基于当前可见节点按相邻阶级对比屏蔽无效选择器节点。';
        }

        function isOnlyDivSelector(node) {
            const selectors = generateSelectors(node || {});
            return selectors.length === 1 && selectors[0] === 'div';
        }

        // 读取关键节点2：按相邻阶父子比对，父阶与子阶内容相同则屏蔽父阶
        function extractKeyNodes2() {
            console.log('[DOMTreeViewer] ===== 开始读取关键节点2 =====');

            if (!currentDomTree) {
                showModal('提示', '请先加载 DOM 树数据');
                return;
            }

            const allNodes = [];
            const nodeDepthMap = new Map();
            let maxDepth = 0;

            function collectNodes(node, depth) {
                if (!node) return;
                allNodes.push(node);
                nodeDepthMap.set(node, depth);
                maxDepth = Math.max(maxDepth, depth);
                if (node.children) {
                    node.children.forEach(child => collectNodes(child, depth + 1));
                }
            }

            collectNodes(currentDomTree, 0);

            const allHeaders = Array.from(document.querySelectorAll('.node-header'));
            const hiddenNodes = new Set();
            const visibleNodes = [];

            allHeaders.forEach(header => {
                const nodeId = parseInt(header.dataset.nodeId);
                const nodeData = findNodeById(currentDomTree, nodeId);
                if (!nodeData) return;
                if (header.style.display === 'none') {
                    hiddenNodes.add(nodeData);
                } else {
                    visibleNodes.push(nodeData);
                }
            });

            const nodesByDepth = new Map();
            visibleNodes.forEach(node => {
                const depth = nodeDepthMap.get(node);
                if (depth === undefined) return;
                if (!nodesByDepth.has(depth)) nodesByDepth.set(depth, []);
                nodesByDepth.get(depth).push(node);
            });

            for (let depth = 0; depth < maxDepth; depth++) {
                const currentLevel = nodesByDepth.get(depth) || [];
                const nextLevel = nodesByDepth.get(depth + 1) || [];
                if (currentLevel.length === 0 || nextLevel.length === 0) continue;

                currentLevel.forEach(parent => {
                    const parentText = (parent.innerText || '').trim();
                    if (!parentText) return;

                    nextLevel.forEach(child => {
                        const childText = (child.innerText || '').trim();
                        if (childText !== parentText) return;

                        const parentOnlyDiv = isOnlyDivSelector(parent);
                        const childOnlyDiv = isOnlyDivSelector(child);

                        if (parentOnlyDiv) {
                            hiddenNodes.add(parent);
                        }
                        if (childOnlyDiv) {
                            hiddenNodes.add(child);
                        }
                        if (!parentOnlyDiv && !childOnlyDiv) {
                            hiddenNodes.add(parent);
                        }
                    });
                });
            }

            let visibleCount = 0;
            let hiddenCount = 0;

            allHeaders.forEach(header => {
                const nodeId = parseInt(header.dataset.nodeId);
                const nodeData = findNodeById(currentDomTree, nodeId);
                if (!nodeData) return;

                if (hiddenNodes.has(nodeData) && header.style.display !== 'none') {
                    header.style.display = 'none';
                    hiddenCount++;
                } else if (header.style.display !== 'none') {
                    // 已可见节点未被本次过滤命中，保持可见，展开其祖先
                    expandAncestorsOfHeader(header);
                    if (isRenderedVisible(header)) {
                        visibleCount++;
                    }
                }
            });

            document.getElementById('matchCount').textContent = `显示 ${visibleCount} 个关键节点`;
            showModal('读取关键节点2 完成', '逻辑：基于当前显示状态，按相邻阶比较；父阶与子阶内容相同，如果某节点只能生成 div 选择器，则屏蔽该节点，否则屏蔽父阶。\n\n' +
                `已从当前可见节点中提取出 ${visibleCount} 个关键节点\n（总屏蔽 ${hiddenCount} 个节点，包含之前已隐藏节点）`);
        }

        // 工具函数
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeForAttr(text) {
            if (!text) return '';
            return text
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '\\r');
        }

        function escapeRegExp(text) {
            return text.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&');
        }

        function highlightText(text, term) {
            if (!term) return escapeHtml(text);
            const escapedText = escapeHtml(text);
            const escapedTerm = escapeRegExp(term);
            const regex = new RegExp(`(${escapedTerm})`, 'gi');
            return escapedText.replace(regex, '<mark class="highlight">$1</mark>');
        }

        function buildHeaderContent(node) {
            let attrs = '';
            if (node.id) {
                attrs += ' id="' + node.id + '"';
            }
            if (node.className) {
                const classes = typeof node.className === 'string' ? node.className.split(/\s+/).filter(c => c).slice(0, 3) : [];
                if (classes.length > 0) {
                    const classStr = classes.join(' ') + (node.className.split(/\s+/).length > 3 ? '...' : '');
                    attrs += ' class="' + classStr + '"';
                }
            }
            let textPreview = '';
            if (node.innerText && node.innerText.trim()) {
                const txt = node.innerText.trim().substring(0, 200);
                textPreview = ' "' + txt + (txt.length < node.innerText.trim().length ? '...' : '') + '"';
            }
            const content = attrs + textPreview;
            return currentFilter ? highlightText(content, currentFilter) : escapeHtml(content);
        }

        function updateHeaderHighlights() {
            document.querySelectorAll('.node-header').forEach(header => {
                const nodeId = parseInt(header.dataset.nodeId);
                const nodeData = findNodeById(currentDomTree, nodeId);
                if (!nodeData) return;
                const nodeAttrs = header.querySelector('.node-attrs');
                if (nodeAttrs) {
                    nodeAttrs.innerHTML = buildHeaderContent(nodeData);
                }
            });
        }

        /**
         * 🧹 智能清理 HTML（增强版 - 过滤非文本内容 + 清理空白）
         *
         * 解决智谱AI等平台包含大量SVG/MathJax/图表代码导致显示异常的问题
         */
        function cleanHtmlWhitespace(html) {
            console.log('[DOMTreeViewer] 🧹 cleanHtmlWhitespace() v4.0 开始');
            console.log('[DOMTreeViewer] 🧹 输入长度:', html.length);

            let cleaned = html;

            // 🔍 步骤0: 检测是否为"脏HTML"（包含大量Tailwind类名或框架特定标记）
            const isDirtyHtml = /(?:dark:text-|max-w-|flex flex-|border-\[|rounded-|bg-\[|text-\[|p-\[|m-\[)/.test(cleaned);
            
            if (isDirtyHtml) {
                console.log('[DOMTreeViewer] ⚠️ 检测到"脏HTML"（ProseMirror/Tailwind），启用智能清理模式');
                
                // ✅ 新策略：保留HTML结构，只清理垃圾内容
                
                // 步骤A: 移除所有 Tailwind 类名（但保留标签本身）
                cleaned = cleaned.replace(/\s*class="[^"]*(?:dark:text-|max-w-|flex flex-|border-\[|rounded-|bg-\[|text-\[|p-\[|m-\[)[^"]*"/gi, '');
                cleaned = cleaned.replace(/\s*class="[^"]*\b(?:text-|bg-|p-|m-|w-|h-|flex|grid|gap-|rounded|shadow|opacity|transform|transition|duration|ease|hover:|focus:|active:)[^"]*"/gi, '');
                console.log('[DOMTreeViewer] ✅ 已移除Tailwind类名');
                
                // 步骤B: 移除非文本内容块
                const dirtyRemovePatterns = [
                    /<svg[\s\S]*?<\/svg>/gi,
                    /<math[\s\S]*?<\/math>/gi,
                    /<span class="katex[\s\S]*?<\/span>/gi,
                    /<canvas[^>]*><\/canvas>/gi,
                    /<script[\s\S]*?<\/script>/gi,
                    /<style[\s\S]*?<\/style>/gi,
                    /<button[\s\S]*?<\/button>/gi,
                    /<input[^>]*>/gi,
                    /<i class="icon[\s\S]*?<\/i>/gi,
                    /<animate[\s\S]*?<\/animate>/gi,
                    /\s+d="[^"]*"/g,
                    /data:image\/[^;]+;base64,[^"'\s]*/g,
                    /(?:viewBox|d|path|points)="[^"]{50,}"/g
                ];

                let removedCount = 0;
                dirtyRemovePatterns.forEach((pattern, index) => {
                    const before = cleaned.length;
                    cleaned = cleaned.replace(pattern, '');
                    if (cleaned.length < before) {
                        removedCount++;
                    }
                });

                if (removedCount > 0) {
                    console.log(`[DOMTreeViewer] 🗑️ 已移除 ${removedCount} 类非文本内容`);
                }
                
                console.log('[DOMTreeViewer] ✅ 智能清理完成，保留HTML结构:', cleaned.length, '字符');
            }

            // 🔍 步骤1: 移除非文本内容块（标准清理）
            const removePatterns = [
                /<svg[\s\S]*?<\/svg>/gi,
                /<math[\s\S]*?<\/math>/gi,
                /<span class="katex[\s\S]*?<\/span>/gi,
                /<canvas[^>]*><\/canvas>/gi,
                /<script[\s\S]*?<\/script>/gi,
                /<style[\s\S]*?<\/style>/gi,
                /<button[\s\S]*?<\/button>/gi,
                /<input[^>]*>/gi,
                /<i class="icon[\s\S]*?<\/i>/gi,
                /<animate[\s\S]*?<\/animate>/gi,
                /\s+d="[^"]*"/g,
                /data:image\/[^;]+;base64,[^"'\s]*/g,
                /(?:viewBox|d|path|points)="[^"]{50,}"/g
            ];

            let removedCount = 0;
            removePatterns.forEach((pattern, index) => {
                const before = cleaned.length;
                cleaned = cleaned.replace(pattern, '');
                if (cleaned.length < before) {
                    removedCount++;
                    console.log(`[DOMTreeViewer] 🗑️ 已移除模式 ${index + 1}: 长度减少 ${before - cleaned.length}`);
                }
            });

            if (removedCount > 0) {
                console.log(`[DOMTreeViewer] 🗑️ 总共移除了 ${removedCount} 类非文本内容`);
            }

            // 步骤2: 移除标签间的多余空白（但保留单个空格）
            cleaned = cleaned
                .replace(/>\s+</g, '><')
                .replace(/\n\s*\n/g, '\n')
                .replace(/^\s+|\s+$/g, '');

            console.log('[DOMTreeViewer] 🧹 输出长度:', cleaned.length);
            console.log('[DOMTreeViewer] 🧹 压缩率:', ((1 - cleaned.length / html.length) * 100).toFixed(1), '%');

            return cleaned;
        }

        /**
         * 🎨 Markdown 渲染函数
         */
        function renderMarkdown(html) {
            console.log('[DOMTreeViewer] 🎨 renderMarkdown 被调用');

            if (!html) {
                return '<span style="color: #999;">（空内容）</span>';
            }

            if (typeof window.marked === 'undefined' || typeof window.DOMPurify === 'undefined') {
                console.warn('[DOMTreeViewer] ⚠️ 库未加载，返回原始 HTML');
                return html;
            }

            try {
                let processedHtml = html;

                // 🧹 先清理 HTML 中的多余空白（解决表格前大量空行问题）
                if (/<[a-z][\s\S]*>/i.test(html)) {
                    processedHtml = cleanHtmlWhitespace(html);
                    console.log('[DOMTreeViewer] 🧹 已清理 HTML 空白，长度:', html.length, '→', processedHtml.length);
                }

                if (!/<[a-z][\s\S]*>/i.test(processedHtml)) {
                    console.log('[DOMTreeViewer] 📝 检测到纯文本，使用 marked 解析');
                    marked.setOptions({
                        breaks: true,
                        gfm: true,
                        renderer: {
                            listitem(text) {
                                if (text.startsWith('<p>')) {
                                    text = text.replace(/^<p>/, '').replace(/<\/p>$/, '');
                                }
                                return '<li>' + text + '</li>\n';
                            }
                        }
                    });
                    processedHtml = marked.parse(processedHtml);
                } else {
                    console.log('[DOMTreeViewer] 📝 检测到 HTML 格式，直接处理');
                }

                // ✨ 自动格式化 JSON 代码块（解决 JSON 不换行问题）
                processedHtml = formatJsonBlocks(processedHtml);

                const styledHtml = injectInlineStyles(processedHtml);

                const cleanHtml = DOMPurify.sanitize(styledHtml, {
                    ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','ul','ol','li','strong','b','em','i','del','s','u','a','code','pre','blockquote','table','thead','tbody','tr','th','td','img','span','div','sup','sub','mark','kbd'],
                    ALLOWED_ATTR: ['href','target','rel','title','src','alt','style','class'],
                    ADD_ATTR: ['target','style']
                });

                console.log('[DOMTreeViewer] ✅ 渲染完成！');
                return cleanHtml;

            } catch (error) {
                console.error('[DOMTreeViewer] ❌ 渲染错误:', error);
                return `<div style="color: red; padding: 10px; background: #fee2e2; border-radius: 6px;">❌ Markdown 渲染错误: ${error.message}</div>`;
            }
        }

        /**
         * ✨ 自动检测并格式化 JSON 代码块（简洁版 - 只做格式化换行）
         * 目标：实现 webview 中的段落分明效果
         */
        function formatJsonBlocks(html) {
            // 匹配 <pre><code>...</code></pre> 块
            const preCodeRegex = /<pre[^>]*><code[^>]*>([\s\S]*?)<\/code><\/pre>/gi;

            console.log('[DOMTreeViewer] 🔍 formatJsonBlocks() 开始执行');
            console.log('[DOMTreeViewer] 🔍 输入HTML长度:', html.length);

            console.log('[DOMTreeViewer] 🔍 是否包含 <code>:', html.includes('<code'));

            let matchCount = 0;
            let jsonSuccessCount = 0;

            const result = html.replace(preCodeRegex, (match, codeContent) => {
                matchCount++;
                console.log('[DOMTreeViewer] 🔍 找到第', matchCount, '个代码块');
                console.log('[DOMTreeViewer] 🔍 代码块内容长度:', codeContent.length);

                // 清理代码内容（移除 HTML 实体编码等）
                let decodedContent = codeContent
                    .replace(/&lt;/g, '<')
                    .replace(/&gt;/g, '>')
                    .replace(/&amp;/g, '&')
                    .replace(/&quot;/g, '"')
                    .replace(/&#39;/g, "'")
                    .trim();

                console.log('[DOMTreeViewer] 🔍 解码后内容预览(前100字符):', decodedContent.substring(0, 100));
                console.log('[DOMTreeViewer] 🔍 是否包含 <span>:', decodedContent.includes('<span'));

                // 🆕 如果内容已被语法高亮（包含 <span class="token ...">），先提取纯文本
                if (decodedContent.includes('<span')) {
                    console.log('[DOMTreeViewer] 🔄 检测到已高亮的HTML，正在提取纯文本...');
                    decodedContent = extractTextFromHighlightedCode(decodedContent);
                    console.log('[DOMTreeViewer] 🔄 提取后纯文本长度:', decodedContent.length);
                    console.log('[DOMTreeViewer] 🔄 提取后预览(前200字符):', decodedContent.substring(0, 200));
                }

                // 尝试解析为 JSON
                try {
                    const jsonObj = JSON.parse(decodedContent);
                    const formattedJson = JSON.stringify(jsonObj, null, 2);

                    jsonSuccessCount++;
                    console.log('[DOMTreeViewer] ✅ JSON解析成功！格式化后长度:', formattedJson.length);

                    // 转义 HTML 特殊字符
                    const escapedJson = formattedJson
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;');

                    return `<pre style="background: #f8f9fa !important; color: #24292e !important; padding: 16px !important; border-radius: 6px !important; border: 1px solid #e1e4e8 !important; margin: 16px 0 !important; font-family: 'SFMono-Regular', Consolas, monospace !important; font-size: 13px !important; line-height: 1.6 !important; white-space: pre !important; overflow-x: auto !important;"><code style="background: none !important; color: inherit !important; padding: 0 !important;">${escapedJson}</code></pre>`;
                } catch (e) {
                    console.warn('[DOMTreeViewer] ⚠️ JSON解析失败:', e.message);
                    console.warn('[DOMTreeViewer] ⚠️ 原始内容前200字符:', decodedContent.substring(0, 200));
                    return match;
                }
            });

            console.log('[DOMTreeViewer] 📊 formatJsonBlocks() 完成: 找到', matchCount, '个代码块, 成功格式化', jsonSuccessCount, '个JSON');

            return result;
        }

        /**
         * 🆕 从已高亮的代码中提取纯文本
         * 处理 Prism.js / highlight.js 等生成的 <span class="token ..."> 标签
         */
        function extractTextFromHighlightedCode(highlightedHtml) {
            let plainText = highlightedHtml
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/p>/gi, '\n')
                .replace(/<[^>]+>/g, '')
                .replace(/&nbsp;/g, ' ')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&amp;/g, '&')
                .replace(/&quot;/g, '"')
                .trim();

            plainText = plainText
                .replace(/[ \t]+/g, ' ')
                .replace(/\n\s*\n/g, '\n')
                .trim();

            return plainText;
        }
    </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面APP对话</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header-icon {
            font-size: 20px;
        }
        .header-title {
            font-size: 14px;
            font-weight: 600;
        }
        .header-subtitle {
            margin-left: auto;
            font-size: 11px;
            opacity: 0.9;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message-bubble {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sent-row {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            gap: 8px;
        }
        .sent-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 14px;
            border-radius: 16px 16px 4px 16px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }
        .sent-time {
            font-size: 10px;
            opacity: 0.8;
            text-align: right;
            margin-top: 4px;
        }
        .sent-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .received-row {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 8px;
        }
        .received-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .received-bubble {
            background: white;
            color: #1e293b;
            padding: 10px 14px;
            border-radius: 16px 16px 16px 4px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            white-space: pre-wrap;
        }
        .received-time {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .empty-hint {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            padding: 20px;
        }
        .empty-hint-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        /* ===== 黑夜模式 ===== */
        body.dark {
            background: #0f172a;
        }
        body.dark .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        body.dark .sent-bubble {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }
        body.dark .sent-avatar {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        body.dark .received-bubble {
            background: #1e293b;
            color: #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        body.dark .received-time {
            color: #64748b;
        }
        body.dark .empty-hint {
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-icon">🖥️</span>
        <span class="header-title" id="headerTitle">桌面APP对话</span>
        <span class="header-subtitle">历史记录</span>
    </div>
    <div class="messages-container" id="messagesContainer">
        <div class="empty-hint">
            <div class="empty-hint-icon">💬</div>
            <div>开始对话吧！发送的消息和接收的回答都会显示在这里</div>
        </div>
    </div>

    <script>
        let messages = [];

        // 从 URL 参数加载初始数据
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const title = params.get('title');
            const data = params.get('data');

            if (title) {
                document.getElementById('headerTitle').textContent = title + ' - 桌面APP对话';
            }

            if (data) {
                try {
                    messages = JSON.parse(decodeURIComponent(data));
                    renderAll();
                } catch (e) {
                    console.error('解析数据失败:', e);
                }
            }
        }

        // 渲染所有消息
        function renderAll() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-hint">
                        <div class="empty-hint-icon">💬</div>
                        <div>开始对话吧！发送的消息和接收的回答都会显示在这里</div>
                    </div>
                `;
                return;
            }

            messages.forEach(msg => {
                const bubble = createMessageBubble(msg);
                container.appendChild(bubble);
            });

            scrollToBottom();
        }

        // 创建消息气泡
        function createMessageBubble(msg) {
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            const time = msg.time || new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            // 发送的消息
            const sentRow = document.createElement('div');
            sentRow.className = 'sent-row';
            sentRow.innerHTML = `
                <div>
                    <div class="sent-bubble">${escapeHtml(msg.question || '')}</div>
                    <div class="sent-time">${time}</div>
                </div>
                <div class="sent-avatar"></div>
            `;

            // 接收的回答
            const receivedRow = document.createElement('div');
            receivedRow.className = 'received-row';
            receivedRow.innerHTML = `
                <div class="received-avatar">🤖</div>
                <div>
                    <div class="received-bubble">${escapeHtml(msg.answer || '')}</div>
                    <div class="received-time">${time}</div>
                </div>
            `;

            bubble.appendChild(sentRow);
            bubble.appendChild(receivedRow);
            return bubble;
        }

        // 追加单条消息
        function appendMessage(question, answer) {
            const container = document.getElementById('messagesContainer');

            // 移除空提示
            const emptyHint = container.querySelector('.empty-hint');
            if (emptyHint) emptyHint.remove();

            const msg = {
                question: question,
                answer: answer,
                time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
            };

            messages.push(msg);

            const bubble = createMessageBubble(msg);
            container.appendChild(bubble);

            scrollToBottom();
        }

        // 滚动到底部
        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        // HTML 转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 监听来自父窗口的消息
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data && data.type === 'appendMessage') {
                appendMessage(data.question, data.answer);
            } else if (data && data.type === 'loadMessages') {
                messages = data.messages || [];
                renderAll();
            } else if (data && data.type === 'setTitle') {
                document.getElementById('headerTitle').textContent = data.title + ' - 桌面APP对话';
            }
        });

        // 初始化
        loadFromURL();
    </script>
</body>
</html>

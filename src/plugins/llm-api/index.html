<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大模型 API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 20px;
      line-height: 1.6;
    }
    body.dark {
      background: #1e293b;
      color: #e2e8f0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #667eea;
    }
    .config-section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    body.dark .config-section {
      background: #334155;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }
    body.dark label {
      color: #cbd5e1;
    }
    select, input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      color: #1e293b;
      transition: border-color 0.2s;
    }
    body.dark select, body.dark input[type="password"], body.dark textarea {
      background: #475569;
      color: #e2e8f0;
      border-color: #64748b;
    }
    select:focus, input[type="password"]:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: 'Courier New', monospace;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 10px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #475569;
    }
    body.dark .btn-secondary {
      background: #64748b;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    body.dark .btn-secondary:hover {
      background: #475569;
    }
    .result-section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    body.dark .result-section {
      background: #334155;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .result-title {
      font-size: 18px;
      font-weight: 600;
    }
    .status {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .status.loading {
      background: #dbeafe;
      color: #1e40af;
    }
    body.dark .status.loading {
      background: #1e3a8a;
      color: #93c5fd;
    }
    .status.success {
      background: #d1fae5;
      color: #047857;
    }
    body.dark .status.success {
      background: #064e3b;
      color: #6ee7b7;
    }
    .status.error {
      background: #fee2e2;
      color: #b91c1c;
    }
    body.dark .status.error {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .result-content {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      max-height: 500px;
      overflow-y: auto;
    }
    body.dark .result-content {
      background: #475569;
    }
    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    body.dark .hint {
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 大模型 API 调用</h1>
    
    <div class="config-section">
      <div class="form-group">
        <label for="provider">AI 提供商</label>
        <select id="provider">
          <option value="tongyi">阿里云百炼 (通义千问)</option>
          <option value="zhipu">智谱AI (GLM)</option>
          <option value="fangzhou">字节跳动 (火山方舟)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="输入你的 API Key">
        <div class="hint">API Key 仅保存在本地，不会上传到服务器</div>
      </div>

      <div class="form-group">
        <label for="prompt">提示词</label>
        <textarea id="prompt" placeholder="输入你的提示词..."></textarea>
      </div>

      <div>
        <button class="btn btn-primary" id="sendBtn" onclick="sendRequest()">发送请求</button>
        <button class="btn btn-secondary" onclick="clearResult()">清空结果</button>
      </div>
    </div>

    <div class="result-section">
      <div class="result-header">
        <div class="result-title">📋 执行结果</div>
        <div class="status" id="status" style="display: none;"></div>
      </div>
      <div class="result-content" id="result">等待执行...</div>
    </div>
  </div>

  <script>
    // 加载保存的配置
    function loadConfig() {
      try {
        const saved = localStorage.getItem('llm_api_config');
        if (saved) {
          const config = JSON.parse(saved);
          if (config.provider) document.getElementById('provider').value = config.provider;
          if (config.apiKey) document.getElementById('apiKey').value = config.apiKey;
          if (config.prompt) document.getElementById('prompt').value = config.prompt;
        }
      } catch (e) {
        console.error('加载配置失败:', e);
      }
    }

    // 保存配置
    function saveConfig() {
      try {
        const config = {
          provider: document.getElementById('provider').value,
          apiKey: document.getElementById('apiKey').value,
          prompt: document.getElementById('prompt').value
        };
        localStorage.setItem('llm_api_config', JSON.stringify(config));
      } catch (e) {
        console.error('保存配置失败:', e);
      }
    }

    // 显示状态
    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = 'status ' + type;
      statusEl.style.display = 'inline-block';
    }

    // 隐藏状态
    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }

    // 发送请求
    async function sendRequest() {
      const provider = document.getElementById('provider').value;
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();

      if (!apiKey) {
        alert('请输入 API Key');
        return;
      }
      if (!prompt) {
        alert('请输入提示词');
        return;
      }

      // 保存配置
      saveConfig();

      // 禁用按钮
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = '请求中...';

      // 显示加载状态
      showStatus('⏳ 正在调用大模型...', 'loading');
      document.getElementById('result').textContent = '正在等待响应...';

      try {
        const response = await fetch('http://localhost:3000/api/call-llm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            provider: provider,
            model: 'default',
            apiKey: apiKey,
            messages: [
              { role: 'user', content: prompt }
            ]
          })
        });

        const result = await response.json();

        if (result.success) {
          showStatus('✅ 调用成功', 'success');
          document.getElementById('result').textContent = result.data.content || JSON.stringify(result.data, null, 2);
        } else {
          showStatus('❌ 调用失败', 'error');
          document.getElementById('result').textContent = '错误: ' + (result.error || '未知错误');
        }
      } catch (error) {
        showStatus('❌ 请求失败', 'error');
        document.getElementById('result').textContent = '请求失败: ' + error.message;
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '发送请求';
      }
    }

    // 清空结果
    function clearResult() {
      document.getElementById('result').textContent = '等待执行...';
      hideStatus();
    }

    // 页面加载时恢复配置
    loadConfig();

    // 监听主题变化
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'THEME_CHANGED') {
        document.body.classList.toggle('dark', event.data.isDark);
      }
    });

    // 从 URL 参数读取主题
    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === '1') {
      document.body.classList.add('dark');
    }
  </script>
</body>
</html>

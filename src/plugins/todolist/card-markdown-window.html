<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卡片 Markdown</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #57606a;
    --code-bg: #f3f4f6; --border: #e1e4e8; --link: #0969da; --pre-bg: #f6f8fa;
  }
  body.dark {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
    --code-bg: #161b22; --border: #30363d; --link: #58a6ff; --pre-bg: #161b22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    padding: 10px 16px; font-weight: 600; font-size: 15px;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .content { padding: 16px 22px 48px; max-width: 880px; margin: 0 auto; }
  .content h1, .content h2, .content h3 { line-height: 1.3; margin: 1.2em 0 .6em; }
  .content h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .content h2 { font-size: 1.4em; }
  .content h3 { font-size: 1.2em; }
  .content p { margin: .6em 0; }
  .content a { color: var(--link); }
  .content code {
    background: var(--code-bg); padding: .15em .4em; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em;
  }
  .content pre { background: var(--pre-bg); padding: 12px 14px; border-radius: 8px; overflow: auto; }
  .content pre code { background: none; padding: 0; }
  .content blockquote { margin: .8em 0; padding: .2em 1em; border-left: 3px solid var(--border); color: var(--muted); }
  .content ul, .content ol { padding-left: 1.6em; }
  .content img { max-width: 100%; }
  .content table { border-collapse: collapse; }
  .content th, .content td { border: 1px solid var(--border); padding: 4px 8px; }
  /* 卡片内跳转/新窗链接在此窗体中非交互，仅做视觉呈现 */
  .content a.card-jump-link, .content a.card-win-link {
    text-decoration: none; border-bottom: 1px dashed var(--link); color: var(--link); cursor: default;
  }
</style>
</head>
<body>
  <div class="topbar" id="title">卡片</div>
  <div class="content" id="content"></div>
<script>
  (function () {
    // base64url 解码为 UTF-8 字符串（正确处理中文等多字节）
    function b64urlDecodeToUtf8(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const bin = atob(s);
      if (typeof TextDecoder !== 'undefined') {
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      }
      // 兼容回退：decodeURIComponent(escape(bin)) 能把 binary string 还原为 UTF-8 文本
      return decodeURIComponent(escape(bin));
    }
    try {
      const raw = location.hash.slice(1);
      if (!raw) throw new Error('缺少内容数据');
      const data = JSON.parse(b64urlDecodeToUtf8(raw));
      if (data.dark) document.body.classList.add('dark');
      document.getElementById('title').textContent = data.title || '卡片';
      document.title = data.title || '卡片';
      document.getElementById('content').innerHTML = data.html || '';
    } catch (e) {
      document.getElementById('content').textContent = '内容解析失败：' + e.message;
    }
  })();
</script>
</body>
</html>

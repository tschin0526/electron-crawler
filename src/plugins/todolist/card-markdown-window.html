<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卡片 Markdown</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --primary-color: #667eea;
    --border-color: #e2e8f0;
  }
  body.dark {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --primary-color: #818cf8;
    --border-color: #334155;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--card-bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    padding: 8px 14px;
    font-size: 13px; font-weight: 600;
    color: var(--text-secondary);
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-color);
  }
  /* 充分利用窗体面积：去掉 max-width 与居中 margin，左右仅留舒适边距 */
  .content {
    padding: 8px 14px 32px;
    color: var(--text-primary);
    word-break: break-word;
  }
  .content > *:first-child { margin-top: 0; }
  .content > *:last-child  { margin-bottom: 0; }

  /* —— 以下所有 .content 下元素的样式与 src/plugins/todolist/index.html 的
     .todo-text, .md-preview 系列（含 body.dark 覆盖）保持完全一致，
     保证「卡片内显示」与「新窗体显示」色调统一 —— */
  .content h1 { font-size: 1.6em;  font-weight: 700; margin: .8em 0 .4em; }
  .content h2 { font-size: 1.35em; font-weight: 700; margin: .7em 0 .4em; }
  .content h3 { font-size: 1.15em; font-weight: 600; margin: .6em 0 .3em; }
  .content h4 { font-size: 1em;    font-weight: 600; margin: .5em 0 .3em; }
  .content h5 { font-size: .9em;   font-weight: 600; margin: .4em 0 .2em; }
  .content h6 { font-size: .85em;  font-weight: 600; margin: .4em 0 .2em; color: var(--text-secondary); }
  .content p { margin: .6em 0; }
  .content strong { font-weight: 700; }
  .content ul, .content ol { margin: .6em 0; padding-left: 1.6em; }
  .content li { margin: .25em 0; }

  .content code {
    background: #f1f5f9; color: inherit;
    padding: .2em .4em; border-radius: 4px;
    font-size: .875em;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .content pre {
    background: #f6f8fa; padding: 12px; border-radius: 6px;
    overflow-x: auto; margin: .8em 0;
    font-size: .875em; line-height: 1.45;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .content pre code { background: transparent; color: inherit; padding: 0; font-size: 1em; }

  .content blockquote {
    border-left: 4px solid var(--border-color);
    padding: 0 1em; margin: .8em 0;
    color: var(--text-secondary);
  }
  .content a { color: var(--primary-color); text-decoration: underline; }

  .content table { border-collapse: collapse; margin: .8em 0; }
  .content th, .content td { border: 1px solid var(--border-color); padding: .4em .8em; }
  .content th { background: #f6f8fa; font-weight: 600; }

  .content img { max-width: 100%; border-radius: 6px; margin: .5em 0; }
  .content hr  { border: none; border-top: 1px solid var(--border-color); margin: 1em 0; }
  .content del { color: var(--text-secondary); }

  /* GFM 任务列表（task lists） */
  .content ul:has(input[type="checkbox"]) { list-style: none; padding-left: 1.2em; }
  .content li:has(input[type="checkbox"]) { list-style: none; margin-left: -.4em; }
  .content input[type="checkbox"] {
    margin-right: .4em; vertical-align: middle; accent-color: var(--primary-color);
  }
  .content li:has(input[type="checkbox"]:checked) {
    text-decoration: line-through; color: var(--text-secondary);
  }

  /* 卡片内跳转/新窗链接在此窗体中非交互，仅做视觉呈现 */
  .content a.card-jump-link,
  .content a.card-win-link {
    text-decoration: none;
    border-bottom: 1px dashed currentColor;
    cursor: default;
  }

  /* 黑夜模式（与 index.html 的 body.dark .todo-text 系列对齐） */
  body.dark .content,
  body.dark .content *:not(a):not(code):not(pre) {
    color: var(--text-primary) !important;
  }
  body.dark .content a                       { color: var(--primary-color) !important; }
  body.dark .content code                    { background: #334155 !important; color: var(--text-primary) !important; }
  body.dark .content pre                     { background: #0d1117 !important; color: var(--text-primary) !important; }
  body.dark .content pre code                { background: transparent !important; }
  body.dark .content pre code.hljs           { background: transparent !important; color: #c9d1d9 !important; }
  body.dark .content blockquote              { background: #172554 !important; border-left-color: #60a5fa !important; }
  body.dark .content th                      { background: #334155 !important; }
  body.dark .content tr:nth-child(even)      { background: #1e293b !important; }
</style>
</head>
<body>
  <div class="topbar" id="title">卡片</div>
  <div class="content" id="content"></div>
<script>
  (function () {
    // base64url 解码为 UTF-8 字符串（正确处理中文等多字节）
    function b64urlDecodeToUtf8(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const bin = atob(s);
      if (typeof TextDecoder !== 'undefined') {
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      }
      // 兼容回退：decodeURIComponent(escape(bin)) 能把 binary string 还原为 UTF-8 文本
      return decodeURIComponent(escape(bin));
    }
    try {
      const raw = location.hash.slice(1);
      if (!raw) throw new Error('缺少内容数据');
      const data = JSON.parse(b64urlDecodeToUtf8(raw));
      if (data.dark) document.body.classList.add('dark');
      document.getElementById('title').textContent = data.title || '卡片';
      document.title = data.title || '卡片';
      document.getElementById('content').innerHTML = data.html || '';
    } catch (e) {
      document.getElementById('content').textContent = '内容解析失败：' + e.message;
    }
  })();
</script>
</body>
</html>

    let matchedHighlights = [];   // 匹配的高亮元素列表
    let editingId = null;
    let pendingAttachments = [];
    let resizingId = null;
    let resizingEl = null;
    let resizingStartY = 0;
    let resizingStartH = 0;
    let resizingStartX = 0;
    let resizingStartW = 0;
    const MIN_CARD_HEIGHT = 120;
    const MIN_CARD_WIDTH = 60;

    const TAG_COLORS = {};

    const DEFAULT_TAG_LIST = [];

    const TAG_COLOR_CLASSES = [
      'tag-color-1', 'tag-color-2', 'tag-color-3', 'tag-color-4', 
      'tag-color-5', 'tag-color-6', 'tag-color-7', 'tag-color-8',
      'tag-color-9', 'tag-color-10', 'tag-color-11', 'tag-color-12'
    ];

    function getTagColorClass(tag) {
      if (TAG_COLORS[tag]) return TAG_COLORS[tag];
      let hash = 0;
      for (let i = 0; i < tag.length; i++) {
        hash = tag.charCodeAt(i) + ((hash << 5) - hash);
      }
      const colorIndex = Math.abs(hash) % TAG_COLOR_CLASSES.length;
      return TAG_COLOR_CLASSES[colorIndex];
    }

    async function loadTodos() {
      try {
        if (!window.electronAPI) {
          console.warn('[TodoList] electronAPI 不可用，使用 localStorage 作为后备');
          loadTodosFromLocalStorage();
          return;
        }

        const result = await window.electronAPI.loadTodos();
        if (result.success) {
          // success=true 表示加载成功（即使 data 为空数组也是正常状态）
          todos = result.data || [];
          // 数据迁移：给没有 updatedAt 的旧数据补充 updatedAt（使用 createdAt 作为默认值）
          let needSave = false;
          todos.forEach(todo => {
            if (!todo.updatedAt) {
              todo.updatedAt = todo.createdAt || Date.now();
              needSave = true;
            }
          });
          if (needSave) {
            await saveTodos();
            console.log('[TodoList] 已为旧数据补充 updatedAt 字段');
          }
          console.log(`[TodoList] 从独立 JSON 文件加载数据: ${todos.length} 条`);
        } else {
          // 只有 result.success=false 才视为失败，尝试从 localStorage 迁移
          todos = [];
          console.log(`[TodoList] 加载失败，尝试从 localStorage 迁移...`);
          await migrateFromLocalStorage();
        }
      } catch (error) {
        console.error('[TodoList] 加载数据异常:', error);
        todos = [];
        await migrateFromLocalStorage();
      }
      // 加载完成后统计 archived/ 子目录文件数（不依赖 todos 内存列表）
      refreshArchivedCount();
    }

    async function saveTodos() {
      try {
        if (!window.electronAPI) {
          console.warn('[TodoList] electronAPI 不可用，使用 localStorage 作为后备');
          saveTodosToLocalStorage();
          return;
        }

        const result = await window.electronAPI.saveTodos(todos);
        if (result.success) {
          console.log(`[TodoList] 数据已保存到独立 JSON 文件: ${todos.length} 条`);
        } else {
          console.error('[TodoList] 保存数据失败:', result.error);
        }
      } catch (error) {
        console.error('[TodoList] 保存数据异常:', error);
        saveTodosToLocalStorage();
      }
      renderTodos();
      updateStats();
    }

    function loadTodosFromLocalStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          todos = JSON.parse(saved);
        } catch (e) {
          todos = [];
        }
      }
    }

    function saveTodosToLocalStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    async function migrateFromLocalStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const oldData = JSON.parse(saved);
            if (oldData && oldData.length > 0) {
              todos = oldData;
              await window.electronAPI.saveTodos(todos);
              localStorage.removeItem(STORAGE_KEY);
              console.log(`[TodoList] ✅ 已从 localStorage 迁移 ${todos.length} 条数据到独立 JSON 文件`);
            }
          } catch (e) {
            console.warn('[TodoList] localStorage 数据解析失败，跳过迁移');
          }
        }
      } catch (error) {
        console.warn('[TodoList] 迁移失败:', error);
      }
    }

    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const pending = total - completed;
      // 置顶/置底：两者都是独立 boolean；理论上不会同时为 true，
      // 这里直接按字段计数，与排序逻辑保持一致。
      const pinned = todos.filter(t => t.pinned).length;
      const bottom = todos.filter(t => t.bottom).length;

      document.getElementById('totalCount').textContent = total;
      document.getElementById('completedCount').textContent = completed;
      document.getElementById('pendingCount').textContent = pending;
      const pinnedEl = document.getElementById('pinnedCount');
      const bottomEl = document.getElementById('bottomCount');
      if (pinnedEl) pinnedEl.textContent = pinned;
      if (bottomEl) bottomEl.textContent = bottom;
    }

    // 📊 刷新「已归档」计数（数据在 archived/ 子目录里，不在内存 todos，
    // 所以单独从主进程读盘统计）。
    // 安全降级：IPC 不可用或失败时显示 ? 不报错。
    async function refreshArchivedCount() {
      const el = document.getElementById('archivedCount');
      if (!el) return;
      if (!window.electronAPI || !window.electronAPI.getArchivedCount) {
        el.textContent = '?';
        return;
      }
      try {
        const result = await window.electronAPI.getArchivedCount();
        el.textContent = (result && result.success) ? (result.count ?? 0) : '?';
      } catch (e) {
        console.warn('[TodoList] 获取 archived 数量失败:', e);
        el.textContent = '?';
      }
    }

    function getUniqueTags() {
      const tags = new Set();
      todos.forEach(todo => {
        if (todo.tags && Array.isArray(todo.tags)) {
          todo.tags.forEach(tag => tags.add(tag));
        } else if (todo.tag) {
          tags.add(todo.tag);
        }
      });
      return Array.from(tags);
    }

    function renderTagFilter() {
      const container = document.getElementById('tagFilter');
      const tags = getUniqueTags();

      const allActive = currentTagFilter.length === 0;
      let html = `<button class="tag-chip ${allActive ? 'active' : 'inactive'}" onclick="setTagFilter(null)" title="全部标签">全</button>`;
      tags.forEach(tag => {
        const isActive = currentTagFilter.includes(tag);
        const tagShort = tag.length > 1 ? tag.charAt(0) : tag;
        html += `<button class="tag-chip ${isActive ? 'active' : 'inactive'}" onclick="setTagFilter('${tag}')" title="${tag}">${tagShort}</button>`;
      });
      container.innerHTML = html;
    }

    function renderTagsSelector(selectedTags = []) {
      const container = document.getElementById('tagsSelector');
      const inputHtml = '<input type="text" class="tag-input" id="tagInput" placeholder="#标签" onkeydown="handleTagInput(event)">';
      let html = '';
      const allTags = getUniqueTags();
      allTags.forEach(tag => {
        const isSelected = selectedTags.includes(tag);
        html += `<span class="tag-option ${isSelected ? 'selected' : ''}" onclick="toggleTag('${tag}')">${tag}</span>`;
      });
      container.innerHTML = inputHtml + html;
      selectedTagsForModal = selectedTags || [];
    }

    let selectedTagsForModal = [];
    let selectedTodoColor = '';
    // 预览模式：0=文本编辑, 1=Markdown预览, 2=HTML文本编辑, 3=HTML预览（仅当有htmlContent时）
    let previewMode = 0;

    // Markdown 工具函数
    function insertMd(before, after) {
      const textarea = document.getElementById('taskText');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selected = textarea.value.substring(start, end);
      const replacement = before + (selected || '文本') + after;
      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
      textarea.focus();
      const newCursor = start + before.length + (selected ? selected.length : 2);
      textarea.setSelectionRange(newCursor, newCursor + (selected ? 0 : 2));
      // 工具栏插入属于程序化修改，手动记入撤销历史
      pushEditorHistory(textarea, true);
    }

    // ========== 撤销/重做（undo/redo）历史管理 ==========
    const editorHistories = new WeakMap();
    const HISTORY_MAX = 200;
    const HISTORY_DEBOUNCE = 500; // 连续输入 500ms 内合并为一步

    function getEditorHistory(textarea) {
      let h = editorHistories.get(textarea);
      if (!h) {
        h = { stack: [], index: -1, lastTime: 0 };
        editorHistories.set(textarea, h);
      }
      return h;
    }

    function updateHistoryButtons() {
      const overlay = document.getElementById('modalOverlay');
      if (!overlay || overlay.style.display === 'none') return;
      const active = (document.activeElement && editorHistories.has(document.activeElement))
        ? document.activeElement
        : (document.getElementById('htmlText').style.display !== 'none'
            ? document.getElementById('htmlText')
            : document.getElementById('taskText'));
      const h = getEditorHistory(active);
      const undoBtn = document.getElementById('undoBtn');
      const redoBtn = document.getElementById('redoBtn');
      if (undoBtn) undoBtn.disabled = h.index <= 0;
      if (redoBtn) redoBtn.disabled = h.index >= h.stack.length - 1;
    }

    // 记录一步历史。merge=true 时若距上次记录不足 debounce 时间则合并（连续输入算一步）
    function pushEditorHistory(textarea, merge) {
      const h = getEditorHistory(textarea);
      const value = textarea.value;
      const now = Date.now();
      if (merge && h.index >= 0 && h.stack[h.index].value === value) {
        h.lastTime = now;
        return;
      }
      if (merge && h.index >= 0 && (now - h.lastTime) < HISTORY_DEBOUNCE) {
        h.stack[h.index] = { value, selStart: textarea.selectionStart, selEnd: textarea.selectionEnd };
        h.lastTime = now;
      } else {
        h.stack = h.stack.slice(0, h.index + 1);
        h.stack.push({ value, selStart: textarea.selectionStart, selEnd: textarea.selectionEnd });
        if (h.stack.length > HISTORY_MAX) h.stack.shift();
        h.index = h.stack.length - 1;
        h.lastTime = now;
      }
      updateHistoryButtons();
    }

    // 重置历史（打开弹窗 / 程序化整体替换内容时调用）
    function resetEditorHistory(textarea) {
      const h = getEditorHistory(textarea);
      h.stack = [{ value: textarea.value, selStart: textarea.selectionStart, selEnd: textarea.selectionEnd }];
      h.index = 0;
      h.lastTime = 0;
      updateHistoryButtons();
    }

    function editorUndo() {
      const el = document.activeElement;
      const textarea = (el && editorHistories.has(el)) ? el
        : (document.getElementById('htmlText').style.display !== 'none'
            ? document.getElementById('htmlText')
            : document.getElementById('taskText'));
      const h = getEditorHistory(textarea);
      if (h.index <= 0) return;
      h.index--;
      const entry = h.stack[h.index];
      textarea.value = entry.value;
      textarea.focus();
      textarea.setSelectionRange(entry.selStart, entry.selEnd);
      updateHistoryButtons();
    }

    function editorRedo() {
      const el = document.activeElement;
      const textarea = (el && editorHistories.has(el)) ? el
        : (document.getElementById('htmlText').style.display !== 'none'
            ? document.getElementById('htmlText')
            : document.getElementById('taskText'));
      const h = getEditorHistory(textarea);
      if (h.index >= h.stack.length - 1) return;
      h.index++;
      const entry = h.stack[h.index];
      textarea.value = entry.value;
      textarea.focus();
      textarea.setSelectionRange(entry.selStart, entry.selEnd);
      updateHistoryButtons();
    }

    // 绑定输入监听与快捷键（Markdown 编辑器和 HTML 编辑器共用）
    ['taskText', 'htmlText'].forEach(id => {
      const ta = document.getElementById(id);
      ta.addEventListener('input', () => pushEditorHistory(ta, true));
      ta.addEventListener('keydown', (e) => {
        if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
        const key = (e.key || '').toLowerCase();
        if (key === 'z' && !e.shiftKey) {
          e.preventDefault();
          editorUndo();
        } else if ((key === 'z' && e.shiftKey) || key === 'y') {
          e.preventDefault();
          editorRedo();
        }
      });
    });

    function toggleMdPreview() {
      // 切换模式时重置搜索状态
      clearSearchHighlights();
      searchMatches = [];
      currentMatchIndex = -1;
      lastSearchEnterQuery = '';
      document.getElementById('editSearchInput').value = '';
      document.getElementById('searchCount').textContent = '';
      updateSearchNavButtons();

      const preview = document.getElementById('mdPreview');
      const textarea = document.getElementById('taskText');
      const htmlTextarea = document.getElementById('htmlText');
      const btn = document.getElementById('mdToggleBtn');

      // 检查当前卡片是否有 htmlContent
      let hasHtmlContent = false;
      if (editingId) {
        const todo = todos.find(t => t.id === editingId);
        hasHtmlContent = !!(todo && todo.htmlContent);
      }

      // 循环切换：0(文本编辑) -> 1(MD预览) -> 2(HTML文本编辑) -> 3(HTML预览，仅当有htmlContent) -> 0
      if (previewMode === 0) {
        previewMode = 1;
      } else if (previewMode === 1) {
        previewMode = 2;
      } else if (previewMode === 2) {
        previewMode = hasHtmlContent ? 3 : 0;
      } else {
        previewMode = 0;
      }

      // 应用模式
      const genMdBtn = document.getElementById('genMdBtn');
      const genHtmlBtn = document.getElementById('genHtmlBtn');
      if (previewMode === 0) {
        // 文本编辑模式
        preview.classList.remove('show');
        textarea.style.display = '';
        htmlTextarea.style.display = 'none';
        btn.textContent = '编辑文本';
        btn.title = '点击切换到 Markdown 预览';
        btn.classList.remove('active');
        genMdBtn.style.display = 'none';
        genHtmlBtn.style.display = '';
      } else if (previewMode === 1) {
        // Markdown 预览
        preview.classList.add('show');
        preview.innerHTML = renderMarkdown(textarea.value);
        textarea.style.display = 'none';
        htmlTextarea.style.display = 'none';
        btn.textContent = 'Markdown 预览';
        btn.title = hasHtmlContent ? '点击切换到 HTML 文本编辑' : '点击切换到 HTML 文本编辑';
        btn.classList.add('active');
        genMdBtn.style.display = 'none';
        genHtmlBtn.style.display = 'none';
      } else if (previewMode === 2) {
        // HTML 文本编辑模式
        preview.classList.remove('show');
        textarea.style.display = 'none';
        htmlTextarea.style.display = '';
        // 加载当前 HTML 内容到编辑器
        const todo = todos.find(t => t.id === editingId);
        htmlTextarea.value = (todo && todo.htmlContent) ? todo.htmlContent : markdownToHtml(textarea.value);
        resetEditorHistory(htmlTextarea);
        btn.textContent = 'HTML 文本编辑';
        btn.title = hasHtmlContent ? '点击切换到 HTML 预览' : '点击切换到文本编辑';
        btn.classList.add('active');
        genMdBtn.style.display = '';
        genHtmlBtn.style.display = 'none';
      } else {
        // HTML 预览（优先使用当前 HTML 编辑器的内容，其次用原始 htmlContent）
        preview.classList.add('show');
        const htmlValue = htmlTextarea.value.trim();
        if (htmlValue) {
          preview.innerHTML = adaptHtmlForTheme(htmlValue);
        } else {
          const todo = todos.find(t => t.id === editingId);
          if (todo && todo.htmlContent) {
            preview.innerHTML = adaptHtmlForTheme(todo.htmlContent);
          } else {
            preview.innerHTML = markdownToHtml(textarea.value);
          }
        }
        textarea.style.display = 'none';
        htmlTextarea.style.display = 'none';
        btn.textContent = 'HTML 预览';
        btn.title = '点击切换到文本编辑';
        btn.classList.add('active');
        genMdBtn.style.display = 'none';
        genHtmlBtn.style.display = 'none';
      }
    }

    // 搜索功能
    let searchMatches = [];
    let currentMatchIndex = -1;

    function doSearch(shouldNavigate) {
      shouldNavigate = !!shouldNavigate;
      const query = document.getElementById('editSearchInput').value.trim();
      const preview = document.getElementById('mdPreview');
      const textarea = document.getElementById('taskText');
      const htmlTextarea = document.getElementById('htmlText');
      const countSpan = document.getElementById('searchCount');

      // 清除之前的高亮
      clearSearchHighlights();

      if (!query) {
        searchMatches = [];
        currentMatchIndex = -1;
        lastSearchEnterQuery = '';
        countSpan.textContent = '';
        updateSearchNavButtons();
        return;
      }

      // 根据当前模式搜索
      if (previewMode === 0) {
        highlightInTextarea(textarea, query, shouldNavigate);
      } else if (previewMode === 1) {
        highlightInElement(preview, query, shouldNavigate);
      } else if (previewMode === 2) {
        highlightInTextarea(htmlTextarea, query, shouldNavigate);
      } else {
        highlightInElement(preview, query, shouldNavigate);
      }

      // 显示匹配计数
      if (searchMatches.length > 0) {
        countSpan.textContent = `${currentMatchIndex + 1}/${searchMatches.length}`;
      } else {
        countSpan.textContent = '无匹配';
      }
      updateSearchNavButtons();
    }

    function highlightInTextarea(textarea, query, shouldNavigate) {
      shouldNavigate = !!shouldNavigate;
      const text = textarea.value;
      const lowerText = text.toLowerCase();
      const lowerQuery = query.toLowerCase();
      let startIndex = 0;

      searchMatches = [];
      while ((startIndex = lowerText.indexOf(lowerQuery, startIndex)) !== -1) {
        searchMatches.push({ start: startIndex, end: startIndex + query.length });
        startIndex += query.length;
      }

      if (searchMatches.length > 0) {
        currentMatchIndex = 0;
        if (shouldNavigate) {
          // 只有显式触发（Enter/按钮）时才选中并滚动聚焦
          textarea.focus();
          textarea.setSelectionRange(searchMatches[0].start, searchMatches[0].end);
          scrollToMatchInTextarea(textarea, searchMatches[0].start, text);
        }
      } else {
        currentMatchIndex = -1;
      }
    }

    function scrollToMatchInTextarea(textarea, pos, text) {
      const linesBefore = text.substring(0, pos).split('\n').length;
      const lineHeight = parseInt(getComputedStyle(textarea).lineHeight) || 20;
      textarea.scrollTop = Math.max(0, (linesBefore - 2) * lineHeight);
    }

    function highlightInElement(element, query, shouldNavigate) {
      shouldNavigate = !!shouldNavigate;
      const lowerQuery = query.toLowerCase();

      // 只处理文本节点，不破坏 HTML 标签结构
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, {
        acceptNode: function (node) {
          // 跳过 style/script/noscript 等非内容节点，以及已经是 mark 内部的文本
          const parent = node.parentNode;
          if (!parent) return NodeFilter.FILTER_REJECT;
          const tag = parent.nodeName.toLowerCase();
          if (tag === 'style' || tag === 'script' || tag === 'noscript' ||
              (tag === 'mark' && parent.classList.contains('search-highlight'))) {
            return NodeFilter.FILTER_REJECT;
          }
          if (!node.nodeValue || node.nodeValue.trim().length === 0) {
            return NodeFilter.FILTER_SKIP;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const textNodes = [];
      let n;
      while ((n = walker.nextNode())) textNodes.push(n);

      // 逐个文本节点：按匹配位置拆分，用 <mark> 包裹命中片段
      for (let i = 0; i < textNodes.length; i++) {
        const textNode = textNodes[i];
        const text = textNode.nodeValue;
        const lowerText = text.toLowerCase();

        const hitPositions = [];
        let idx = 0;
        while ((idx = lowerText.indexOf(lowerQuery, idx)) !== -1) {
          hitPositions.push({ start: idx, end: idx + query.length });
          idx += query.length;
        }
        if (hitPositions.length === 0) continue;

        const parent = textNode.parentNode;
        const frag = document.createDocumentFragment();
        let cursor = 0;

        for (let h = 0; h < hitPositions.length; h++) {
          const hit = hitPositions[h];
          if (hit.start > cursor) {
            frag.appendChild(document.createTextNode(text.substring(cursor, hit.start)));
          }
          const mark = document.createElement('mark');
          mark.className = 'search-highlight';
          mark.textContent = text.substring(hit.start, hit.end);
          frag.appendChild(mark);
          cursor = hit.end;
        }
        if (cursor < text.length) {
          frag.appendChild(document.createTextNode(text.substring(cursor)));
        }

        parent.replaceChild(frag, textNode);
      }

      const highlights = element.querySelectorAll('.search-highlight');
      searchMatches = Array.from(highlights);

      if (searchMatches.length > 0) {
        currentMatchIndex = 0;
        if (shouldNavigate) {
          searchMatches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
          searchMatches[0].style.outline = '2px solid #ef4444';
          searchMatches[0].style.outlineOffset = '1px';
        }
      } else {
        currentMatchIndex = -1;
      }
    }

    function clearSearchHighlights() {
      const preview = document.getElementById('mdPreview');
      const highlights = preview.querySelectorAll('.search-highlight');
      highlights.forEach(mark => {
        const parent = mark.parentNode;
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize();
      });
    }

    function findNext() {
      if (searchMatches.length === 0) return;

      // 清除上一个的红色边框
      if (previewMode >= 1 && previewMode <= 3) {
        const preview = document.getElementById('mdPreview');
        const highlights = preview.querySelectorAll('.search-highlight');
        highlights.forEach(h => { h.style.outline = ''; h.style.outlineOffset = ''; });
      }

      currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
      const countSpan = document.getElementById('searchCount');
      countSpan.textContent = `${currentMatchIndex + 1}/${searchMatches.length}`;

      if (previewMode === 0 || previewMode === 2) {
        const textarea = previewMode === 0 ? document.getElementById('taskText') : document.getElementById('htmlText');
        const match = searchMatches[currentMatchIndex];
        textarea.focus();
        textarea.setSelectionRange(match.start, match.end);
        scrollToMatchInTextarea(textarea, match.start, textarea.value);
      } else {
        const preview = document.getElementById('mdPreview');
        const highlights = preview.querySelectorAll('.search-highlight');
        if (highlights[currentMatchIndex]) {
          highlights[currentMatchIndex].style.outline = '2px solid #ef4444';
          highlights[currentMatchIndex].style.outlineOffset = '1px';
          highlights[currentMatchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    function findPrev() {
      if (searchMatches.length === 0) return;

      // 清除上一个的红色边框
      if (previewMode >= 1 && previewMode <= 3) {
        const preview = document.getElementById('mdPreview');
        const highlights = preview.querySelectorAll('.search-highlight');
        highlights.forEach(h => { h.style.outline = ''; h.style.outlineOffset = ''; });
      }

      currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
      const countSpan = document.getElementById('searchCount');
      countSpan.textContent = `${currentMatchIndex + 1}/${searchMatches.length}`;

      if (previewMode === 0 || previewMode === 2) {
        const textarea = previewMode === 0 ? document.getElementById('taskText') : document.getElementById('htmlText');
        const match = searchMatches[currentMatchIndex];
        textarea.focus();
        textarea.setSelectionRange(match.start, match.end);
        scrollToMatchInTextarea(textarea, match.start, textarea.value);
      } else {
        const preview = document.getElementById('mdPreview');
        const highlights = preview.querySelectorAll('.search-highlight');
        if (highlights[currentMatchIndex]) {
          highlights[currentMatchIndex].style.outline = '2px solid #ef4444';
          highlights[currentMatchIndex].style.outlineOffset = '1px';
          highlights[currentMatchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    function updateSearchNavButtons() {
      const prevBtn = document.getElementById('searchPrevBtn');
      const nextBtn = document.getElementById('searchNextBtn');
      const hasMatches = searchMatches.length > 0;
      prevBtn.style.display = hasMatches ? 'inline-block' : 'none';
      nextBtn.style.display = hasMatches ? 'inline-block' : 'none';
    }

    let lastSearchEnterQuery = '';

    function doSearchEnter() {
      const query = document.getElementById('editSearchInput').value.trim();

      if (!query) {
        clearSearchHighlights();
        searchMatches = [];
        currentMatchIndex = -1;
        lastSearchEnterQuery = '';
        document.getElementById('searchCount').textContent = '';
        updateSearchNavButtons();
        return;
      }

      if (query !== lastSearchEnterQuery || searchMatches.length === 0) {
        doSearch(true);
        lastSearchEnterQuery = query;
        return;
      }

      findNext();
    }

    function escapeRegex(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    //  智能更新 htmlContent：在原始 HTML 中逐行替换文本，保留所有样式标签
    function updateHtmlContent(oldText, newText, oldHtml) {
      if (!oldHtml || !oldText || !newText) return markdownToHtml(newText);

      const oldLines = oldText.split('\n');
      const newLines = newText.split('\n');

      let result = oldHtml;

      // 逐行替换：在 HTML 中找到旧文本，替换为新文本（保留包裹的 HTML 标签）
      const maxLen = Math.max(oldLines.length, newLines.length);
      for (let i = 0; i < maxLen; i++) {
        const oldLine = (oldLines[i] || '').trim();
        const newLine = (newLines[i] || '').trim();
        if (!oldLine || !newLine || oldLine === newLine) continue;

        // 转义正则特殊字符
        const escapedOld = oldLine.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        // 在 HTML 标签内容中查找并替换（不破坏标签结构）
        const regex = new RegExp(`(?<=>)([^<]*?)${escapedOld}`, 'g');
        if (regex.test(result)) {
          result = result.replace(regex, (match, before) => {
            return '>' + before + newLine;
          });
        }
      }

      return result;
    }

    // 专业 Markdown → HTML 转换器（与邮件插件一致，保留样式）
    function markdownToHtml(md) {
      const mathBlocks = [];
      let preProcessed = md;
      preProcessed = preProcessed.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
        const idx = mathBlocks.length;
        mathBlocks.push({ formula: formula.trim(), display: true });
        return `%%MATHBLOCK_${idx}%%`;
      });
      preProcessed = preProcessed.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)\$(?!\$)/g, (match, formula) => {
        const idx = mathBlocks.length;
        mathBlocks.push({ formula: formula.trim(), display: false });
        return `%%MATHBLOCK_${idx}%%`;
      });
      const lines = preProcessed.split('\n');
      let html = '';
      let inTable = false;
      let tableHeaderDone = false;
      function processInline(text) {
        return text.replace(/\*\*(.+?)\*\*/g, '<strong style="background: linear-gradient(120deg, #fef3c7 0%, #fde68a 100%); color: #7c2d12; padding: 2px 6px; border-radius: 4px; font-weight: 700;">$1</strong>');
      }
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('|') && line.endsWith('|') && line.split('|').length > 2) {
          const cells = line.split('|').slice(1, -1).map(c => c.trim());
          if (cells.every(c => /^[-:]+$/.test(c))) continue;
          if (!inTable) { html += '<table style="border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 12px; table-layout: fixed;">'; inTable = true; tableHeaderDone = false; }
          if (!tableHeaderDone) {
            const colCount = cells.length;
            const colWidths = [];
            if (colCount >= 2) { colWidths.push('18%'); colWidths.push('12%'); const remaining = 100 - 18 - 12; const eachWidth = (remaining / (colCount - 2)).toFixed(1) + '%'; for (let j = 2; j < colCount; j++) colWidths.push(eachWidth); }
            html += '<colgroup>'; colWidths.forEach(w => { html += `<col style="width: ${w};">`; }); html += '</colgroup>';
            html += '<thead><tr>'; cells.forEach(c => { html += `<th style="border: 1px solid #d1d5db; padding: 5px 6px; background: #f1f5f9; text-align: center; font-weight: 600; color: #1e293b; word-break: break-all;">${processInline(c)}</th>`; }); html += '</tr></thead><tbody>'; tableHeaderDone = true;
          } else { html += '<tr>'; cells.forEach((c, ci) => { const align = ci === 0 ? 'left' : 'center'; html += `<td style="border: 1px solid #d1d5db; padding: 5px 6px; color: #1e293b; text-align: ${align}; word-break: break-all;">${processInline(c)}</td>`; }); html += '</tr>'; }
        } else {
          if (inTable) { html += '</tbody></table>'; inTable = false; }
          if (line.startsWith('## ')) { html += `<h3 style="margin: 16px 0 8px 0; color: #2563eb; font-size: 15px;">${processInline(line.replace(/^##\s*/, ''))}</h3>`; }
          else if (line.startsWith('### ')) { html += `<h4 style="margin: 12px 0 6px 0; color: #3b82f6; font-size: 14px;">${processInline(line.replace(/^###\s*/, ''))}</h4>`; }
          else if (line.startsWith('#### ')) { html += `<h5 style="margin: 10px 0 5px 0; color: #2563eb; font-size: 13px; font-weight: 600;">${processInline(line.replace(/^####\s*/, ''))}</h5>`; }
          else if (line.startsWith('- ') || line.startsWith('* ')) { html += `<p style="margin: 4px 0 4px 16px; color: #1e293b;">• ${processInline(line.replace(/^[-*]\s*/, ''))}</p>`; }
          else if (line === '') { html += '<br>'; }
          else { html += `<p style="margin: 4px 0; color: #1e293b;">${processInline(line)}</p>`; }
        }
      }
      if (inTable) html += '</tbody></table>';
      if (mathBlocks.length > 0 && typeof katex !== 'undefined') {
        html = html.replace(/%%MATHBLOCK_(\d+)%%/g, (match, idx) => {
          const block = mathBlocks[parseInt(idx)]; if (!block) return match;
          try { const rendered = katex.renderToString(block.formula, { displayMode: block.display, throwOnError: false, strict: false }); return block.display ? `<div style="text-align:center;margin:12px 0;padding:8px 0;background:#f8fafc;border-radius:6px;">${rendered}</div>` : `<span style="display:inline-block;vertical-align:middle;margin:0 2px;">${rendered}</span>`; }
          catch (e) { return `<code style="background:#fee2e2;color:#dc2626;padding:2px 6px;border-radius:4px;font-family:monospace;">${block.formula}</code>`; }
        });
      } else if (mathBlocks.length > 0) {
        html = html.replace(/%%MATHBLOCK_(\d+)%%/g, (match, idx) => { const block = mathBlocks[parseInt(idx)]; return block ? `<code>${block.formula}</code>` : match; });
      }
      return html;
    }

    // HTML 转 Markdown
    function htmlToMarkdown(html) {
      if (!html || !html.trim()) return '';
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;

      function processNode(node, listDepth) {
        listDepth = listDepth || 0;
        let result = '';
        const indent = '  '.repeat(listDepth);

        node.childNodes.forEach(child => {
          if (child.nodeType === Node.TEXT_NODE) {
            result += child.textContent;
          } else if (child.nodeType === Node.ELEMENT_NODE) {
            const tag = child.tagName.toLowerCase();
            const inner = processNode(child, listDepth);

            if (tag === 'br') {
              result += '\n';
            } else if (['h1','h2','h3','h4','h5','h6'].includes(tag)) {
              const level = parseInt(tag[1]);
              const prefix = '#'.repeat(Math.min(level + 1, 4));
              result += `\n${prefix} ${child.textContent.trim()}\n`;
            } else if (tag === 'p') {
              result += `${inner}\n`;
            } else if (tag === 'strong' || tag === 'b') {
              result += `**${child.textContent}**`;
            } else if (tag === 'em' || tag === 'i') {
              result += `*${child.textContent}*`;
            } else if (tag === 'code') {
              result += `\`${child.textContent}\``;
            } else if (tag === 'pre') {
              result += `\n\`\`\`\n${child.textContent}\n\`\`\`\n`;
            } else if (tag === 'a') {
              const href = child.getAttribute('href') || '';
              result += `[${child.textContent}](${href})`;
            } else if (tag === 'img') {
              const src = child.getAttribute('src') || '';
              const alt = child.getAttribute('alt') || '';
              result += `![${alt}](${src})`;
            } else if (tag === 'ul' || tag === 'ol') {
              let items = [];
              child.querySelectorAll(':scope > li').forEach((li, idx) => {
                const marker = tag === 'ol' ? `${idx + 1}. ` : '- ';
                items.push(indent + marker + processNode(li, listDepth + 1).trim());
              });
              if (items.length) result += `\n${items.join('\n')}\n`;
            } else if (tag === 'li') {
              result += inner;
            } else if (tag === 'table') {
              const rows = [];
              child.querySelectorAll('tr').forEach(tr => {
                const cells = [];
                tr.querySelectorAll('th, td').forEach(cell => {
                  cells.push(cell.textContent.trim());
                });
                rows.push(`| ${cells.join(' | ')} |`);
              });
              if (rows.length > 0 && rows[0]) {
                const sep = rows[0].split('|').map(() => '---').join('|').replace(/^\||\|$/g, '');
                rows.splice(1, 0, `| ${sep} |`);
              }
              if (rows.length) result += `\n${rows.join('\n')}\n`;
            } else if (tag === 'blockquote') {
              const lines = processNode(child, listDepth).trim().split('\n');
              result += '\n' + lines.map(l => `> ${l}`).join('\n') + '\n';
            } else if (tag === 'hr') {
              result += '\n---\n';
            } else if (tag === 'input') {
              const checked = child.checked || child.getAttribute('checked') !== null;
              result += `[${checked ? 'x' : ' '}] `;
            } else if (['span','div','small','big','sub','sup','font'].includes(tag)) {
              result += child.textContent;
            } else {
              result += inner;
            }
          }
        });
        return result;
      }

      let md = processNode(tempDiv, 0);
      // 清理多余空行
      md = md.replace(/\n{3,}/g, '\n\n').trim();
      return md;
    }

    // "生成MD"按钮：将 HTML 编辑器内容转为 Markdown，填入 Markdown 编辑器
    function generateMdFromHtml() {
      const htmlTextarea = document.getElementById('htmlText');
      const textarea = document.getElementById('taskText');
      const htmlValue = htmlTextarea.value.trim();
      if (!htmlValue) {
        alert('HTML 内容为空，无法转换');
        return;
      }
      const md = htmlToMarkdown(htmlValue);
      if (!md.trim()) {
        alert('转换后的 Markdown 内容为空');
        return;
      }
      textarea.value = md;
      resetEditorHistory(textarea);
      // 保存到 todo.text（不更新 updatedAt）
      if (editingId) {
        const todo = todos.find(t => t.id === editingId);
        if (todo) {
          todo.text = md;
          saveTodosSilent();
        }
      }
      alert('已从 HTML 生成 Markdown 文本');
    }

    // "生成HTML"按钮：将 Markdown 编辑器内容转为 HTML，填入 HTML 编辑器
    function generateHtmlFromMd() {
      const textarea = document.getElementById('taskText');
      const htmlTextarea = document.getElementById('htmlText');
      const mdValue = textarea.value.trim();
      if (!mdValue) {
        alert('Markdown 内容为空，无法转换');
        return;
      }
      const html = markdownToHtml(mdValue);
      if (!html.trim()) {
        alert('转换后的 HTML 内容为空');
        return;
      }
      htmlTextarea.value = html;
      resetEditorHistory(htmlTextarea);
      // 保存到 todo.htmlContent（不更新 updatedAt）
      if (editingId) {
        const todo = todos.find(t => t.id === editingId);
        if (todo) {
          todo.htmlContent = html;
          saveTodosSilent();
        }
      }
      alert('已从 Markdown 生成 HTML 文本');
    }

    // 色卡选择
    function selectTodoColor(el, color) {
      selectedTodoColor = color;
      document.querySelectorAll('.todo-color-swatch').forEach(s => {
        s.style.borderColor = '#e2e8f0';
        s.style.boxShadow = 'none';
        s.textContent = '';
      });
      el.style.borderColor = '#667eea';
      el.style.boxShadow = '0 0 0 2px rgba(102,126,234,0.3)';
      if (!color) el.textContent = '✓';
    }

    function getSelectedTodoColor() {
      return selectedTodoColor;
    }

    function setTodoColorPicker(color) {
      selectedTodoColor = color;
      const swatches = document.querySelectorAll('.todo-color-swatch');
      swatches.forEach(s => {
        s.style.borderColor = '#e2e8f0';
        s.style.boxShadow = 'none';
        s.textContent = '';
      });
      let target = null;
      if (color) {
        for (const s of swatches) {
          if (s.getAttribute('data-color') === color) { target = s; break; }
        }
      }
      if (!target) target = swatches[0];
      if (target) {
        target.style.borderColor = '#667eea';
        target.style.boxShadow = '0 0 0 2px rgba(102,126,234,0.3)';
        if (!color) target.textContent = '✓';
      }
    }

    function toggleTag(tag) {
      const index = selectedTagsForModal.indexOf(tag);
      if (index === -1) {
        selectedTagsForModal.push(tag);
      } else {
        selectedTagsForModal.splice(index, 1);
      }
      renderTagsSelector(selectedTagsForModal);
    }

    function handleTagInput(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const input = document.getElementById('tagInput');
        let tag = input.value.trim();
        if (tag.startsWith('#')) {
          tag = tag.substring(1);
        }
        if (tag && !selectedTagsForModal.includes(tag)) {
          selectedTagsForModal.push(tag);
          input.value = '';
          renderTagsSelector(selectedTagsForModal);
        }
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.trim() === (filter === 'all' ? '全' : filter === 'pending' ? '待' : '完'));
      });
      renderTodos();
    }

    function setTagFilter(tag) {
      if (tag === null) {
        // 点击「全」：清除所有选择
        currentTagFilter = [];
      } else {
        // toggle：已选中则取消，未选中则加入
        const idx = currentTagFilter.indexOf(tag);
        if (idx === -1) {
          currentTagFilter.push(tag);
        } else {
          currentTagFilter.splice(idx, 1);
        }
      }
      renderTagFilter();
      renderTodos();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase();
      currentSearchIndex = -1;
      matchedHighlights = [];
      renderTodos();
      updateSearchNav();
    }

    // 更新搜索导航状态
    function updateSearchNav() {
      const nav = document.getElementById('searchNav');
      const count = document.getElementById('searchResultCount');
      
      if (!searchQuery) {
        nav.style.display = 'none';
        return;
      }
      
      // 获取所有高亮的元素
      const highlights = document.querySelectorAll('.search-highlight');
      matchedHighlights = [];
      
      highlights.forEach(el => {
        // 找到该元素所属的卡片
        const card = el.closest('.todo-item');
        if (card) {
          matchedHighlights.push({
            element: el,
            cardId: card.dataset.id
          });
        }
      });
      
      if (matchedHighlights.length > 0) {
        nav.style.display = 'flex';
        currentSearchIndex = 0;
        updateSearchCount();
        scrollToHighlight(0);
      } else {
        nav.style.display = 'flex';
        count.textContent = '0/0';
      }
    }

    // 更新搜索计数显示
    function updateSearchCount() {
      const count = document.getElementById('searchResultCount');
      count.textContent = `${currentSearchIndex + 1}/${matchedHighlights.length}`;
    }

    // 导航到上一个/下一个搜索结果
    function navigateSearch(direction) {
      if (matchedHighlights.length === 0) return;
      
      // 清除当前高亮元素的特殊样式
      clearCurrentHighlight();
      
      // 计算新索引
      currentSearchIndex += direction;
      if (currentSearchIndex < 0) currentSearchIndex = matchedHighlights.length - 1;
      if (currentSearchIndex >= matchedHighlights.length) currentSearchIndex = 0;
      
      updateSearchCount();
      scrollToHighlight(currentSearchIndex);
    }

    // 清除当前高亮元素的特殊样式
    function clearCurrentHighlight() {
      const current = document.querySelectorAll('.search-highlight.current');
      current.forEach(el => el.classList.remove('current'));
    }

    // 滚动到指定高亮元素并标记
    function scrollToHighlight(index) {
      const item = matchedHighlights[index];
      if (!item) return;
      
      const { element, cardId } = item;
      const card = document.querySelector(`.todo-item[data-id="${cardId}"]`);
      
      // 清除卡片高亮
      const currentCards = document.querySelectorAll('.todo-item.search-current');
      currentCards.forEach(c => c.classList.remove('search-current'));
      
      // 添加当前高亮样式
      clearCurrentHighlight();
      element.classList.add('current');
      if (card) card.classList.add('search-current');
      
      // 滚动到元素
      element.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // 在已渲染的 HTML 中高亮搜索关键字（避免在标签内替换）
    function highlightInHtml(html) {
      if (!searchQuery || !html) return html;
      const regex = new RegExp(`(${escapeRegExp(searchQuery)})`, 'gi');
      // 匹配 HTML 标签或文本内容，只替换文本部分
      return html.replace(/<[^>]*>|[^<]+/g, (match) => {
        if (match.startsWith('<')) return match; // 标签不处理
        return match.replace(regex, '<mark class="search-highlight">$1</mark>');
      });
    }

    // 转义正则特殊字符
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function filterTodos() {
      const filtered = todos.filter(todo => {
        if (currentFilter === 'completed' && !todo.completed) return false;
        if (currentFilter === 'pending' && todo.completed) return false;
        if (currentTagFilter.length > 0) {
          const tags = todo.tags && Array.isArray(todo.tags) ? todo.tags : (todo.tag ? [todo.tag] : []);
          // OR 逻辑：只要匹配任一选中标签就保留
          if (!currentTagFilter.some(t => tags.includes(t))) return false;
        }
        if (searchQuery && !todo.text.toLowerCase().includes(searchQuery)) {
          // 文本不匹配时，检查标签是否匹配
          const tags = todo.tags && Array.isArray(todo.tags) ? todo.tags : (todo.tag ? [todo.tag] : []);
          if (!tags.some(tag => tag.toLowerCase().includes(searchQuery))) return false;
        }
        return true;
      });
      // 排序：置顶卡片优先，置底卡片排最后，中间按最后异动时间降序
      return filtered.sort((a, b) => {
        // 置顶的排在前面
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        // 置底的排在后面
        if (a.bottom && !b.bottom) return 1;
        if (!a.bottom && b.bottom) return -1;
        // 都置顶或都不置顶，都置底或都不置底，按时间排序
        const timeA = a.updatedAt || a.createdAt || 0;
        const timeB = b.updatedAt || b.createdAt || 0;
        return timeB - timeA;
      });
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const isToday = date.toDateString() === now.toDateString();
      const isYesterday = new Date(now - 86400000).toDateString() === date.toDateString();

      if (isToday) return '今天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      if (isYesterday) return '昨天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function renderAttachments(attachments) {
      if (!attachments || attachments.length === 0) return '';
      return `
        <div class="todo-attachments">
          ${attachments.map((att, idx) => `
            <div class="attachment-item">
              <span>📎</span>
              <span title="${att.name}">${att.name}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // 判断卡片当前应使用的渲染模式：'html' 或 'md'
    function getEffectiveRenderMode(todo) {
      const hasHtml = !!todo.htmlContent;
      const hasText = !!todo.text;
      // 优先使用持久化的 renderMode 字段
      if (todo.renderMode === 'html' && hasHtml) return 'html';
      if (todo.renderMode === 'md' && hasText) return 'md';
      // 默认：有 htmlContent 就用 HTML，否则用 Markdown
      return hasHtml ? 'html' : 'md';
    }

    // 渲染卡片内容
    function renderTodoContent(todo) {
      const mode = getEffectiveRenderMode(todo);
      if (mode === 'html' && todo.htmlContent) {
        return adaptHtmlForTheme(todo.htmlContent);
      }
      // Markdown 模式
      if (searchQuery) {
        return highlightInHtml(renderMarkdown(todo.text || ''));
      }
      return renderMarkdown(todo.text || '');
    }

    // 渲染模式标识 badge
    function renderModeBadge(todo) {
      const hasHtml = !!todo.htmlContent;
      const hasText = !!todo.text;
      const canToggle = hasHtml && hasText;
      const mode = getEffectiveRenderMode(todo);
      const label = mode === 'html' ? '📄 HTML' : '📝 MD';
      if (canToggle) {
        return `<span class="render-mode-badge" onclick="toggleRenderMode('${todo.id}')" title="点击切换 ${mode === 'html' ? 'Markdown' : 'HTML'} 渲染">${label}</span>`;
      }
      return `<span class="render-mode-badge disabled">${label}</span>`;
    }

    // 切换卡片的渲染模式（持久化到 JSON，不更新 updatedAt）
    async function toggleRenderMode(todoId) {
      const todo = todos.find(t => t.id === todoId);
      if (!todo) return;
      const current = getEffectiveRenderMode(todo);
      todo.renderMode = current === 'html' ? 'md' : 'html';
      // 只保存，不更新 updatedAt
      await saveTodosSilent();
      renderTodos();
      // 切换后给卡片金边心跳 3 秒（与拉动尺寸后同款反馈）。
      // renderTodos() 不改 todo.height/width，卡片大小保持不变；
      // focusResizedCard 也只滚入可视区 + 加 .resize-focus class，不影响布局。
      setTimeout(() => focusResizedCard(todoId), 320);
    }

    // 静默保存：不更新 updatedAt，不触发全量重渲染
    async function saveTodosSilent() {
      try {
        if (!window.electronAPI) return;
        await window.electronAPI.saveTodos(todos);
      } catch (error) {
        console.error('[TodoList] 静默保存失败:', error);
      }
    }

    // 提取卡片的「缩略标签」：取内容第一个「有可见文字」的非空行，截前 30 个可见字符
    // （超出加省略号）。保留 HTML 标签（<BIG> 等）和 markdown 符号，让 renderMarkdown 渲染。
    // 关键：
    //  1. 跳过"只有 HTML 标签没有文字"的行（如 <BIG></BIG>、<center></center>）—— 否则会显示 "..."
    //  2. 按完整 HTML 标签边界截取前 30 个可见字符 —— 否则截到 <big 中间时 marked 会转义成 &lt;big
    //  3. 截断后用 balanceHtmlTags 补全未闭合的标签
    function getTinyLabel(todo) {
      let text = todo.text || '';
      const lines = text.split('\n');
      let firstLine = '';
      for (const l of lines) {
        // 去掉 HTML 标签后看是否还有可见文字
        const visible = l.replace(/<[^>]*>/g, '').trim();
        if (visible) { firstLine = l; break; }
      }
      if (!firstLine) return '';
      // 按完整 HTML 标签边界截取前 30 个"可见字符"（HTML 标签内的字符不计入）
      let result = '';
      let visibleCount = 0;
      let i = 0;
      const len = firstLine.length;
      while (i < len && visibleCount < 30) {
        if (firstLine[i] === '<') {
          // 找匹配的 '>'，标签整体保留（不计入可见字符数）
          const closeIdx = firstLine.indexOf('>', i);
          if (closeIdx === -1) break; // 不完整标签，截断
          result += firstLine.slice(i, closeIdx + 1);
          i = closeIdx + 1;
        } else {
          result += firstLine[i];
          visibleCount++;
          i++;
        }
      }
      // 补全截断后未闭合的标签（balanceHtmlTags 在白名单 big/center 等内自动闭合）
      if (typeof balanceHtmlTags === 'function') {
        result = balanceHtmlTags(result);
      }
      if (i < len) result += '…';
      return result;
    }

    function renderTodos() {
      const container = document.getElementById('todoList');
      const filtered = filterTodos();

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-title">暂无任务</div>
            <div class="empty-state-desc">点击上方按钮添加新任务</div>
          </div>
        `;
        // 清空列表时一并销毁旧 Muuri 实例，避免 resize 时调用已失效实例
        if (todoGrid) {
          todoGrid.destroy();
          todoGrid = null;
        }
        return;
      }

      // 无自定义宽的卡片给一个约 1/3 列的默认宽（Muuri 需要每张卡都有显式宽度才能测量装箱）
      const defW = Math.max(MIN_CARD_WIDTH, Math.floor((container.clientWidth - 24) / 3)) || 300;
      container.innerHTML = filtered.map(todo => {
        const tags = todo.tags && Array.isArray(todo.tags) ? todo.tags : (todo.tag ? [todo.tag] : []);
        const tagsHtml = tags.map(tag => {
          const displayTag = searchQuery ? highlightInHtml(tag) : tag;
          return `<span class="tag ${getTagColorClass(tag)}">#${displayTag}</span>`;
        }).join('');
        const heightStyle = todo.height ? `height: ${todo.height}px; max-height: none;` : '';
        const heightAttr = todo.height ? 'data-height="true"' : '';
        // 每张卡片都给显式宽度：自定义宽优先，否则用默认列宽（配合 Muuri 绝对定位装箱）
        const widthStyle = `width: ${todo.width ? todo.width : defW}px;`;
        const widthAttr = todo.width ? 'data-width="true"' : '';
        const todoBgStyle = todo.bgColor ? `background-color: ${todo.bgColor};` : '';
        const cardStyle = [heightStyle, widthStyle, todoBgStyle].filter(Boolean).join(' ');
        const pinnedAttr = todo.pinned ? 'data-pinned="true"' : '';
        return `
        <div class="todo-item ${todo.completed ? 'completed' : ''} ${todo.pinned ? 'pinned' : ''}" data-id="${todo.id}" ${heightAttr} ${widthAttr} ${pinnedAttr} ondblclick="openEditModal('${todo.id}')" style="${cardStyle}">
          <div class="todo-inner">
          <div class="todo-tiny-label">${renderMarkdown(getTinyLabel(todo))}</div>
          <div class="todo-item-header">
            <div class="checkbox-wrapper" onclick="toggleComplete('${todo.id}')">
              <div class="checkbox ${todo.completed ? 'checked' : ''}"></div>
            </div>
            <div class="todo-actions">
              <span class="todo-actions-label" title="todo-${todo.id}.json">todo-${todo.id}.json</span>
              <button class="action-btn pin ${todo.pinned ? 'active' : ''}" onclick="togglePin('${todo.id}')" title="${todo.pinned ? '取消置顶' : '置顶'}">⬆️</button>
              <button class="action-btn bottom ${todo.bottom ? 'active' : ''}" onclick="toggleBottom('${todo.id}')" title="${todo.bottom ? '取消置底' : '置底'}">⬇️</button>
              <button class="action-btn email" onclick="emailTodo('${todo.id}')" title="发邮件">📧</button>
              <button class="action-btn edit" onclick="openEditModal('${todo.id}')" title="编辑">✏️</button>
              <button class="action-btn archive" onclick="archiveTodo('${todo.id}')" title="归档（移动到 archived/ 子目录）">🗄️</button>
              <button class="action-btn delete" onclick="deleteTodo('${todo.id}')" title="删除">🗑️</button>
            </div>
          </div>
          <div class="todo-content">
            <div class="todo-text">${renderTodoContent(todo)}</div>
            ${renderAttachments(todo.attachments)}
          </div>
          <div class="todo-footer">
            <div class="todo-footer-left">
              ${todo.pinned ? '<span class="pinned-badge">📌 置顶</span>' : ''}
              ${todo.bottom ? '<span class="bottom-badge">📍 置底</span>' : ''}
              ${renderModeBadge(todo)}
              <div class="todo-tags">
                ${tagsHtml}
              </div>
            </div>
            <span class="todo-date" title="最后异动时间">${formatDate(todo.updatedAt || todo.createdAt)}</span>
          </div>
          </div>
          <div class="resize-handle" onmousedown="startResize(event, '${todo.id}')" ondblclick="resetCardSize(event, '${todo.id}')" title="拖动调整宽度和高度，双击重置"></div>
        </div>
      `;
      }).join('');
      // 用 Muuri 做紧凑网格（保留自定义宽 + 严格 DOM 顺序 + 自动填空隙），再判断 tiny 态
      buildGrid();
    }

    // 根据卡片面积与「可视父窗口」面积的比例，自动切换「tiny」态：
    //  - 卡片面积 < 父窗口 1/16：进入 tiny，隐藏全部正文，只显示「缩略标签」（第一行前30字）
    //  - 卡片面积 < 父窗口 1/20：字号更小（极小卡）
    // 字号按卡片尺寸动态算（用 font-size，而非 transform scale），保证字号真的缩小。
    // 用 window.innerHeight 作为父窗口高度基准（而非容器内容总高），避免卡片数量影响触发阈值。
    function applyTinyStates() {
      const container = document.getElementById('todoList');
      if (!container) return;
      const parentArea = container.clientWidth * window.innerHeight; // 可视父窗口面积
      if (parentArea <= 0) return;
      const tinyThreshold = parentArea / 32;    // 进入 tiny 的面积上限（1/32）
      const quarterThreshold = parentArea / 46; // 更小则字号更小（1/46）
      container.querySelectorAll('.todo-item').forEach(el => {
        const rect = el.getBoundingClientRect();
        const area = rect.width * rect.height;
        const tiny = area > 0 && area < tinyThreshold;
        if (tiny) {
          // 字号不再按短边「等比例无限缩小」（再缩就看不见了），改为固定档位：
          //   中小卡（1/32 ~ 1/46）：14px
          //   极小卡（< 1/46）：    11px（最小下限，不再缩小）
          let fontSize;
          if (area < quarterThreshold) {
            fontSize = 11;
          } else {
            fontSize = 14;
          }
          el.style.setProperty('--tiny-font-size', fontSize + 'px');
        } else {
          el.style.removeProperty('--tiny-font-size');
        }
        el.classList.toggle('tiny', tiny);
      });
    }

    // Muuri 紧凑网格实例（模块级，便于 resize / 重渲染时复用与销毁）
    let todoGrid = null;

    // 用 Muuri 做紧凑网格布局：保留自定义宽、严格 DOM 顺序、自动填空隙（fillGaps）。
    // 每次渲染先把旧实例销毁再重建（renderTodos 会整体替换 innerHTML），重建后重判 tiny 态。
    function buildGrid() {
      const container = document.getElementById('todoList');
      if (!container) return;
      if (todoGrid) {
        todoGrid.destroy();
        todoGrid = null;
      }
      todoGrid = new Muuri(container, {
        items: '.todo-item',
        layout: {
          fillGaps: true,
          rounding: true,
          horizontal: false,
          alignRight: false,
          alignBottom: false
        },
        layoutOnResize: 150,
        dragEnabled: false,
        layoutDuration: 0.25,
        showDuration: 0,
        hideDuration: 0
      });
      // 布局完成后，按卡片面积判断 tiny 微缩态
      applyTinyStates();
    }

    // 检测 HTML 内容是否已经是暗色主题（黑色/深色背景 + 浅色文字）
    function isDarkThemedHtml(html) {
      if (!html) return false;
      var hasDarkBg = /background(?:-color)?\s*:\s*#(?:000000|0a0a0a|0d0d0d|111111|1a1a1a|1e1e1e|222222|2d2d2d|333333|18181b|1c1c1e|09090b)/i.test(html);
      var hasLightText = /color\s*:\s*#(?:ffffff|f8f9fa|f1f5f9|e2e8f0|f0f0f0|fafafa|fff(?![a-f0-9]))/i.test(html);
      return hasDarkBg && hasLightText;
    }

    // 根据当前显示模式（白天/黑夜）适配外部传入的 HTML 内容颜色
    // 只在渲染时调用，不影响数据存储
    // 🆕 策略：黑夜模式下移除所有内联 color/background 样式，让 CSS 完全控制
    function adaptHtmlForTheme(html) {
      if (!html) return html;
      var isDark = document.body.classList.contains('dark');

      // 白天模式：直接返回，CSS 会处理
      if (!isDark) return html;

      // 黑夜模式：移除所有内联 color 和 background 样式，让 CSS 接管
      var temp = document.createElement('div');
      temp.innerHTML = html;
      var allElements = temp.querySelectorAll('*');

      for (var i = 0; i < allElements.length; i++) {
        var el = allElements[i];
        var style = el.getAttribute('style') || '';
        if (!style) continue;

        // 按分号拆分每个 CSS 声明
        var declarations = style.split(';');
        var kept = [];

        for (var j = 0; j < declarations.length; j++) {
          var decl = declarations[j].trim();
          if (!decl) continue;

          var colonIdx = decl.indexOf(':');
          if (colonIdx === -1) continue;

          var prop = decl.substring(0, colonIdx).trim().toLowerCase();

          // 移除颜色相关属性，让 CSS 控制
          if (prop === 'color' ||
              prop === 'background' ||
              prop === 'background-color' ||
              prop === 'border-color' ||
              prop === 'border-top-color' ||
              prop === 'border-bottom-color' ||
              prop === 'border-left-color' ||
              prop === 'border-right-color') {
            continue; // 跳过
          }

          // border 属性中可能包含颜色，需要特殊处理
          if (prop.indexOf('border') !== -1 && prop !== 'border-radius') {
            // 移除 border 中的颜色值（#xxx 或 rgb() 或 rgba()）
            var value = decl.substring(colonIdx + 1).trim();
            value = value.replace(/#[0-9a-fA-F]{3,8}\s*/g, '');
            value = value.replace(/rgba?\([^)]*\)\s*/g, '');
            value = value.replace(/\s+/g, ' ').trim();
            if (value) {
              kept.push(prop + ': ' + value);
            }
            continue;
          }

          // 保留其他属性（font-size, margin, padding 等）
          kept.push(decl);
        }

        if (kept.length > 0) {
          el.setAttribute('style', kept.join('; '));
        } else {
          el.removeAttribute('style');
        }
      }

      return temp.innerHTML;
    }

    // 检测 HTML 中是否有在黑夜模式下不可读的颜色组合
    function hasProblematicLightElements(html) {
      if (!html) return false;
      // 问题1：白色/浅色背景 + 浅色文字（白底+浅字=不可读）
      var hasLightBg = /background(?:-color)?\s*:\s*#(?:ffffff|fff(?!\w)|f8fafc|f0f4ff|eff6ff|f1f5f9|fafafa|f9fafb)/i.test(html);
      var hasLightText = /color\s*:\s*#(?:cccccc|bbbbbb|aaaaaa|999999|888888|777777|666666|d1d5db)/i.test(html);
      // 问题2：暗色背景 + 暗色文字（暗底+暗字=不可读，斑马纹表格常见）
      var hasDarkBg = /background(?:-color)?\s*:\s*#(?:000000|0a0a0a|0d0d0d|111111|1a1a1a|1e1e1e|222222|2d2d2d|333333|18181b|1c1c1e|09090b)/i.test(html);
      var hasDarkText = /color\s*:\s*#(?:1e293b|334155|475569|64748b|000000|111111|222222|333333)/i.test(html);
      return (hasLightBg && hasLightText) || (hasDarkBg && hasDarkText);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 解码 HTML 实体（如 &amp; &lt; &#39; 等），用于小圆球纯文本提取
    function decodeEntities(text) {
      if (!text) return '';
      const ta = document.createElement('textarea');
      ta.innerHTML = text;
      return ta.value;
    }

    function renderMarkdown(text) {
      if (!text) return '';

      // 如果内容包含已渲染的 KaTeX HTML，直接返回（不需要重新处理）
      if (text.includes('class="katex"') || text.includes('class="katex-display"')) {
        return balanceHtmlTags(text);
      }

      // 提取 LaTeX 公式，避免 marked 破坏
      const mathBlocks = [];
      let processed = text;
      // 块级公式 $$...$$
      processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, (_, formula) => {
        const idx = mathBlocks.length;
        mathBlocks.push({ formula, display: true });
        return `%%MATHBLOCK_${idx}%%`;
      });
      // 行内公式 $...$（排除 $$）
      processed = processed.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)\$(?!\$)/g, (_, formula) => {
        const idx = mathBlocks.length;
        mathBlocks.push({ formula, display: false });
        return `%%MATHBLOCK_${idx}%%`;
      });

      let html;
      if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
        html = marked.parse(processed);
      } else {
        html = escapeHtml(processed);
      }

      // 替换回 KaTeX 渲染结果
      if (mathBlocks.length > 0) {
        html = html.replace(/%%MATHBLOCK_(\d+)%%/g, (_, idx) => {
          const { formula, display } = mathBlocks[parseInt(idx)];
          if (typeof katex !== 'undefined') {
            try {
              return katex.renderToString(formula, { displayMode: display, throwOnError: false });
            } catch (e) {
              return `<code>${escapeHtml(formula)}</code>`;
            }
          }
          return `<code>${escapeHtml(formula)}</code>`;
        });
      }

      // 平衡未闭合的 HTML 标签，防止破坏布局
      html = balanceHtmlTags(html);

      return html;
    }

    // 平衡 HTML 标签：自动闭合未闭合的标签
    function balanceHtmlTags(html) {
      // 允许的标签列表（白名单）
      const allowedTags = ['big', 'small', 'b', 'strong', 'i', 'em', 'u', 's', 'del', 'ins', 'sub', 'sup', 'mark', 'span', 'div', 'p', 'br', 'code', 'pre', 'a', 'ul', 'ol', 'li', 'blockquote', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'table', 'tr', 'td', 'th', 'thead', 'tbody'];
      
      const tagStack = [];
      const tagPattern = /<\/?([a-zA-Z][a-zA-Z0-9]*)[^>]*>/g;
      let match;
      
      // 遍历所有标签
      while ((match = tagPattern.exec(html)) !== null) {
        const fullMatch = match[0];
        const tagName = match[1].toLowerCase();
        
        // 跳过不在白名单中的标签
        if (!allowedTags.includes(tagName)) continue;
        
        // 跳过自闭合标签
        if (fullMatch.match(/\/\s*>$/) || tagName === 'br') continue;
        
        if (fullMatch.startsWith('</')) {
          // 闭合标签：检查是否匹配栈顶
          if (tagStack.length > 0 && tagStack[tagStack.length - 1] === tagName) {
            tagStack.pop();
          }
        } else {
          // 开始标签：压入栈
          tagStack.push(tagName);
        }
      }
      
      // 闭合所有未闭合的标签
      while (tagStack.length > 0) {
        const unclosedTag = tagStack.pop();
        html += `</${unclosedTag}>`;
      }
      
      return html;
    }

    function toggleComplete(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        todo.completedAt = todo.completed ? Date.now() : null;
        todo.updatedAt = Date.now();
        saveTodos();
      }
    }

    function togglePin(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.pinned = !todo.pinned;
        // 置顶/取消置顶视为内容异动，更新时间
        todo.updatedAt = Date.now();
        saveTodos();
      }
    }

    function toggleBottom(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.bottom = !todo.bottom;
        // 置底/取消置底视为内容异动，更新时间
        todo.updatedAt = Date.now();
        saveTodos();
      }
    }

    function deleteTodo(id) {
      if (!confirm('确定删除这个任务吗？')) return;
      todos = todos.filter(t => t.id !== id);
      // 立即删除对应的独立 JSON 文件
      if (window.electronAPI && window.electronAPI.deleteTodoFile) {
        window.electronAPI.deleteTodoFile(id).catch(e => console.warn('[TodoList] 删除 todo 文件失败:', e));
      }
      saveTodos();
    }

    // 📁 归档：把 todo-{id}.json 从 data 移动到 data/archived/（原子操作 = 复制到子目录 + 删原文件）
    // 流程：用户确认 → 主进程 fs.renameSync 移动文件 → 内存列表移除该 todo → saveTodos 触发孤儿清理（但 archived/ 子目录不在扫描范围，安全）→ 画面刷新。
    // ⚠️ 注意：saveTodos 重建网格时会清掉 tiny 态字号设置，但归档后该卡已不在列表中，不影响。
    async function archiveTodo(id) {
      if (!confirm('确定归档这个任务吗？\n归档后将从列表移除，文件移动到 archived/ 子目录（不删除）。')) return;
      try {
        if (window.electronAPI && window.electronAPI.archiveTodo) {
          const result = await window.electronAPI.archiveTodo(id);
          if (!result || !result.success) {
            alert('归档失败：' + (result?.error || '未知错误'));
            return;
          }
        } else {
          // 没有 IPC（如纯浏览器调试）时降级为直接删除
          console.warn('[TodoList] electronAPI.archiveTodo 不可用，降级为 deleteTodo');
          deleteTodo(id);
          return;
        }
      } catch (e) {
        console.error('[TodoList] 归档 todo 失败:', e);
        alert('归档失败：' + (e?.message || e));
        return;
      }
      // 归档成功：从内存列表移除
      todos = todos.filter(t => t.id !== id);
      // saveTodos 会重建网格，孤儿清理只扫描 PLUGINS_DATA_DIR 顶层（archived/ 是子目录，安全）
      await saveTodos();
      // 归档后 archived/ 多了一个文件，刷新归档计数
      await refreshArchivedCount();
    }

    // 📧 在编辑弹窗内点击「发邮件」按钮：直接发送已保存的 ToDo 内容（若为新增任务则提示先保存）
    async function emailTodoFromModal() {
      if (!editingId) {
        alert('当前是新增任务，请先「保存」后再发送邮件');
        return;
      }
      await emailTodo(editingId);
    }

    // 📧 将 ToDo 卡片内容发送邮件（通过 electronAPI.sendToHost 发请求给主窗口 email 模块处理，与截图一完全一致的弹窗+发送链路）
    (function initTodoEmailClient() {
      const pending = new Map(); // requestId -> { resolve, timeoutId }
      let seq = 1;
      let bridgeHealthy = false; // 启动时 ping 成功后置为 true
      let bridgeCheckDone = false;

      // 主窗口处理完邮件流程后，通过 webview.executeJavaScript 调用这个全局函数回传结果
      window.__resolveTodoEmailRequest = function(requestId, payload) {
        const entry = pending.get(requestId);
        if (!entry) return;
        pending.delete(requestId);
        if (entry.timeoutId) clearTimeout(entry.timeoutId);
        try { entry.resolve(payload); } catch (e) { /* ignore */ }
      };

      // 启动检测：发一个 ping 请求看主窗口监听器是否挂好，5 秒内回不来提示用户可能需重启
      function checkBridgeHealth() {
        if (bridgeCheckDone) return Promise.resolve(bridgeHealthy);
        bridgeCheckDone = true;

        return new Promise((resolve) => {
          if (!window.electronAPI || typeof window.electronAPI.sendToHost !== 'function') {
            resolve(false);
            return;
          }

          const pingId = 'todo-ping-' + Date.now() + '-' + (seq++);
          const timeoutId = setTimeout(() => {
            if (pending.has(pingId)) {
              pending.delete(pingId);
              bridgeHealthy = false;
              resolve(false);
            }
          }, 5000);

          pending.set(pingId, {
            resolve: (payload) => {
              clearTimeout(timeoutId);
              bridgeHealthy = !!(payload && (payload.ok || payload.cancelled !== undefined || payload.success !== undefined || payload.error));
              resolve(bridgeHealthy);
            },
            timeoutId,
          });

          try {
            window.electronAPI.sendToHost('todolist-email-request', {
              requestId: pingId,
              __ping: true,
              todo: { id: '__ping__', text: '', htmlContent: '', tags: [], createdAt: null, completed: false },
            });
          } catch (e) {
            pending.delete(pingId);
            clearTimeout(timeoutId);
            bridgeHealthy = false;
            resolve(false);
          }
        });
      }

      window.__sendTodoEmailRequest = function(todo) {
        return new Promise(async (resolve, reject) => {
          if (!window.electronAPI || typeof window.electronAPI.sendToHost !== 'function') {
            reject(new Error('preload.js 未暴露 electronAPI.sendToHost（请检查 Electron 配置）'));
            return;
          }

          // 首次调用先做健康检查（快速失败）
          if (!bridgeCheckDone) {
            const ok = await checkBridgeHealth();
            if (!ok) {
              reject(new Error('主窗口邮件桥接未启动（建议重启整个应用后重试，或确认 email.js 已加载）'));
              return;
            }
          }
          if (bridgeCheckDone && !bridgeHealthy) {
            reject(new Error('主窗口邮件桥接不可用（建议重启整个应用后重试）'));
            return;
          }

          const requestId = 'todo-email-' + Date.now() + '-' + (seq++);
          const timeoutId = setTimeout(() => {
            if (pending.has(requestId)) {
              pending.delete(requestId);
              reject(new Error('邮件请求超时（主窗口未响应。请确认已在主窗口加载 email.js，或尝试完全重启应用）'));
            }
          }, 60 * 1000); // 最长 1 分钟（用户输入邮箱+点发送都应该在这时间内完成）

          pending.set(requestId, { resolve, timeoutId });

          try {
            // 发送 Todo 的基础数据（tags/htmlContent/text/completed/createdAt），主窗口负责构建+渲染+发送
            window.electronAPI.sendToHost('todolist-email-request', {
              requestId,
              todo: {
                id: todo.id,
                text: todo.text || '',
                htmlContent: todo.htmlContent || '',
                tags: (todo.tags && Array.isArray(todo.tags)) ? todo.tags : (todo.tag ? [todo.tag] : []),
                createdAt: todo.createdAt || null,
                completed: !!todo.completed,
                bgColor: todo.bgColor || '',
              },
            });
          } catch (e) {
            pending.delete(requestId);
            clearTimeout(timeoutId);
            reject(e);
          }
        });
      };

      // DOM 加载后立即发起一次健康检查，早发现问题早提示
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(checkBridgeHealth, 1000));
      } else {
        setTimeout(checkBridgeHealth, 1000);
      }
    })();

    async function emailTodo(id) {
      try {
        const todo = todos.find(t => t.id === id);
        if (!todo) { alert('找不到对应的 ToDo 卡片'); return; }

        if (typeof window.__sendTodoEmailRequest !== 'function') {
          alert('邮件客户端初始化失败，请刷新 ToDoList 插件页签后再试');
          return;
        }

        //  发送前确认：显示任务标题，让用户确认后再发送
        const firstLine = (todo.text || '').split('\n')[0].trim().substring(0, 80) || '(无标题)';
        if (!confirm('确定要将以下 ToDo 卡片内容发送邮件吗？\n\n「' + firstLine + '」')) {
          return;
        }

        const result = await window.__sendTodoEmailRequest(todo);

        if (!result) {
          alert('邮件发送无响应');
          return;
        }
        if (result.cancelled) {
          // 用户取消（收件人对话框点取消/关闭/Esc）
          return;
        }
        if (result.success) {
          if (!result.result || result.result.success) {
            // 发送成功提示（浮动视窗和主窗口状态栏已经由 sendUnifiedEmail 做了）
          } else {
            alert('邮件发送失败：' + (result.result?.message || '未知错误'));
          }
        } else {
          alert('邮件发送失败：' + (result.error || '未知错误'));
        }
      } catch (err) {
        console.error('[toDoList] 发送邮件失败:', err);
        alert('发送邮件失败：' + (err?.message || err));
      }
    }

    // 📄 刷新 JSON 文件名显示区（编辑模式专用）

    function updateJsonFileDisplay() {
      const row = document.getElementById('jsonFileRow');
      if (!row) return;
      if (!editingId) {
        row.style.display = 'none';
        return;
      }
      row.style.display = '';
      // 如果当前在重命名输入中，不覆盖输入框

    // ✏️ 点击「重命名」按钮 → 把文件名 span 替换为 input
    function startRenameJsonFile() {
      if (!editingId) return;
      const nameEl = document.getElementById('jsonFileName');
      const btn = document.getElementById('jsonFileRenameBtn');
      if (!nameEl || !btn) return;
      // 已经是 input 中就不重复进入
      if (document.getElementById('jsonFileRenameInput')) return;
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'jsonFileRenameInput';
      input.className = 'json-file-rename-input';
      input.value = editingId;
      input.maxLength = 64;
      input.title = '仅允许字母、数字、横线、下划线';
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commitRenameJsonFile(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancelRenameJsonFile(); }
      });
      // 替换 nameEl 为 input，btn 文案改「确定」
      nameEl.style.display = 'none';
      nameEl.parentNode.insertBefore(input, nameEl);
      btn.textContent = '✓ 确定';
      btn.title = '确认重命名（Enter）';
      btn.onclick = commitRenameJsonFile;
      // 同时插入一个取消按钮（紧挨 btn 后面）
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'json-file-rename-btn';
      cancelBtn.id = 'jsonFileRenameCancelBtn';
      cancelBtn.textContent = '✕';
      cancelBtn.title = '取消（Esc）';
      cancelBtn.onclick = cancelRenameJsonFile;
      btn.parentNode.insertBefore(cancelBtn, btn.nextSibling);
      input.focus();
      input.select();
    }

    // 重命名待确认数据（回车后暂存，确认框「保存」才真正执行磁盘改名）
    let pendingRenameOldId = null;
    let pendingRenameNewId = null;

    // ✓ 回车提交：本地校验 → 暂存 → 弹确认框（不直接改磁盘）
    async function commitRenameJsonFile() {
      const input = document.getElementById('jsonFileRenameInput');
      if (!input) return;
      const oldId = editingId;
      const newId = input.value.trim();
      if (!newId) {
        alert('新 ID 不能为空');
        input.focus();
        return;
      }
      // 白名单校验：字母数字横线下划线
      if (!/^[a-zA-Z0-9_-]+$/.test(newId)) {
        alert('新 ID 只能包含字母、数字、横线、下划线');
        input.focus();
        return;
      }
      if (newId === oldId) {
        // 没变，直接退出重命名态
        cancelRenameJsonFile();
        return;
      }
      if (!window.electronAPI || !window.electronAPI.renameTodoFile) {
        alert('重命名功能不可用（IPC 缺失）');
        return;
      }
      // 校验通过 → 暂存待确认数据，弹出确认框
      pendingRenameOldId = oldId;
      pendingRenameNewId = newId;
      showRenameConfirm(newId);
    }

    // 显示重命名确认框
    function showRenameConfirm(newId) {
      const overlay = document.getElementById('renameConfirmOverlay');
      const msg = document.getElementById('renameConfirmMsg');
      if (msg) msg.textContent = `确认将 JSON 文件改名为 todo-${newId}.json 吗？`;
      if (overlay) overlay.style.display = 'flex';
    }

    // 确认框「保存」：真正执行磁盘改名 + 同步内存
    async function confirmRenameSave() {
      const overlay = document.getElementById('renameConfirmOverlay');
      const oldId = pendingRenameOldId;
      const newId = pendingRenameNewId;
      if (overlay) overlay.style.display = 'none';
      pendingRenameOldId = null;
      pendingRenameNewId = null;
      if (!oldId || !newId) return;
      try {
        const result = await window.electronAPI.renameTodoFile(oldId, newId);
        if (!result || !result.success) {
          alert('重命名失败：' + (result?.error || '未知错误'));
          cancelRenameJsonFile(); // 恢复 UI，让用户可重试
          return;
        }
      } catch (e) {
        console.error('[TodoList] 重命名 todo 文件失败:', e);
        alert('重命名失败：' + (e?.message || e));
        cancelRenameJsonFile();
        return;
      }
      // 主进程重命名成功 → 同步更新内存
      const todo = todos.find(t => t.id === oldId);
      if (todo) {
        todo.id = newId;
        todo.updatedAt = Date.now();
      }
      editingId = newId;
      // 退出重命名 UI + 刷新文件名显示
      cancelRenameJsonFile();
      updateJsonFileDisplay();
      // 关键：重渲染画廊卡片，使卡片的 data-id 与功能条 JSON 名同步为新 id。
      // 否则卡片 DOM 仍保留旧 id → 双击 openEditModal(旧id) 找不到 todo（无法进入编辑），且名称不刷新。
      renderTodos();
      console.log(`[TodoList] todo id 已从 ${oldId} 改为 ${newId}`);
    }

    // 确认框「放弃」：取消重命名，不执行任何磁盘改动（内存/文件均不变）
    function confirmRenameDiscard() {
      const overlay = document.getElementById('renameConfirmOverlay');
      if (overlay) overlay.style.display = 'none';
      pendingRenameOldId = null;
      pendingRenameNewId = null;
      // 恢复文件名显示，保持编辑模态框打开（回到可继续编辑状态）
      cancelRenameJsonFile();
    }

    // ✕ 取消重命名：恢复 span + 按钮初始态
    function cancelRenameJsonFile() {
      const input = document.getElementById('jsonFileRenameInput');
      const cancelBtn = document.getElementById('jsonFileRenameCancelBtn');
      const btn = document.getElementById('jsonFileRenameBtn');
      const nameEl = document.getElementById('jsonFileName');
      if (input) input.remove();
      if (cancelBtn) cancelBtn.remove();
      if (btn) {
        btn.textContent = '✏️ 重命名';
        btn.title = '重命名 JSON 文件（ID）';
        btn.onclick = startRenameJsonFile;
      }
      if (nameEl) nameEl.style.display = '';
    }

      // 保存场景由调用方显式传入，以同时覆盖「编辑」与「新增」两种卡片
      const fid = (focusId !== undefined) ? focusId : editingId;

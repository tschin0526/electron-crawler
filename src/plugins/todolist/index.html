          </div>
          <div class="resize-handle" onmousedown="startResize(event, '${todo.id}')" ondblclick="resetCardSize(event, '${todo.id}')" title="拖动调整宽度和高度，双击重置"></div>
        </div>
      `;
      }).join('');
    }

    // 检测 HTML 内容是否已经是暗色主题（黑色/深色背景 + 浅色文字）
    function isDarkThemedHtml(html) {
      if (!html) return false;
      var hasDarkBg = /background(?:-color)?\s*:\s*#(?:000000|0a0a0a|0d0d0d|111111|1a1a1a|1e1e1e|222222|2d2d2d|333333|18181b|1c1c1e|09090b)/i.test(html);
      var hasLightText = /color\s*:\s*#(?:ffffff|f8f9fa|f1f5f9|e2e8f0|f0f0f0|fafafa|fff(?![a-f0-9]))/i.test(html);
      return hasDarkBg && hasLightText;
    }

    // 根据当前显示模式（白天/黑夜）适配外部传入的 HTML 内容颜色
    // 只在渲染时调用，不影响数据存储
    // 使用声明级别解析，逐个处理每个 CSS 属性，避免正则匹配遗漏
    function adaptHtmlForTheme(html) {
      if (!html) return html;
      var isDark = document.body.classList.contains('dark');

      var temp = document.createElement('div');
      temp.innerHTML = html;
      var allElements = temp.querySelectorAll('*');

      for (var i = 0; i < allElements.length; i++) {
        var el = allElements[i];
        var style = el.getAttribute('style') || '';
        if (!style) continue;

        // 按分号拆分每个 CSS 声明，逐个处理（保留 !important）
        var declarations = style.split(';');
        var modified = false;

        for (var j = 0; j < declarations.length; j++) {
          var decl = declarations[j].trim();
          if (!decl) continue;

          var colonIdx = decl.indexOf(':');
          if (colonIdx === -1) continue;

          var prop = decl.substring(0, colonIdx).trim().toLowerCase();
          var rest = decl.substring(colonIdx + 1).trim();

          // 分离 !important 标记
          var important = '';
          if (rest.match(/!important\s*$/i)) {
            important = ' !important';
            rest = rest.replace(/\s*!important\s*$/, '').trim();
          }

          if (isDark) {
            // === 黑夜模式 ===

            // 1. 浅色背景 → 暗色背景 (#1e293b)
            //    匹配: #fff, #ffffff, white, #f8fafc, #f1f5f9 等浅色值
            if (prop === 'background' || prop === 'background-color') {
              if (/^(?:#(?:ffffff|fff(?!\w)|f8fafc|f0f4ff|eff6ff|f1f5f9|fafafa|f9fafb|f8f9fa|fffbe6|fefce8)\b|white\b)/i.test(rest)) {
                rest = '#1e293b';
                modified = true;
              }
            }

            // 2. 深色文字 → 亮色文字 (#e2e8f0)
            //    匹配: #1e293b, #1f2937, #334155, #000000 等深色值
            if (prop === 'color') {
              if (/^#(?:1e293b|1f2937|334155|475569|64748b|000000|111111|222222|333333|cccccc|bbbbbb|aaaaaa|999999|888888|777777|666666|d1d5db)\b/i.test(rest)) {
                rest = '#e2e8f0';
                modified = true;
              }
            }

            // 3. 暗色边框 → 可见边框 (#475569)
            if (prop.indexOf('border') !== -1) {
              if (/#(?:000000|111111|222222|333333|444444)\b/i.test(rest)) {
                rest = rest.replace(/#(?:000000|111111|222222|333333|444444)\b/gi, '#475569');
                modified = true;
              }
            }

          } else {
            // === 白天模式：暗色主题 → 亮色主题 ===

            // 1. 暗色背景 → 白色背景
            if (prop === 'background' || prop === 'background-color') {
              if (/^#(?:000000|0a0a0a|0d0d0d|111111|1a1a1a|1e1e1e|222222|2d2d2d|333333|18181b|1c1c1e|09090b)\b/i.test(rest)) {
                rest = '#ffffff';
                modified = true;
              }
            }

            // 2. 浅色文字 → 深色文字
            if (prop === 'color') {
              if (/^#(?:ffffff|fff(?!\w)|f8f9fa|f1f5f9|e2e8f0|f0f0f0|fafafa)\b/i.test(rest)) {
                rest = '#1e293b';
                modified = true;
              }
            }

            // 3. 暗色边框 → 亮色边框
            if (prop.indexOf('border') !== -1) {
              if (/#(?:222222|333333|444444)\b/i.test(rest)) {
                rest = rest.replace(/#(?:222222|333333|444444)\b/gi, '#cbd5e1');
                modified = true;
              }
            }
          }

          // 重组声明（恢复 !important）
          declarations[j] = decl.substring(0, colonIdx + 1) + ' ' + rest + important;
        }

        if (modified) {
          el.setAttribute('style', declarations.join('; '));
        }
      }

      return temp.innerHTML;
    }

    // 检测 HTML 中是否有在黑夜模式下不可读的颜色组合
    function hasProblematicLightElements(html) {
      if (!html) return false;
      // 问题1：白色/浅色背景 + 浅色文字（白底+浅字=不可读）
      var hasLightBg = /background(?:-color)?\s*:\s*#(?:ffffff|fff(?!\w)|f8fafc|f0f4ff|eff6ff|f1f5f9|fafafa|f9fafb)/i.test(html);
      var hasLightText = /color\s*:\s*#(?:cccccc|bbbbbb|aaaaaa|999999|888888|777777|666666|d1d5db)/i.test(html);
      // 问题2：暗色背景 + 暗色文字（暗底+暗字=不可读，斑马纹表格常见）
      var hasDarkBg = /background(?:-color)?\s*:\s*#(?:000000|0a0a0a|0d0d0d|111111|1a1a1a|1e1e1e|222222|2d2d2d|333333|18181b|1c1c1e|09090b)/i.test(html);
      var hasDarkText = /color\s*:\s*#(?:1e293b|334155|475569|64748b|000000|111111|222222|333333)/i.test(html);
      return (hasLightBg && hasLightText) || (hasDarkBg && hasDarkText);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMarkdown(text) {
      if (!text) return '';
      // 提取 LaTeX 公式，避免 marked 破坏
      const mathBlocks = [];
      let processed = text;
      // 块级公式 $$...$$
      processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, (_, formula) => {
        const idx = mathBlocks.length;
        mathBlocks.push({ formula, display: true });
        return `%%MATHBLOCK_${idx}%%`;
      });
      // 行内公式 $...$（排除 $$）
      processed = processed.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)\$(?!\$)/g, (_, formula) => {
        const idx = mathBlocks.length;
        mathBlocks.push({ formula, display: false });
        return `%%MATHBLOCK_${idx}%%`;
      });

      let html;
      if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
        html = marked.parse(processed);
      } else {
        html = escapeHtml(processed);
      }

      // 替换回 KaTeX 渲染结果
      html = html.replace(/%%MATHBLOCK_(\d+)%%/g, (_, idx) => {
        const { formula, display } = mathBlocks[parseInt(idx)];
        if (typeof katex !== 'undefined') {
          try {
            return katex.renderToString(formula, { displayMode: display, throwOnError: false });
          } catch (e) {
            return `<code>${escapeHtml(formula)}</code>`;
          }
        }
        return `<code>${escapeHtml(formula)}</code>`;
      });

      return html;
    }

    function toggleComplete(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        todo.completedAt = todo.completed ? Date.now() : null;
        todo.updatedAt = Date.now();
        saveTodos();
      }
    }

    function togglePin(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.pinned = !todo.pinned;
        // 置顶/取消置顶视为内容异动，更新时间
        todo.updatedAt = Date.now();
        saveTodos();
      }
    }

    function deleteTodo(id) {
      if (!confirm('确定删除这个任务吗？')) return;
      todos = todos.filter(t => t.id !== id);
      // 立即删除对应的独立 JSON 文件
      if (window.electronAPI && window.electronAPI.deleteTodoFile) {
        window.electronAPI.deleteTodoFile(id).catch(e => console.warn('[TodoList] 删除 todo 文件失败:', e));
      }
      saveTodos();
    }

    // 📧 在编辑弹窗内点击「发邮件」按钮：直接发送已保存的 ToDo 内容（若为新增任务则提示先保存）
    async function emailTodoFromModal() {
      if (!editingId) {
        alert('当前是新增任务，请先「保存」后再发送邮件');
        return;
      }
      await emailTodo(editingId);
    }

    // 📧 将 ToDo 卡片内容发送邮件（通过 electronAPI.sendToHost 发请求给主窗口 email 模块处理，与截图一完全一致的弹窗+发送链路）
    (function initTodoEmailClient() {
      const pending = new Map(); // requestId -> { resolve, timeoutId }
      let seq = 1;
      let bridgeHealthy = false; // 启动时 ping 成功后置为 true
      let bridgeCheckDone = false;

      // 主窗口处理完邮件流程后，通过 webview.executeJavaScript 调用这个全局函数回传结果
      window.__resolveTodoEmailRequest = function(requestId, payload) {
        const entry = pending.get(requestId);
        if (!entry) return;
        pending.delete(requestId);
        if (entry.timeoutId) clearTimeout(entry.timeoutId);
        try { entry.resolve(payload); } catch (e) { /* ignore */ }
      };

      // 启动检测：发一个 ping 请求看主窗口监听器是否挂好，5 秒内回不来提示用户可能需重启
      function checkBridgeHealth() {
        if (bridgeCheckDone) return Promise.resolve(bridgeHealthy);
        bridgeCheckDone = true;

        return new Promise((resolve) => {
          if (!window.electronAPI || typeof window.electronAPI.sendToHost !== 'function') {
            resolve(false);
            return;
          }

          const pingId = 'todo-ping-' + Date.now() + '-' + (seq++);
          const timeoutId = setTimeout(() => {
            if (pending.has(pingId)) {
              pending.delete(pingId);
              bridgeHealthy = false;
              resolve(false);
            }
          }, 5000);

          pending.set(pingId, {
            resolve: (payload) => {
              clearTimeout(timeoutId);
              bridgeHealthy = !!(payload && (payload.ok || payload.cancelled !== undefined || payload.success !== undefined || payload.error));
              resolve(bridgeHealthy);
            },
            timeoutId,
          });

          try {
            window.electronAPI.sendToHost('todolist-email-request', {
              requestId: pingId,
              __ping: true,
              todo: { id: '__ping__', text: '', htmlContent: '', tags: [], createdAt: null, completed: false },
            });
          } catch (e) {
            pending.delete(pingId);
            clearTimeout(timeoutId);
            bridgeHealthy = false;
            resolve(false);
          }
        });
      }

      window.__sendTodoEmailRequest = function(todo) {
        return new Promise(async (resolve, reject) => {
          if (!window.electronAPI || typeof window.electronAPI.sendToHost !== 'function') {
            reject(new Error('preload.js 未暴露 electronAPI.sendToHost（请检查 Electron 配置）'));
            return;
          }

          // 首次调用先做健康检查（快速失败）
          if (!bridgeCheckDone) {
            const ok = await checkBridgeHealth();
            if (!ok) {
              reject(new Error('主窗口邮件桥接未启动（建议重启整个应用后重试，或确认 email.js 已加载）'));
              return;
            }
          }
          if (bridgeCheckDone && !bridgeHealthy) {
            reject(new Error('主窗口邮件桥接不可用（建议重启整个应用后重试）'));
            return;
          }

          const requestId = 'todo-email-' + Date.now() + '-' + (seq++);
          const timeoutId = setTimeout(() => {
            if (pending.has(requestId)) {
              pending.delete(requestId);
              reject(new Error('邮件请求超时（主窗口未响应。请确认已在主窗口加载 email.js，或尝试完全重启应用）'));
            }
          }, 60 * 1000); // 最长 1 分钟（用户输入邮箱+点发送都应该在这时间内完成）

          pending.set(requestId, { resolve, timeoutId });

          try {
            // 发送 Todo 的基础数据（tags/htmlContent/text/completed/createdAt），主窗口负责构建+渲染+发送
            window.electronAPI.sendToHost('todolist-email-request', {
              requestId,
              todo: {
                id: todo.id,
                text: todo.text || '',
                htmlContent: todo.htmlContent || '',
                tags: (todo.tags && Array.isArray(todo.tags)) ? todo.tags : (todo.tag ? [todo.tag] : []),
                createdAt: todo.createdAt || null,
                completed: !!todo.completed,
                bgColor: todo.bgColor || '',
              },
            });
          } catch (e) {
            pending.delete(requestId);
            clearTimeout(timeoutId);
            reject(e);
          }
        });
      };

      // DOM 加载后立即发起一次健康检查，早发现问题早提示
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(checkBridgeHealth, 1000));
      } else {
        setTimeout(checkBridgeHealth, 1000);
      }
    })();

    async function emailTodo(id) {
      try {
        const todo = todos.find(t => t.id === id);
        if (!todo) { alert('找不到对应的 ToDo 卡片'); return; }

        if (typeof window.__sendTodoEmailRequest !== 'function') {
          alert('邮件客户端初始化失败，请刷新 ToDoList 插件页签后再试');
          return;
        }

        //  发送前确认：显示任务标题，让用户确认后再发送
        const firstLine = (todo.text || '').split('\n')[0].trim().substring(0, 80) || '(无标题)';
        if (!confirm('确定要将以下 ToDo 卡片内容发送邮件吗？\n\n「' + firstLine + '」')) {
          return;
        }

        const result = await window.__sendTodoEmailRequest(todo);

        if (!result) {
          alert('邮件发送无响应');
          return;
        }
        if (result.cancelled) {
          // 用户取消（收件人对话框点取消/关闭/Esc）
          return;
        }
        if (result.success) {
          if (!result.result || result.result.success) {
            // 发送成功提示（浮动视窗和主窗口状态栏已经由 sendUnifiedEmail 做了）
          } else {
            alert('邮件发送失败：' + (result.result?.message || '未知错误'));
          }
        } else {
          alert('邮件发送失败：' + (result.error || '未知错误'));
        }
      } catch (err) {
        console.error('[toDoList] 发送邮件失败:', err);
        alert('发送邮件失败：' + (err?.message || err));
      }
    }

    function clearCompleted() {
      const completed = todos.filter(t => t.completed);
      if (completed.length === 0) {
        alert('没有已完成的任务可删除');
        return;
      }
      if (!confirm(`确定删除 ${completed.length} 个已完成任务吗？`)) return;
      todos = todos.filter(t => !t.completed);
      saveTodos();
    }

    function clearAll() {
      if (todos.length === 0) {
        alert('没有任务可删除');
        return;
      }
      if (!confirm(`确定删除全部 ${todos.length} 个任务吗？此操作不可恢复！`)) return;
      todos = [];
      saveTodos();
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '添加任务';
      document.getElementById('taskText').value = '';
      document.getElementById('htmlText').value = '';
      document.getElementById('editSearchInput').value = '';
      pendingAttachments = [];
      selectedTagsForModal = [];
      renderTagsSelector([]);
      renderPendingAttachments();
      setTodoColorPicker('');
      previewMode = 0;
      document.getElementById('mdPreview').classList.remove('show');
      document.getElementById('taskText').style.display = '';
      document.getElementById('htmlText').style.display = 'none';
      document.getElementById('mdToggleBtn').classList.remove('active');
      document.getElementById('mdToggleBtn').textContent = '编辑文本';
      document.getElementById('mdToggleBtn').title = '点击切换到 Markdown 预览';
      searchMatches = [];
      currentMatchIndex = -1;
      lastSearchEnterQuery = '';
      document.getElementById('searchCount').textContent = '';
      updateSearchNavButtons();
      document.getElementById('modalOverlay').style.display = 'flex';
      document.getElementById('taskText').focus();
    }

    function openEditModal(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      editingId = id;
      document.getElementById('modalTitle').textContent = '编辑任务';
      document.getElementById('taskText').value = todo.text;
      document.getElementById('htmlText').value = todo.htmlContent || '';
      document.getElementById('editSearchInput').value = '';
      pendingAttachments = todo.attachments || [];
      const tags = todo.tags && Array.isArray(todo.tags) ? todo.tags : (todo.tag ? [todo.tag] : []);
      selectedTagsForModal = tags;
      renderTagsSelector(tags);
      renderPendingAttachments();
      setTodoColorPicker(todo.bgColor || '');
      previewMode = 0;
      document.getElementById('mdPreview').classList.remove('show');
      document.getElementById('taskText').style.display = '';
      document.getElementById('mdToggleBtn').classList.remove('active');
      searchMatches = [];
      currentMatchIndex = -1;
      lastSearchEnterQuery = '';
      document.getElementById('searchCount').textContent = '';
      updateSearchNavButtons();
      document.getElementById('modalOverlay').style.display = 'flex';
      document.getElementById('taskText').focus();
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('modalOverlay').style.display = 'none';
      previewMode = 0;
      document.getElementById('mdPreview').classList.remove('show');
      document.getElementById('taskText').style.display = '';
      document.getElementById('htmlText').style.display = 'none';
      document.getElementById('mdToggleBtn').classList.remove('active');
      document.getElementById('mdToggleBtn').textContent = '编辑文本';
      document.getElementById('mdToggleBtn').title = '点击切换到 Markdown 预览';
      clearSearchHighlights();
      searchMatches = [];
      currentMatchIndex = -1;
      lastSearchEnterQuery = '';
      updateSearchNavButtons();
    }

    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          pendingAttachments.push({
            name: file.name,
            size: formatFileSize(file.size),
            type: file.type,
            data: e.target.result
          });
          renderPendingAttachments();
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function removePendingAttachment(index) {
      pendingAttachments.splice(index, 1);
      renderPendingAttachments();
    }

    function renderPendingAttachments() {
      const container = document.getElementById('attachmentsList');
      if (pendingAttachments.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = pendingAttachments.map((att, idx) => `
        <div class="attachment-list-item">
          <span class="attachment-list-icon">📄</span>
          <div class="attachment-list-info">
            <div class="attachment-list-name" title="${att.name}">${att.name}</div>
            <div class="attachment-list-size">${att.size}</div>
          </div>
          <span class="attachment-list-remove" onclick="removePendingAttachment(${idx})">✕</span>
        </div>
      `).join('');
    }

    async function saveTask(closeAfterSave = true) {
      const textarea = document.getElementById('taskText');
      const htmlTextarea = document.getElementById('htmlText');
      let text = textarea.value.trim();

      // 如果在 HTML 编辑模式下保存，同步 HTML 内容到 htmlContent
      if (previewMode === 2) {
        const htmlValue = htmlTextarea.value.trim();
        if (!htmlValue) {
          alert('请输入 HTML 内容');
          return;
        }
        // 从 HTML 中提取纯文本作为 text
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlValue;
        text = tempDiv.textContent.trim() || text;
        textarea.value = text;
      }

      if (!text) {
        alert('请输入任务内容');
        return;
      }

      if (editingId) {
        const todo = todos.find(t => t.id === editingId);
        if (todo) {
          todo.text = text;
          // 如果在 HTML 编辑模式，直接保存 HTML 内容
          if (previewMode === 2) {
            todo.htmlContent = htmlTextarea.value.trim();
          } else if (todo.htmlContent) {
            // 智能更新 htmlContent：保留原始样式，只替换文本内容
            todo.htmlContent = updateHtmlContent(todo.text, text, todo.htmlContent);
          }
          todo.tags = selectedTagsForModal;
          delete todo.tag;
          todo.attachments = pendingAttachments;
          todo.bgColor = getSelectedTodoColor();
          todo.updatedAt = Date.now();
        }
      } else {
        const newTodo = {
          id: Date.now().toString(),
          text: text,
          tags: selectedTagsForModal,
          attachments: pendingAttachments,
          bgColor: getSelectedTodoColor(),
          completed: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          completedAt: null
        };
        // 如果在 HTML 编辑模式，也保存 HTML 内容
        if (previewMode === 2) {
          newTodo.htmlContent = htmlTextarea.value.trim();
        }
        todos.unshift(newTodo);
      }

      await saveTodos();
      if (closeAfterSave) {
        closeModal();
      }
    }

    //  从外部创建 todo 卡片（供 capture.js 调用）
    window.addTodoFromExternal = async function(text, tags = [], htmlContent = '') {
      if (!text || !text.trim()) return { success: false, message: '内容为空' };
      try {
        const newTodo = {
          id: Date.now().toString(),
          text: text.trim(),
          htmlContent: htmlContent || '',
          tags: tags,
          attachments: [],
          bgColor: '',
          completed: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          completedAt: null
        };
        todos.unshift(newTodo);
        await saveTodos();
        renderTodos();
        updateStats();
        return { success: true, message: '已建立 ToDo 卡片' };
      } catch (err) {
        return { success: false, message: err.message };
      }
    };

    function startResize(event, id) {
      event.preventDefault();
      event.stopPropagation();
      resizingId = id;
      resizingEl = document.querySelector(`.todo-item[data-id="${id}"]`);
      if (!resizingEl) return;
      const rect = resizingEl.getBoundingClientRect();
      // 记录起始坐标和尺寸（宽高都处理）
      resizingStartY = event.clientY;
      resizingStartH = rect.height;
      resizingStartX = event.clientX;
      resizingStartW = rect.width;
      resizingEl.setAttribute('data-height', 'true');
      resizingEl.setAttribute('data-width', 'true');
      // 拖拽时强制脱离 flex 弹性分配，使用固定像素宽度
      // 无论卡片之前是否有自定义宽度，都统一使用 width 固定尺寸
      resizingEl.style.flex = '0 0 auto';
      resizingEl.style.minWidth = '0';
      resizingEl.style.width = rect.width + 'px';
      resizingEl.style.height = rect.height + 'px';
      resizingEl.style.maxHeight = 'none';
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'nwse-resize';
      document.addEventListener('mousemove', onResize);
      document.addEventListener('mouseup', stopResize);
    }

    function onResize(event) {
      if (!resizingEl) return;
      // 高度调整
      const deltaY = event.clientY - resizingStartY;
      const newHeight = Math.max(MIN_CARD_HEIGHT, resizingStartH + deltaY);
      resizingEl.style.height = newHeight + 'px';
      // 宽度调整：直接使用 width，更直观可靠
      const deltaX = event.clientX - resizingStartX;
      const newWidth = Math.max(MIN_CARD_WIDTH, resizingStartW + deltaX);
      resizingEl.style.width = newWidth + 'px';
    }

    async function stopResize() {
      if (resizingEl && resizingId) {
        const rect = resizingEl.getBoundingClientRect();
        const newHeight = Math.round(rect.height);
        const newWidth = Math.round(rect.width);
        const todo = todos.find(t => t.id === resizingId);
        if (todo) {
          todo.height = newHeight;
          todo.width = newWidth;
          // 调整卡片尺寸不视为内容异动，不更新 updatedAt
          await saveTodos();
        }
        // 清除所有拖拽时的内联样式，交由 renderTodos 重新渲染时应用持久化的尺寸
        resizingEl.style.flex = '';
        resizingEl.style.minWidth = '';
        resizingEl.style.width = '';
        resizingEl.style.height = '';
        resizingEl.style.maxHeight = '';
      }
      resizingId = null;
      resizingEl = null;
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      document.removeEventListener('mousemove', onResize);
      document.removeEventListener('mouseup', stopResize);
    }

    async function resetCardSize(event, id) {
      event.preventDefault();
      event.stopPropagation();
      const todo = todos.find(t => t.id === id);
      if (todo) {
        let changed = false;
        if (todo.height) { delete todo.height; changed = true; }
        if (todo.width) { delete todo.width; changed = true; }
        if (changed) {
          // 重置卡片尺寸不视为内容异动，不更新 updatedAt
          await saveTodos();
        }
      }
    }

    async function init() {
      await loadTodos();
      renderTagFilter();
      renderTodos();
      updateStats();
    }

    // 主题由主程式统一控制，通过 CSS 注入实现（主程式 insertCSS 添加 body.dark）
    // 页面加载时从 localStorage 读取初始状态（兼容旧数据）
    (function loadInitialTheme() {
      const saved = localStorage.getItem('todoListTheme');
      if (saved === 'dark') {
        document.body.classList.add('dark');
      }
    })();
    init();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
      // Cmd+S / Ctrl+S 保存但不关闭编辑窗口
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        saveTask(false);
      }
    });
  </script>

    // ✏️ 点击「重命名」按钮 → 把文件名 span 替换为 input
    function startRenameJsonFile() {
      if (!editingId) return;
      const nameEl = document.getElementById('jsonFileName');
      const btn = document.getElementById('jsonFileRenameBtn');
      if (!nameEl || !btn) return;
      // 已经是 input 中就不重复进入
      if (document.getElementById('jsonFileRenameInput')) return;
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'jsonFileRenameInput';
      input.className = 'json-file-rename-input';
      input.value = editingId;
      input.maxLength = 64;
      input.title = '仅允许字母、数字、横线、下划线';
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commitRenameJsonFile(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancelRenameJsonFile(); }
      });
      // 第一行：替换 nameEl 为 input（input 插在原 nameEl 位置，nameEl 隐藏）
      nameEl.style.display = 'none';
      nameEl.parentNode.insertBefore(input, nameEl);
      // 第二行：「重命名(JSON)」按钮改文案为「✓ 确定(JSON)」，仍占整行
      btn.textContent = '✓ 确定(JSON)';
      btn.title = '确认重命名（Enter）';
      btn.onclick = commitRenameJsonFile;
      // 第一行内：在 input 之后插入「✕ 取消」按钮（紧贴 input 右侧）
      // 用额外 class json-file-rename-cancel 避免继承 btn 的 width:100% 撑满整行
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'json-file-rename-btn json-file-rename-cancel';
      cancelBtn.id = 'jsonFileRenameCancelBtn';
      cancelBtn.textContent = '✕';
      cancelBtn.title = '取消（Esc）';
      cancelBtn.onclick = cancelRenameJsonFile;
      input.parentNode.insertBefore(cancelBtn, input.nextSibling);
      input.focus();
      input.select();
    }

    // 重命名待确认数据（回车后暂存，确认框「保存」才真正执行磁盘改名）
    let pendingRenameOldId = null;
    let pendingRenameNewId = null;

    // ✓ 回车提交：本地校验 → 暂存 → 弹确认框（不直接改磁盘）
    async function commitRenameJsonFile() {
      const input = document.getElementById('jsonFileRenameInput');
      if (!input) return;
      const oldId = editingId;
      const newId = input.value.trim();
      if (!newId) {
        alert('新 ID 不能为空');
        input.focus();
        return;
      }
      // 白名单校验：中文、英文、数字、横线、下划线、空格（排除 / \ . 等路径穿越字符）
      if (!/^[\p{L}\p{N}_\-\s]+$/u.test(newId)) {
        alert('新 ID 只能包含中文、英文、数字、横线、下划线、空格');
        input.focus();
        return;
      }
      if (newId === oldId) {
        // 没变，直接退出重命名态
        cancelRenameJsonFile();
        return;
      }
      if (!window.electronAPI || !window.electronAPI.renameTodoFile) {
        alert('重命名功能不可用（IPC 缺失）');
        return;
      }
      // 校验通过 → 暂存待确认数据，弹出确认框
      pendingRenameOldId = oldId;
      pendingRenameNewId = newId;
      showRenameConfirm(newId);
    }

    // 显示重命名确认框
    function showRenameConfirm(newId) {
      const overlay = document.getElementById('renameConfirmOverlay');
      const msg = document.getElementById('renameConfirmMsg');
      if (msg) msg.textContent = `确认将 JSON 文件改名为 todo-${newId}.json 吗？`;
      if (overlay) overlay.style.display = 'flex';
    }

    // 确认框「保存」：真正执行磁盘改名 + 同步内存
    async function confirmRenameSave() {
      const overlay = document.getElementById('renameConfirmOverlay');
      const oldId = pendingRenameOldId;
      const newId = pendingRenameNewId;
      if (overlay) overlay.style.display = 'none';
      pendingRenameOldId = null;
      pendingRenameNewId = null;
      if (!oldId || !newId) return;
      try {
        const result = await window.electronAPI.renameTodoFile(oldId, newId);
        if (!result || !result.success) {
          alert('重命名失败：' + (result?.error || '未知错误'));
          cancelRenameJsonFile(); // 恢复 UI，让用户可重试
          return;
        }
      } catch (e) {
        console.error('[TodoList] 重命名 todo 文件失败:', e);
        alert('重命名失败：' + (e?.message || e));
        cancelRenameJsonFile();
        return;
      }
      // 主进程重命名成功 → 同步更新内存
      const todo = todos.find(t => t.id === oldId);
      if (todo) {
        todo.id = newId;
        todo.updatedAt = Date.now();
      }
      editingId = newId;
      // 退出重命名 UI + 刷新文件名显示
      cancelRenameJsonFile();
      updateJsonFileDisplay();
      // 关键：重渲染画廊卡片，使卡片的 data-id 与功能条 JSON 名同步为新 id。
      // 否则卡片 DOM 仍保留旧 id → 双击 openEditModal(旧id) 找不到 todo（无法进入编辑），且名称不刷新。
      renderTodos();
      console.log(`[TodoList] todo id 已从 ${oldId} 改为 ${newId}`);
    }

    // 确认框「放弃」：取消重命名，不执行任何磁盘改动（内存/文件均不变）
    function confirmRenameDiscard() {
      const overlay = document.getElementById('renameConfirmOverlay');
      if (overlay) overlay.style.display = 'none';
      pendingRenameOldId = null;
      pendingRenameNewId = null;
      // 恢复文件名显示，保持编辑模态框打开（回到可继续编辑状态）
      cancelRenameJsonFile();
    }

    // ✕ 取消重命名：恢复 span + 按钮初始态
    function cancelRenameJsonFile() {
      const input = document.getElementById('jsonFileRenameInput');
      const cancelBtn = document.getElementById('jsonFileRenameCancelBtn');
      const btn = document.getElementById('jsonFileRenameBtn');
      const nameEl = document.getElementById('jsonFileName');
      if (input) input.remove();
      if (cancelBtn) cancelBtn.remove();
      if (btn) {
        btn.textContent = '✏️ 重命名(JSON)';
        btn.title = '重命名 JSON 文件（ID）';
        btn.onclick = startRenameJsonFile;
      }
      if (nameEl) nameEl.style.display = '';
    }

    // ========== 编辑退出前的「未保存更改」检测 + 问询后存档 ==========
    // 在打开编辑/新增模态框时采集原始内容快照。
    function captureEditSnapshot() {
      editSnapshot = {
        text: document.getElementById('taskText').value,
        html: document.getElementById('htmlText').value,
        tags: JSON.stringify(selectedTagsForModal),
        attachments: JSON.stringify(pendingAttachments),
        color: getSelectedTodoColor()
      };
    }

    // 当前编辑器内容是否与快照不同（即存在未保存更改）。
    function hasUnsavedChanges() {
      if (!editSnapshot) return false;
      return document.getElementById('taskText').value !== editSnapshot.text
          || document.getElementById('htmlText').value !== editSnapshot.html
          || JSON.stringify(selectedTagsForModal) !== editSnapshot.tags
          || JSON.stringify(pendingAttachments) !== editSnapshot.attachments
          || getSelectedTodoColor() !== editSnapshot.color;
    }

    // 关闭「问询后存档」确认框（取消/点背景）。
    function cancelUnsavedConfirm() {
      const overlay = document.getElementById('unsavedConfirmOverlay');
      if (overlay) overlay.style.display = 'none';
    }

    // 「保存并关闭」：先关确认框，再走正常保存流程（saveTask 内部关闭时 skipPrompt）。
    function saveAndCloseFromConfirm() {
      cancelUnsavedConfirm();
      saveTask(true);
    }

    // 「不保存」：丢弃当前编辑内容，直接关闭（不二次问询）。
    function discardAndCloseFromConfirm() {
      cancelUnsavedConfirm();
      closeModal(undefined, undefined, true);
    }

    function closeModal(event, focusId, skipPrompt = false) {
      // 先做 target 判定：modal-overlay 上的 onclick 会接收所有冒泡上来的点击
      // （toolbar 按钮、标签、背景色块、附件等都会冒泡到 modal-overlay），
      // 因此"弹未保存提示"前必须先排除 modal 内部点击，否则用户点 toolbar/标签/
      // 背景色块/附件都会弹窗，干扰编辑。点 modal 之外的暗色背景才会继续往下走。
      if (event && event.target !== event.currentTarget) return;
      // 退出编辑前，若存在未保存更改且非「保存后自动关闭」，弹出「问询后存档」确认框。
      if (!skipPrompt && hasUnsavedChanges()) {
        const overlay = document.getElementById('unsavedConfirmOverlay');
        if (overlay) overlay.style.display = 'flex';
        return;
      }
      // focusId 未显式传入时默认聚焦当前编辑中的卡片（取消/✕/ESC 场景）；
      // 保存场景由调用方显式传入，以同时覆盖「编辑」与「新增」两种卡片
      const fid = (focusId !== undefined) ? focusId : editingId;
      // 关闭时清理重命名输入态（避免残留 input 元素）
      if (typeof cancelRenameJsonFile === 'function') cancelRenameJsonFile();
      document.getElementById('modalOverlay').style.display = 'none';
      previewMode = 0;
      document.getElementById('mdPreview').classList.remove('show');
      document.getElementById('taskText').style.display = '';
      document.getElementById('htmlText').style.display = 'none';
      document.getElementById('mdToggleBtn').classList.remove('active');
      document.getElementById('mdToggleBtn').textContent = '编辑文本';
      document.getElementById('mdToggleBtn').title = '点击切换到 Markdown 预览';
      clearSearchHighlights();
      searchMatches = [];
      currentMatchIndex = -1;
      lastSearchEnterQuery = '';
      updateSearchNavButtons();
      // 回到卡片画面：把刚操作（编辑/新增）的卡片滚入可视区 + 金边心跳 3 秒（与拖拽尺寸后聚焦同源）
      if (fid) {
        setTimeout(() => focusResizedCard(fid), 320);
      }
      // 模态框完全关闭后清空未保存检测快照
      editSnapshot = null;
      currentMdId = null;
    }

    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          pendingAttachments.push({
            name: file.name,
            size: formatFileSize(file.size),
            type: file.type,
            data: e.target.result
          });
          renderPendingAttachments();
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function removePendingAttachment(index) {
      pendingAttachments.splice(index, 1);
      renderPendingAttachments();
    }

    function renderPendingAttachments() {
      const container = document.getElementById('attachmentsList');
      if (pendingAttachments.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = pendingAttachments.map((att, idx) => `
        <div class="attachment-list-item">
          <span class="attachment-list-icon">📄</span>
          <div class="attachment-list-info">
            <div class="attachment-list-name" title="${att.name}">${att.name}</div>
            <div class="attachment-list-size">${att.size}</div>
          </div>
          <span class="attachment-list-remove" onclick="removePendingAttachment(${idx})">✕</span>
        </div>
      `).join('');
    }

    async function saveTask(closeAfterSave = true) {
      const textarea = document.getElementById('taskText');
      const htmlTextarea = document.getElementById('htmlText');
      const text = textarea.value.trim();
      const htmlValue = htmlTextarea.value.trim();

      // ===== MD 文件（纯 .md，无 JSON / 无标签·颜色·附件等元数据）=====
      if (activeFileTab === 'md') {
        if (!text) {
          alert('请输入内容');
          return;
        }
        let mdId = currentMdId;
        if (!mdId) {
          mdId = 'md-' + Date.now().toString();
          currentMdId = mdId;
        }
        try {
          await window.electronAPI.saveMdFile(mdId, textarea.value.replace(/\r\n/g, '\n'));
          if (closeAfterSave) {
            closeModal(undefined, undefined, true);
          }
        } catch (e) {
          console.error('[TodoList] 保存 MD 文件失败:', e);
          alert('保存 MD 文件失败：' + (e && e.message ? e.message : e));
        }
        return;
      }

      // ===== todo 卡片（JSON）=====
      // HTML 编辑模式与 Markdown 编辑模式各自独立保存，互不影响
      if (previewMode === 2) {
        if (!htmlValue) {
          alert('请输入 HTML 内容');
          return;
        }
      } else {
        if (!text) {
          alert('请输入任务内容');
          return;
        }
      }

      if (editingId) {
        const todo = todos.find(t => t.id === editingId);
        if (todo) {
          if (previewMode === 2) {
            // HTML 编辑模式：只更新 htmlContent，不更动 text
            todo.htmlContent = htmlValue;
          } else {
            // Markdown 编辑模式：只更新 text，不更动 htmlContent
            todo.text = text;
          }
          todo.tags = selectedTagsForModal;
          delete todo.tag;
          todo.attachments = pendingAttachments;
          todo.bgColor = getSelectedTodoColor();
          todo.updatedAt = Date.now();
        }
      } else {
        const newTodo = {
          id: Date.now().toString(),
          text: previewMode !== 2 ? text : '',
          htmlContent: previewMode === 2 ? htmlValue : undefined,
          tags: selectedTagsForModal,
          attachments: pendingAttachments,
          bgColor: getSelectedTodoColor(),
          completed: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          completedAt: null
        };
        todos.unshift(newTodo);
      }

      const isEdit = !!editingId;
      await saveTodos();
      if (closeAfterSave) {
        // 保存后自动关闭：编辑场景聚焦原卡片，新增场景聚焦刚插入队首的卡片
        const focusCardId = isEdit ? editingId : (todos[0] && todos[0].id);
        // skipPrompt=true：已保存，无需再弹「问询后存档」
        closeModal(undefined, focusCardId, true);
      }
    }

    //  从外部创建 todo 卡片（供 capture.js 调用）
    window.addTodoFromExternal = async function(text, tags = [], htmlContent = '') {
      if (!text || !text.trim()) return { success: false, message: '内容为空' };
      try {
        const newTodo = {
          id: Date.now().toString(),
          text: text.trim(),
          htmlContent: htmlContent || '',
          tags: tags,
          attachments: [],
          bgColor: '',
          completed: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          completedAt: null
        };
        todos.unshift(newTodo);
        await saveTodos();
        renderTodos();
        updateStats();
        return { success: true, message: '已建立 ToDo 卡片' };
      } catch (err) {
        return { success: false, message: err.message };
      }
    };

    function startResize(event, id) {
      event.preventDefault();
      event.stopPropagation();
      resizingId = id;
      resizingEl = document.querySelector(`.todo-item[data-id="${id}"]`);
      if (!resizingEl) return;
      const rect = resizingEl.getBoundingClientRect();
      // 记录起始坐标和尺寸（宽高都处理）
      resizingStartY = event.clientY;
      resizingStartH = rect.height;
      resizingStartX = event.clientX;
      resizingStartW = rect.width;
      resizingEl.setAttribute('data-height', 'true');
      resizingEl.setAttribute('data-width', 'true');
      // 拖拽时强制脱离 flex 弹性分配，使用固定像素宽度
      // 无论卡片之前是否有自定义宽度，都统一使用 width 固定尺寸
      resizingEl.style.flex = '0 0 auto';
      resizingEl.style.minWidth = '0';
      resizingEl.style.width = rect.width + 'px';
      resizingEl.style.height = rect.height + 'px';
      resizingEl.style.maxHeight = 'none';
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'nwse-resize';
      document.addEventListener('mousemove', onResize);
      document.addEventListener('mouseup', stopResize);
    }

    function onResize(event) {
      if (!resizingEl) return;
      // 高度调整
      const deltaY = event.clientY - resizingStartY;
      const newHeight = Math.max(MIN_CARD_HEIGHT, resizingStartH + deltaY);
      resizingEl.style.height = newHeight + 'px';
      // 宽度调整：直接使用 width，更直观可靠
      const deltaX = event.clientX - resizingStartX;
      const newWidth = Math.max(MIN_CARD_WIDTH, resizingStartW + deltaX);
      resizingEl.style.width = newWidth + 'px';
      // 实时切换 tiny 态（与 applyTinyStates 一致：1/16 进 tiny 用 cover 铺满，1/20 固定缩到 1/4）
      applyTinyStates();
    }

    async function stopResize() {
      if (resizingEl && resizingId) {
        const rect = resizingEl.getBoundingClientRect();
        const newHeight = Math.round(rect.height);
        const newWidth = Math.round(rect.width);
        const todo = todos.find(t => t.id === resizingId);
        if (todo) {
          todo.height = newHeight;
          todo.width = newWidth;
          // 调整卡片尺寸不视为内容异动，不更新 updatedAt
          await saveTodos();
        }
        const cardId = resizingId;
        // 清除所有拖拽时的内联样式，交由 renderTodos 重新渲染时应用持久化的新尺寸
        resizingEl.style.flex = '';
        resizingEl.style.minWidth = '';
        resizingEl.style.width = '';
        resizingEl.style.height = '';
        resizingEl.style.maxHeight = '';
        // 重建网格：应用新尺寸 + Muuri 重新填空隙排版（卡片会落到最终位置）
        renderTodos();
        // 等 Muuri 布局动画稳定后，把卡片滚入可视区并金边呼吸 3 秒
        setTimeout(() => focusResizedCard(cardId), 320);
      }
      resizingId = null;
      resizingEl = null;
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      document.removeEventListener('mousemove', onResize);
      document.removeEventListener('mouseup', stopResize);
    }

    // 拖拽调整完卡片尺寸后：把卡片自动滚入可视区，并加金边心跳高亮 3 秒
    function focusResizedCard(id) {
      const card = document.querySelector(`.todo-item[data-id="${id}"]`);
      if (!card) return;
      scrollCardIntoView(card);
      card.classList.add('resize-focus');
      setTimeout(() => card.classList.remove('resize-focus'), 3000);
    }

    // 📋 文件列表下拉（搜索框右侧 📋 按钮触发）
    //   状态：
    //     fileListState = { open, sortKey: 'name'|'mtime'|'size', sortDir: 'asc'|'desc',
    //                       items: [{id,name,size,mtime}], loaded, pendingId }
    //   流程：
    //     1. 点击触发按钮 → 切换 open 状态；首次打开时从主进程拉取文件元数据
    //     2. 切换排序标签 → 重排 + 重渲列表
    //     3. 点击列表项 → 关闭面板 + focusResizedCard(id)（滚动 + 金边闪 3 秒）
    //     4. 点击面板外 → 关闭面板
    let fileListState = { open: false, sortKey: 'mtime', sortDir: 'desc', items: [], loaded: false };

    function toggleFileList() {
      const trigger = document.getElementById('fileListTrigger');
      const panel = document.getElementById('fileListPanel');
      if (fileListState.open) {
        closeFileList();
      } else {
        fileListState.open = true;
        trigger.classList.add('open');
        panel.classList.add('open');
        // 每次按开都重新拉取最新资料（用户改名/新建/删除/外部修改文件后能立刻反映）
        loadFileListItems();
      }
    }

    function closeFileList() {
      fileListState.open = false;
      const trigger = document.getElementById('fileListTrigger');
      const panel = document.getElementById('fileListPanel');
      if (trigger) trigger.classList.remove('open');
      if (panel) panel.classList.remove('open');
    }

    async function loadFileListItems() {
      const body = document.getElementById('fileListBody');
      const footer = document.getElementById('fileListFooter');
      if (body) body.innerHTML = '';
      if (footer) footer.textContent = '加载中...';
      try {
        if (!window.electronAPI || !window.electronAPI.listTodoFiles) {
          if (footer) footer.textContent = 'electronAPI.listTodoFiles 不可用';
          return;
        }
        // 同时拉取 todo 卡片（JSON）与 MD 纯文本文件，合并展示
        const todoRes = await window.electronAPI.listTodoFiles();
        const mdRes = (window.electronAPI.listMdFiles)
          ? await window.electronAPI.listMdFiles()
          : { success: true, data: [] };
        const todoItems = (todoRes && todoRes.success) ? (todoRes.data || []).map(it => ({ ...it, type: 'todo' })) : [];
        const mdItems = (mdRes && mdRes.success) ? (mdRes.data || []).map(it => ({ ...it, type: 'md' })) : [];
        fileListState.items = todoItems.concat(mdItems);
        fileListState.loaded = true;
        renderFileList();
      } catch (e) {
        console.error('[TodoList] 加载文件列表失败:', e);
        if (footer) footer.textContent = '加载失败：' + e.message;
      }
    }

    // 排序后渲染（不动主数据，仅在内存里排一遍）
    function renderFileList() {
      const key = fileListState.sortKey;
      const dir = fileListState.sortDir === 'asc' ? 1 : -1;
      const items = fileListState.items.slice().sort((a, b) => {
        if (key === 'name') {
          // 名称排序时按「自然序」（数字部分按数值比）—— 178695... < 178696... < ...
          return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }) * dir;
        }
        return ((a[key] || 0) - (b[key] || 0)) * dir;
      });
      const body = document.getElementById('fileListBody');
      const footer = document.getElementById('fileListFooter');
      if (!body || !footer) return;
      if (items.length === 0) {
        body.innerHTML = '';
        footer.textContent = '共 0 个文件';
        return;
      }
      // 元信息格式：时间=YYYY-MM-DD HH:mm，大小=B/KB/MB（自动）
      // 状态徽标：todo 从内存 todos 查 completed；md 文件显示「📄 MD」徽标
      body.innerHTML = items.map(it => {
        const date = new Date(it.mtime);
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const hh = String(date.getHours()).padStart(2, '0');
        const mi = String(date.getMinutes()).padStart(2, '0');
        const timeStr = `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
        const sizeStr = formatFileSizeShort(it.size);
        const isMd = it.type === 'md';
        let statusText, statusClass, itemClass;
        if (isMd) {
          statusText = '📄 MD';
          statusClass = 'md';
          itemClass = '';
        } else {
          // 从内存查完成态；找不到（文件存在但内存未加载）按待完成兜底
          const todo = (typeof todos !== 'undefined' && Array.isArray(todos))
            ? todos.find(t => t.id === it.id)
            : null;
          const isCompleted = !!(todo && todo.completed);
          statusText = isCompleted ? '已完成' : '待完成';
          statusClass = isCompleted ? 'completed' : 'pending';
          itemClass = isCompleted ? 'completed' : '';
        }
        return `<div class="file-list-item ${itemClass}" data-id="${escapeHtml(it.id)}" data-type="${isMd ? 'md' : 'todo'}" onclick="selectFileListItem('${escapeHtml(it.id)}', '${isMd ? 'md' : 'todo'}')" title="${escapeHtml(it.name)}">
          <span class="file-list-item-name">${escapeHtml(it.name)}</span>
          <span class="file-list-item-meta">${timeStr} · ${sizeStr}</span>
          <span class="file-list-item-status ${statusClass}">${statusText}</span>
        </div>`;
      }).join('');
      footer.textContent = `共 ${items.length} 个文件`;
    }

    // 简化的体积格式（B/KB/MB）—— 主进程已有完整版 formatFileSize，前端独立版本避免重复 IPC
    function formatFileSizeShort(bytes) {
      if (typeof bytes !== 'number' || isNaN(bytes)) return '';
      if (bytes < 1024) return bytes + 'B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
      return (bytes / (1024 * 1024)).toFixed(2) + 'MB';
    }

    // 切换排序：同名按钮二次点击反向排序；切到不同键时使用该键默认方向（名称 asc / 时间 desc / 大小 desc）
    function changeFileListSort(sortKey, defaultDir) {
      const btns = document.querySelectorAll('.file-list-sort-btn');
      btns.forEach(b => b.classList.remove('active'));
      const target = document.querySelector(`.file-list-sort-btn[data-sort="${sortKey}"]`);
      if (fileListState.sortKey === sortKey) {
        fileListState.sortDir = fileListState.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        fileListState.sortKey = sortKey;
        fileListState.sortDir = defaultDir;
      }
      if (target) {
        target.classList.add('active');
        target.dataset.dir = fileListState.sortDir;
      }
      renderFileList();
    }

    // 选中某个文件 → 跳到对应卡片 + 金边闪烁 3 秒（复用保存/拖拽尺寸后的同款动画）
    function selectFileListItem(id, type) {
      closeFileList();
      // MD 纯文本文件：以 MD 模式打开抽屉（页签锁定，无元数据）
      if (type === 'md') {
        openEditMdModal(id);
        return;
      }
      // 防御：若卡片已被过滤（标签/状态筛选）导致 .todo-item 不存在，给出一次提示
      const card = document.querySelector(`.todo-item[data-id="${id}"]`);
      if (!card) {
        showToast && showToast(`未找到卡片 ${id}（可能被筛选条件隐藏）`, 'warning');
        return;
      }
      // 320ms 等待面板关闭动画 + 焦点位移完成再触发滚动，避免抖动
      setTimeout(() => focusResizedCard(id), 100);
    }

    // 🆕 卡片间跳转：处理 .card-jump-link 的点击。
    // 接收 data-card-id（已 transformCardLinks 归一化 + escapeHtml 过），
    // 再走一遍归一化（防御性），用 focusResizedCard 触发滚动 + 金边闪动。
    // 🆕 归一化卡片 id：去掉 todo- 前缀与 .json 后缀（与卡片 data-id 对齐）
    function normalizeCardId(raw) {
      if (!raw) return '';
      let s = String(raw).trim();
      const lower = s.toLowerCase();
      if (lower.startsWith('todo-')) s = s.slice(5);
      if (lower.endsWith('.json')) s = s.slice(0, -5);
      return s;
    }

    // 🆕 卡片间跳转导航栈：存「访问路径」（含起点），栈顶 = 当前所在卡片（归一化 id）。
    // 长度 >=2 时栈顶卡片显示「返回」按钮；navigateBack 后回到上一站，按钮随之移动/消失。
    let navStack = [];

    // 🆕 卡片间跳转：处理 .card-jump-link 的点击。
    // sourceId 为链接所在卡片（来源）；不传 sourceId 表示来自 navigateBack（不压栈）。
    function jumpToCard(cardId, sourceId) {
      if (!cardId) return;
      const id = normalizeCardId(cardId);
      if (!id) return;
      // 新跳转（带来源）：来源与目标不同才压栈，避免自链接污染
      let pushedSrc = false;
      if (sourceId) {
        const src = normalizeCardId(sourceId);
        if (src && src !== id) {
          if (navStack[navStack.length - 1] !== src) { navStack.push(src); pushedSrc = true; }
          navStack.push(id);
        }
      }
      // CSS.escape 在 jsdom 里不存在、在真实 Electron 渲染进程里存在——加防御性 fallback。
      // 关键：不要在三元真值分支里引用裸 CSS（即使有 window.CSS guard 也会因
      //   parse/求值时机抛 ReferenceError），必须写 window.CSS.escape 让短路生效。
      const safeId = (window.CSS && typeof window.CSS.escape === 'function')
        ? window.CSS.escape(id)
        : id.replace(/"/g, '\\"');
      const card = document.querySelector(`.todo-item[data-id="${safeId}"]`);
      if (!card) {
        // 目标不存在：镜像回滚本次压栈（只弹本次新增的条目，不动此前合法栈）
        if (sourceId) {
          if (navStack[navStack.length - 1] === id) navStack.pop();
          if (pushedSrc && navStack[navStack.length - 1] === normalizeCardId(sourceId)) navStack.pop();
        }
        if (typeof showStatus === 'function') showStatus('未找到目标卡片：' + id, 'error');
        return;
      }
      focusResizedCard(id);
      updateReturnButtons();
    }

    // 🆕 新窗口查看卡片 markdown：[文字](win:ID) 点击后，在一个独立窗口里渲染该卡片的 markdown
    function openCardWindow(cardId) {
      if (!cardId) return;
      const id = normalizeCardId(cardId);
      if (!id) return;
      const todo = todos.find(t => normalizeCardId(t.id) === id);
      if (!todo) {
        // 🆕 卡片没找到，但目标形似文件路径（含路径分隔符/~开头/盘符/末尾扩展名）→
        //    按「新窗体打开文件」处理（与点 file:// 链接同管线，见 openDocWindow）；
        //    只写档名时默认在卡片同款资料目录查找（与 win:卡片ID 定位逻辑一致，主进程 resolve-doc-path 解析），
        //    既不是卡片也不是有效文件时给出明确的状态栏提示。
        const looksLikePath = /(?:[/~]|^[a-zA-Z]:\\)/.test(cardId) || /\.[a-z0-9]{1,10}$/i.test(cardId);
        if (looksLikePath) {
          const api = window.electronAPI;
          if (api && typeof api.invoke === 'function'
              && !cardId.includes('/') && !cardId.includes('\\') && !cardId.startsWith('~')
              && !/^[a-zA-Z]:\\/.test(cardId)) {
            // 裸档名 → 默认资料目录解析（命中即开窗；未命中明确提示，不回落其它目录）
            api.invoke('resolve-doc-path', { name: cardId }).then(res => {
              if (res && res.success) {
                openDocWindow('file://' + res.path, cardId);
              } else if (typeof showStatus === 'function') {
                showStatus('未找到目标卡片，资料目录中也无此文件：' + cardId, 'error');
              }
            }).catch(() => {
              if (typeof showStatus === 'function') showStatus('未找到目标卡片：' + id, 'error');
            });
            return;
          }
          openDocWindow('file://' + cardId, cardId.split('/').pop());
          return;
        }
        if (typeof showStatus === 'function') showStatus('未找到目标卡片：' + id, 'error');
        return;
      }
      // 与卡片本体显示一致地渲染 markdown（不含搜索高亮），作为独立窗体内容
      let html;
      const mode = getEffectiveRenderMode(todo);
      if (mode === 'html' && todo.htmlContent) html = adaptHtmlForTheme(todo.htmlContent);
      else html = renderMarkdown(todo.text || '');
      const title = '卡片：' + id;
      const dark = document.body.classList.contains('dark');
      if (window.electronAPI && typeof window.electronAPI.invoke === 'function') {
        window.electronAPI.invoke('open-card-window', { id, title, html, dark });
      } else if (typeof showStatus === 'function') {
        showStatus('当前环境不支持打开新窗口', 'error');
      }
    }

    // 🆕 新窗口查看图片：[文字](win-img:URL) 点击后，在独立窗口里居中显示该图片
    function openImageWindow(imgSrc, label) {
      if (!imgSrc) return;
      const title = label ? ('图片：' + label) : '图片';
      if (window.electronAPI && typeof window.electronAPI.invoke === 'function') {
        window.electronAPI.invoke('open-image-window', { src: imgSrc, title });
      } else if (typeof showStatus === 'function') {
        showStatus('当前环境不支持打开新窗口', 'error');
      }
    }

    // 🆕 文档窗体：[文字](file:///) 点击后，非图片的文本文件在独立窗口里显示 ——
    //   .md/.markdown → 用 renderMarkdown 按卡片同样的 markdown 样式渲染；
    //   其它文本/代码（txt/json/js/py/css/html/log/csv/sh...）→ 包成围栏代码块，走 hljs 语法高亮；
    //   二进制/超大/不存在 → 状态栏提示。窗体复用 open-card-window（卡片 markdown 窗体）。
    const DOC_LANG_MAP = {
      js: 'javascript', mjs: 'javascript', cjs: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
      json: 'json', py: 'python', rb: 'ruby', sh: 'bash', zsh: 'bash', bash: 'bash',
      css: 'css', html: 'xml', htm: 'xml', xml: 'xml', svg: 'xml',
      yml: 'yaml', yaml: 'yaml', sql: 'sql', java: 'java', c: 'c', cpp: 'cpp', h: 'c', hpp: 'cpp',
      go: 'go', rs: 'rust', php: 'php', swift: 'swift', kt: 'kotlin',
      txt: 'plaintext', log: 'plaintext', csv: 'plaintext', ini: 'ini', toml: 'ini', conf: 'plaintext'
    };
    async function openDocWindow(fileUrl, label) {
      const api = window.electronAPI;
      if (!api || typeof api.invoke !== 'function') {
        if (typeof showStatus === 'function') showStatus('当前环境不支持打开文档窗口', 'error');
        return;
      }
      // file:// → 真实路径（还原中文等 percent-encode）
      let filePath = fileUrl.replace(/^file:\/\//i, '');
      try { filePath = decodeURIComponent(filePath); } catch (_) {}
      const name = filePath.split('/').pop() || filePath;
      const ext = (name.match(/\.([a-z0-9]+)$/i) || [ '', ''])[1].toLowerCase();
      let res;
      try { res = await api.invoke('read-text-file', { path: filePath }); }
      catch (e) {
        if (typeof showStatus === 'function') showStatus('❌ 打开文件失败：' + e.message, 'error');
        return;
      }
      if (!res || !res.success) {
        if (typeof showStatus === 'function') showStatus('❌ ' + ((res && res.error) || '读取文件失败'), 'error');
        return;
      }
      let html;
      // force: true —— 文件内容是原始 markdown/源码，跳过「已渲染 KaTeX 短路」，
      //   否则提及 <span class="katex"> 等字样的文档会被误判而原样输出为纯文本。
      if (ext === 'md' || ext === 'markdown') {
        html = renderMarkdown(res.content, { force: true });
      } else {
        // 围栏长度须大于内容里最长反引号串，避免代码块被内容里的 ``` 截断
        let n = 3;
        const runs = res.content.match(/`{3,}/g);
        if (runs) n = Math.max.apply(null, runs.map(s => s.length)) + 1;
        const fence = '`'.repeat(n);
        const lang = DOC_LANG_MAP[ext] || '';
        html = renderMarkdown(fence + lang + '\n' + res.content.replace(/[\r\n\s]+$/, '') + '\n' + fence, { force: true });
      }
      const dark = document.body.classList.contains('dark');
      api.invoke('open-card-window', { id: name, title: '文档：' + (label || name), html, dark });
    }

    // 🆕 点「返回」按钮：回到 navStack 上一站（来源卡片），目的卡片的返回标记随之消失。
    function navigateBack() {
      if (navStack.length < 2) return;   // 不足两站，无来源可回
      navStack.pop();                     // 弹出当前（目的）卡片
      const dest = navStack[navStack.length - 1]; // 来源 = 弹出后的栈顶
      jumpToCard(dest);                   // 不带 sourceId → 不压栈
    }

    // 🆕 按 navStack 设置各卡片「返回」按钮显隐：仅栈顶（当前所在）卡片显示。
    function updateReturnButtons() {
      const top = navStack.length >= 2 ? navStack[navStack.length - 1] : null;
      document.querySelectorAll('.todo-item').forEach(card => {
        const btn = card.querySelector('.return-btn');
        if (!btn) return;
        const show = top && normalizeCardId(card.dataset.id) === top;
        btn.style.display = show ? 'flex' : 'none';
      });
    }

    // 将卡片滚动到 .todo-list 滚动容器的可视区域内（能居中则居中，过高则顶部对齐）
    function scrollCardIntoView(card) {
      const container = document.getElementById('todoList');
      if (!container || !card) return;
      const cRect = container.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      const cardH = cardRect.height;
      const contH = container.clientHeight;
      const delta = cardRect.top - cRect.top; // 卡片相对容器可视顶部的偏移
      // 已在可视区内则不动
      if (delta >= 0 && delta + cardH <= contH) return;
      let target;
      if (cardH <= contH) {
        target = container.scrollTop + delta - (contH - cardH) / 2; // 居中显示
      } else {
        target = container.scrollTop + delta - 12; // 顶部留 12px
      }
      container.scrollTop = Math.max(0, target);
    }

    async function resetCardSize(event, id) {
      event.preventDefault();
      event.stopPropagation();
      const todo = todos.find(t => t.id === id);
      if (todo) {
        let changed = false;
        if (todo.height) { delete todo.height; changed = true; }
        if (todo.width) { delete todo.width; changed = true; }
        if (changed) {
          // 重置卡片尺寸不视为内容异动，不更新 updatedAt
          await saveTodos();
        }
      }
    }

    async function init() {
      await loadTodos();
      renderTagFilter();
      renderTodos();
      updateStats();
      // 父窗口尺寸变化时，重新判断各卡片是否进入 tiny 态
      window.addEventListener('resize', applyTinyStates);
      // 📋 文件列表下拉：挂触发按钮 + 排序标签的事件，并绑定外部点击关闭面板
      initFileListDropdown();
    }

    // 📋 文件列表下拉初始化：触发按钮 onclick、排序按钮 onclick、document 级点击关闭
    function initFileListDropdown() {
      const trigger = document.getElementById('fileListTrigger');
      if (trigger) trigger.addEventListener('click', (e) => { e.stopPropagation(); toggleFileList(); });
      // 排序按钮（三个）：第二次点同键反向排序；切换不同键时使用对应默认方向
      const sortMap = { name: 'asc', mtime: 'desc', size: 'desc' };
      document.querySelectorAll('.file-list-sort-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const k = btn.dataset.sort;
          changeFileListSort(k, sortMap[k] || 'desc');
        });
      });
      // 点击面板内区域不关闭（避免误关）
      const panel = document.getElementById('fileListPanel');
      if (panel) panel.addEventListener('click', (e) => e.stopPropagation());
      // 点击面板外关闭
      document.addEventListener('click', () => {
        if (fileListState.open) closeFileList();
      });
      // ESC 关闭
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && fileListState.open) closeFileList();
      });
    }

    // 主题由主程式统一控制，通过 CSS 注入实现（主程式 insertCSS 添加 body.dark）
    // 页面加载时从 localStorage 读取初始状态（兼容旧数据）
    (function loadInitialTheme() {
      const saved = localStorage.getItem('todoListTheme');
      if (saved === 'dark') {
        document.body.classList.add('dark');
      }
      // 初始化 highlight.js 主题
      updateHljsTheme();
    })();
    init();

    // 🆕 卡片间跳转链接点击委托：拦截 .card-jump-link 的点击，跳到目标卡片 + 金边闪动。
    // 用事件委托（不挂 inline onclick），避免某些 Electron 安全配置下 javascript: 协议被拦截。
    document.addEventListener('click', (e) => {
      // 🆕 [文字](cur:URL)：在原浏览器开启 —— 不拦截，让当前窗体就地导航（file:// 与 https:// 皆可用）
      //（导航走后可用工具栏「后退」返回）
      const curLink = e.target && e.target.closest && e.target.closest('a.card-cur-link');
      if (curLink) return;
      // 🆕 [文字](win:ID)：在新窗口显示该卡片 markdown
      const winLink = e.target && e.target.closest && e.target.closest('a.card-win-link');
      if (winLink) {
        e.preventDefault();
        openCardWindow(winLink.getAttribute('data-card-id'));
        return;
      }
      // 🆕 [文字](win-img:URL)：在新窗口居中显示该图片
      const imgWinLink = e.target && e.target.closest && e.target.closest('a.card-win-img-link');
      if (imgWinLink) {
        e.preventDefault();
        const src = imgWinLink.getAttribute('data-img-src');
        const label = (imgWinLink.textContent || '').trim();
        openImageWindow(src, label);
        return;
      }
      const jumpLink = e.target && e.target.closest && e.target.closest('a.card-jump-link');
      if (jumpLink) {
        e.preventDefault();
        const sourceCard = jumpLink.closest('.todo-item');
        const sourceId = sourceCard ? sourceCard.dataset.id : null;
        jumpToCard(jumpLink.getAttribute('data-card-id'), sourceId);
        return;
      }
      // 🆕 不前置协议的普通链接（https:// 或 file://）：统一在新浏览器（新窗口）开启 ——
      //    http(s) → 应用内独立窗体（openWebPreview）；file:// 图片 → 图片查看窗体；
      //    其它 file:// → 文档窗体（.md 按 markdown 渲染、文本/代码语法高亮，见 openDocWindow）。
      //    避免当前窗体被导航走、也避免跳到系统浏览器离开程式。
      const extLink = e.target && e.target.closest && e.target.closest('a[href]');
      if (extLink) {
        const href = (extLink.getAttribute('href') || '').trim();
        if (/^https?:\/\//i.test(href)) {
          e.preventDefault();
          const api = window.electronAPI;
          if (api && typeof api.openWebPreview === 'function') {
            api.openWebPreview(href);
          } else {
            window.open(href, '_blank');
          }
          return;
        }
        if (/^file:\/\//i.test(href)) {
          e.preventDefault();
          if (/\.(png|jpe?g|gif|webp|bmp|svg|ico|avif)(?:[?#].*)?$/i.test(href)) {
            // 图片文件 → 图片查看窗体（与 win-img: 同效果）
            openImageWindow(href, (extLink.textContent || '').trim());
          } else {
            // 其它文件 → 文档窗体（.md 按 markdown 渲染、文本/代码语法高亮；二进制/超大会提示错误）
            openDocWindow(href, (extLink.textContent || '').trim());
          }
          return;
        }
      }
    });

    // 🆕 监听 body class 变化，主题切换时重新渲染卡片 + 切换代码高亮主题
    // 解决：切换主题后 adaptHtmlForTheme 未被重新调用的问题
    const themeObserver = new MutationObserver(() => {
      updateHljsTheme();
      renderTodos();
    });
    themeObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        // 若「问询后存档」确认框已打开，Esc 先取消确认框（留在编辑态），避免重复弹出
        const uc = document.getElementById('unsavedConfirmOverlay');
        if (uc && uc.style.display !== 'none') {
          cancelUnsavedConfirm();
          return;
        }
        closeModal();
      }
      // Cmd+S / Ctrl+S 保存但不关闭编辑窗口
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        saveTask(false);
      }
    });
  </script>
</body>
</html>

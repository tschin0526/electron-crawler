    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          pendingAttachments.push({
            name: file.name,
            size: formatFileSize(file.size),
            type: file.type,
            data: e.target.result
          });
          renderPendingAttachments();
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function removePendingAttachment(index) {
      pendingAttachments.splice(index, 1);
      renderPendingAttachments();
    }

    function renderPendingAttachments() {
      const container = document.getElementById('attachmentsList');
      if (pendingAttachments.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = pendingAttachments.map((att, idx) => `
        <div class="attachment-list-item">
          <span class="attachment-list-icon">📄</span>
          <div class="attachment-list-info">
            <div class="attachment-list-name" title="${att.name}">${att.name}</div>
            <div class="attachment-list-size">${att.size}</div>
          </div>
          <span class="attachment-list-remove" onclick="removePendingAttachment(${idx})">✕</span>
        </div>
      `).join('');
    }

    async function saveTask(closeAfterSave = true) {
      const textarea = document.getElementById('taskText');
      const htmlTextarea = document.getElementById('htmlText');
      const text = textarea.value.trim();
      const htmlValue = htmlTextarea.value.trim();

      // HTML 编辑模式与 Markdown 编辑模式各自独立保存，互不影响
      if (previewMode === 2) {
        if (!htmlValue) {
          alert('请输入 HTML 内容');
          return;
        }
      } else {
        if (!text) {
          alert('请输入任务内容');
          return;
        }
      }

      if (editingId) {
        const todo = todos.find(t => t.id === editingId);
        if (todo) {
          if (previewMode === 2) {
            // HTML 编辑模式：只更新 htmlContent，不更动 text
            todo.htmlContent = htmlValue;
          } else {
            // Markdown 编辑模式：只更新 text，不更动 htmlContent
            todo.text = text;
          }
          todo.tags = selectedTagsForModal;
          delete todo.tag;
          todo.attachments = pendingAttachments;
          todo.bgColor = getSelectedTodoColor();
          todo.updatedAt = Date.now();
        }
      } else {
        const newTodo = {
          id: Date.now().toString(),
          text: previewMode === 2 ? '' : text,
          htmlContent: previewMode === 2 ? htmlValue : undefined,
          tags: selectedTagsForModal,
          attachments: pendingAttachments,
          bgColor: getSelectedTodoColor(),
          completed: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          completedAt: null
        };
        todos.unshift(newTodo);
      }

      const isEdit = !!editingId;
      await saveTodos();
      if (closeAfterSave) {
        // 保存后自动关闭：编辑场景聚焦原卡片，新增场景聚焦刚插入队首的卡片
        const focusCardId = isEdit ? editingId : (todos[0] && todos[0].id);
        closeModal(undefined, focusCardId);
      }
    }

    //  从外部创建 todo 卡片（供 capture.js 调用）
    window.addTodoFromExternal = async function(text, tags = [], htmlContent = '') {
      if (!text || !text.trim()) return { success: false, message: '内容为空' };
      try {
        const newTodo = {
          id: Date.now().toString(),
          text: text.trim(),
          htmlContent: htmlContent || '',
          tags: tags,
          attachments: [],
          bgColor: '',
          completed: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          completedAt: null
        };
        todos.unshift(newTodo);
        await saveTodos();
        renderTodos();
        updateStats();
        return { success: true, message: '已建立 ToDo 卡片' };
      } catch (err) {
        return { success: false, message: err.message };
      }
    };

    function startResize(event, id) {
      event.preventDefault();
      event.stopPropagation();
      resizingId = id;
      resizingEl = document.querySelector(`.todo-item[data-id="${id}"]`);
      if (!resizingEl) return;
      const rect = resizingEl.getBoundingClientRect();
      // 记录起始坐标和尺寸（宽高都处理）
      resizingStartY = event.clientY;
      resizingStartH = rect.height;
      resizingStartX = event.clientX;
      resizingStartW = rect.width;
      resizingEl.setAttribute('data-height', 'true');
      resizingEl.setAttribute('data-width', 'true');
      // 拖拽时强制脱离 flex 弹性分配，使用固定像素宽度
      // 无论卡片之前是否有自定义宽度，都统一使用 width 固定尺寸
      resizingEl.style.flex = '0 0 auto';
      resizingEl.style.minWidth = '0';
      resizingEl.style.width = rect.width + 'px';
      resizingEl.style.height = rect.height + 'px';
      resizingEl.style.maxHeight = 'none';
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'nwse-resize';
      document.addEventListener('mousemove', onResize);
      document.addEventListener('mouseup', stopResize);
    }

    function onResize(event) {
      if (!resizingEl) return;
      // 高度调整
      const deltaY = event.clientY - resizingStartY;
      const newHeight = Math.max(MIN_CARD_HEIGHT, resizingStartH + deltaY);
      resizingEl.style.height = newHeight + 'px';
      // 宽度调整：直接使用 width，更直观可靠
      const deltaX = event.clientX - resizingStartX;
      const newWidth = Math.max(MIN_CARD_WIDTH, resizingStartW + deltaX);
      resizingEl.style.width = newWidth + 'px';
      // 实时切换 tiny 态（与 applyTinyStates 一致：1/16 进 tiny 用 cover 铺满，1/20 固定缩到 1/4）
      applyTinyStates();
    }

    async function stopResize() {
      if (resizingEl && resizingId) {
        const rect = resizingEl.getBoundingClientRect();
        const newHeight = Math.round(rect.height);
        const newWidth = Math.round(rect.width);
        const todo = todos.find(t => t.id === resizingId);
        if (todo) {
          todo.height = newHeight;
          todo.width = newWidth;
          // 调整卡片尺寸不视为内容异动，不更新 updatedAt
          await saveTodos();
        }
        const cardId = resizingId;
        // 清除所有拖拽时的内联样式，交由 renderTodos 重新渲染时应用持久化的新尺寸
        resizingEl.style.flex = '';
        resizingEl.style.minWidth = '';
        resizingEl.style.width = '';
        resizingEl.style.height = '';
        resizingEl.style.maxHeight = '';
        // 重建网格：应用新尺寸 + Muuri 重新填空隙排版（卡片会落到最终位置）
        renderTodos();
        // 等 Muuri 布局动画稳定后，把卡片滚入可视区并金边呼吸 3 秒
        setTimeout(() => focusResizedCard(cardId), 320);
      }
      resizingId = null;
      resizingEl = null;
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      document.removeEventListener('mousemove', onResize);
      document.removeEventListener('mouseup', stopResize);
    }

    // 拖拽调整完卡片尺寸后：把卡片自动滚入可视区，并加金边心跳高亮 3 秒
    function focusResizedCard(id) {
      const card = document.querySelector(`.todo-item[data-id="${id}"]`);
      if (!card) return;
      scrollCardIntoView(card);
      card.classList.add('resize-focus');
      setTimeout(() => card.classList.remove('resize-focus'), 3000);
    }

    // 将卡片滚动到 .todo-list 滚动容器的可视区域内（能居中则居中，过高则顶部对齐）
    function scrollCardIntoView(card) {
      const container = document.getElementById('todoList');
      if (!container || !card) return;
      const cRect = container.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      const cardH = cardRect.height;
      const contH = container.clientHeight;
      const delta = cardRect.top - cRect.top; // 卡片相对容器可视顶部的偏移
      // 已在可视区内则不动
      if (delta >= 0 && delta + cardH <= contH) return;
      let target;
      if (cardH <= contH) {
        target = container.scrollTop + delta - (contH - cardH) / 2; // 居中显示
      } else {
        target = container.scrollTop + delta - 12; // 顶部留 12px
      }
      container.scrollTop = Math.max(0, target);
    }

    async function resetCardSize(event, id) {
      event.preventDefault();
      event.stopPropagation();
      const todo = todos.find(t => t.id === id);
      if (todo) {
        let changed = false;
        if (todo.height) { delete todo.height; changed = true; }
        if (todo.width) { delete todo.width; changed = true; }
        if (changed) {
          // 重置卡片尺寸不视为内容异动，不更新 updatedAt
          await saveTodos();
        }
      }
    }

    async function init() {
      await loadTodos();
      renderTagFilter();
      renderTodos();
      updateStats();
      // 父窗口尺寸变化时，重新判断各卡片是否进入 tiny 态
      window.addEventListener('resize', applyTinyStates);
    }

    // 主题由主程式统一控制，通过 CSS 注入实现（主程式 insertCSS 添加 body.dark）
    // 页面加载时从 localStorage 读取初始状态（兼容旧数据）
    (function loadInitialTheme() {
      const saved = localStorage.getItem('todoListTheme');
      if (saved === 'dark') {
        document.body.classList.add('dark');
      }
    })();
    init();

    // 🆕 监听 body class 变化，主题切换时重新渲染卡片
    // 解决：切换主题后 adaptHtmlForTheme 未被重新调用的问题
    const themeObserver = new MutationObserver(() => {
      renderTodos();
    });
    themeObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
      // Cmd+S / Ctrl+S 保存但不关闭编辑窗口
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        saveTask(false);
      }
    });
  </script>
</body>
</html>

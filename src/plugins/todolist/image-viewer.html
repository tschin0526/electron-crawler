<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图片查看</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0a0a0a;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 6px 14px;
    font-size: 12px;
    color: #94a3b8;
    background: rgba(15, 23, 42, 0.85);
    border-bottom: 1px solid #1e293b;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 32px 16px 16px;
  }
  .stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: zoom-in;
    transition: transform .15s ease;
    user-select: none;
    -webkit-user-drag: none;
  }
  .stage img.zoomed { cursor: zoom-out; transform: scale(2); }
  .err {
    color: #f87171;
    font-size: 13px;
    text-align: center;
    padding: 24px;
  }
</style>
</head>
<body>
  <div class="topbar" id="title">图片</div>
  <div class="stage" id="stage">
    <img id="img" alt="" />
  </div>
<script>
  (function () {
    function b64urlDecodeToUtf8(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const bin = atob(s);
      if (typeof TextDecoder !== 'undefined') {
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      }
      return decodeURIComponent(escape(bin));
    }
    let data = {};
    try {
      const raw = location.hash.slice(1);
      if (raw) data = JSON.parse(b64urlDecodeToUtf8(raw));
    } catch (e) {
      document.getElementById('stage').innerHTML = '<div class="err">数据解析失败：' + e.message + '</div>';
      return;
    }
    const src = data.src;
    const title = data.title || '图片';
    if (!src) {
      document.getElementById('stage').innerHTML = '<div class="err">缺少图片路径</div>';
      return;
    }
    document.getElementById('title').textContent = title;
    document.title = title;
    const img = document.getElementById('img');
    img.src = src;
    img.alt = title;
    img.addEventListener('error', function () {
      document.getElementById('stage').innerHTML = '<div class="err">图片加载失败：' + src + '</div>';
    });
    img.addEventListener('click', function () {
      img.classList.toggle('zoomed');
    });
  })();
</script>
</body>
</html>

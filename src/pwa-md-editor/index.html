    <!-- 主編輯區域 -->
    <main class="editor-container" id="editor-container" data-view="edit" data-page-node-id="4lifpnYRioAK2vdbugOaDi">
      <div id="editor-pane" class="pane editor-pane region" data-page-node-id="1mwUIwO64NpAhDQXx0d0WX">
        <textarea id="editor" class="editor" placeholder="在此輸入內容...&#10;&#10;支持從 iCloud Drive 開啟 .md / .json / .html / 程式碼等文字檔進行編輯"></textarea>
      </div>
      <div id="preview-pane" class="pane preview-pane region" data-page-node-id="EYhIlTOhzwJjMUzU6PWw9A">
        <div id="preview" class="preview" data-page-node-id="nVFjSH28JrcvAirXNDtYaa"></div>
      </div>
      <!-- 📅 行程視圖（calendar.md 專用）：解析 ## EVENT 塊渲染行程列表；支持月視圖與新增/編輯（寫回編輯緩衝，按「保存」落盤） -->
      <div id="events-pane" class="pane events-pane region">
        <div class="ev-toolbar">
          <div class="ev-mode-seg">
            <button type="button" id="ev-mode-list" class="active">列表</button>
            <button type="button" id="ev-mode-month">月</button>
          </div>
          <span class="ev-toolbar-flex"></span>
          <button type="button" class="ev-add-btn" id="ev-add-btn">＋ 新增行程</button>
        </div>
        <div class="ev-monthnav" id="ev-month-nav" style="display:none">
          <button type="button" id="ev-prev-month">‹</button>
          <span id="ev-month-title"></span>
          <button type="button" id="ev-next-month">›</button>
          <button type="button" class="ev-today-mini" id="ev-today-btn">今天</button>
        </div>
        <div id="events-list" class="events-list"></div>
        <div id="ev-month-wrap" style="display:none">
          <div id="ev-month-grid" class="ev-month-grid"></div>
          <div id="ev-day-list" class="events-list"></div>
        </div>
      </div>
    </main>

    <!-- 狀態列 -->
    <footer class="status-bar region" data-page-node-id="OAnAmY1sLt9LHhmDhPeEAH">
      <span id="status-text" data-page-node-id="bhkNGBPkRTRvAYWDy9wkTL">就緒</span>
      <span id="word-count" data-page-node-id="MFWuklNNkJsAx2eMV7kL6z"></span>
      <span id="app-version" class="app-version" title="應用版本" data-page-node-id="S3rRxZotQbka1m6KGv6eN7"></span>
    </footer>

    <!-- 提示消息 -->
    <div id="toast" class="toast hidden" data-page-node-id="YGJVJYLNtM72nHCk1lJbHb"></div>

    <!-- 📅 行程新增/編輯表單（calendar.md 專用）：保存到編輯緩衝，再按頂欄「保存」寫回文件 -->
    <div id="ev-form-overlay" class="ev-form-overlay" style="display:none">
      <div class="ev-form-box">
        <div class="ev-form-title" id="ev-form-title">新增行程</div>
        <label class="ev-f-label">標題<input type="text" id="ev-f-title" maxlength="200" placeholder="行程標題"></label>
        <label class="ev-f-label">日期<input type="date" id="ev-f-date"></label>
        <label class="ev-f-check"><input type="checkbox" id="ev-f-allday"> 全天</label>
        <div class="ev-f-row">
          <label class="ev-f-label">開始<input type="time" id="ev-f-start"></label>
          <label class="ev-f-label">結束<input type="time" id="ev-f-end"></label>
        </div>
        <label class="ev-f-label">地點<input type="text" id="ev-f-location" maxlength="200" placeholder="可留空"></label>
        <div class="ev-f-label">顏色<div id="ev-f-colors" class="ev-f-colors"></div></div>
        <label class="ev-f-label">標籤（逗號分隔）<input type="text" id="ev-f-tags" maxlength="200" placeholder="例如：生活, 工作"></label>
        <label class="ev-f-label">備註<textarea id="ev-f-notes" rows="3" placeholder="可留空，支持多行"></textarea>
          <!-- ↕ 拖拽手柄：iOS Safari 不支持 textarea 原生 resize 手柄，自绘实现上下拉动高度 -->
          <div class="ev-f-resize" id="ev-f-resize" title="拖動調整備註框高度"><span></span></div>
        </label>
        <div class="ev-form-actions">
          <button type="button" class="btn btn-secondary" id="ev-form-delete" style="display:none">刪除</button>
          <span class="ev-toolbar-flex"></span>
          <button type="button" class="btn btn-secondary" id="ev-form-cancel">取消</button>
          <button type="button" class="btn btn-primary" id="ev-form-save">寫入編輯內容</button>
        </div>
        <div class="ev-form-hint">寫入後按頂欄「保存」，在分享面板選「儲存到檔案」→ 覆蓋原 calendar.md</div>
      </div>
    </div>
  </div>

  <!-- Markdown 渲染管線（從 todo 編輯器移植的擴展語法支援），必須在 app.js 之前載入 -->
  <script src="md-renderer.js"></script>
  <script src="app.js"></script>
</body>
